<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三年級｜10000以內四位數加減</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--text:#263238;--blue:#3498db;--orange:#e67e22;--green:#27ae60;--red:#e74c3c;--line:#333;--muted:#718096}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);font-family:"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text)}
body{overflow-x:hidden}.page{display:none;width:100%;max-width:700px;min-height:100vh;margin:auto;padding:18px 14px 28px;flex-direction:column;align-items:center}.page.active{display:flex}
.title{font-size:1.7rem;font-weight:800;margin:12px 0 6px}.subtitle{color:var(--muted);font-size:.98rem;text-align:center;margin-bottom:12px}
#menu-list{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.btn-menu{padding:18px 8px;font-size:1.08rem;border:0;border-radius:14px;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.16)}.btn-menu:active,.btn-main:active,.btn-move:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.16)}.add{background:var(--blue)}.sub{background:var(--orange)}.mix{background:#8e44ad}.carry{background:#16a085}.borrow{background:#c0392b}.hint{margin-top:20px;background:#fff;border-radius:16px;padding:14px 16px;width:100%;line-height:1.7;font-size:.95rem;color:#4a5568}
.info-bar{display:flex;justify-content:space-between;width:94%;font-weight:800;margin:4px 0 6px}.progress{width:94%;height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:15px}.bar{height:100%;width:0;background:var(--green);transition:.3s}
.mode-label{font-size:1rem;font-weight:800;padding:6px 14px;border-radius:20px;background:#fff;margin-bottom:8px}.instruction{min-height:30px;text-align:center;font-weight:700;color:#4a5568;margin-bottom:5px}
.top-question{display:flex;align-items:center;justify-content:center;gap:10px;margin:5px 0 14px}.q-text{font-size:1.8rem;font-weight:900;letter-spacing:1px}.final-ans{width:115px;height:50px;font-size:1.85rem;text-align:center;border:3px solid #333;border-radius:10px;background:#fff;outline:none;-moz-appearance:textfield}.final-ans::-webkit-outer-spin-button,.final-ans::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.btn-main{padding:11px 18px;font-size:1.08rem;font-weight:800;color:#fff;background:var(--green);border:0;border-radius:11px;box-shadow:0 4px 0 #219653;cursor:pointer}
.math-card{background:var(--card);padding:16px 12px 14px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.1);width:100%;display:flex;justify-content:center;align-items:center;gap:12px}.vertical{display:grid;grid-template-columns:42px repeat(5,54px);gap:4px;align-items:center}.header{font-weight:800;color:#64748b;font-size:1rem;text-align:center;height:25px}.place{font-size:.72rem;color:#94a3b8;text-align:center;height:18px}.cell{width:54px;height:50px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;font-family:"Courier New",monospace}.clickable-digit{position:relative;cursor:pointer;user-select:none;border-radius:8px;transition:.12s}.clickable-digit.marked{background:#dbeafe}.clickable-digit.marked::after{content:"/";position:absolute;color:var(--red);font-size:3rem;font-weight:900;line-height:1;transform:rotate(35deg);left:50%;top:50%;translate:-50% -50%;pointer-events:none}.clickable-digit:hover{background:rgba(52,152,219,.08)}.carry-cell{width:54px;height:34px;border:1.5px dashed #aaa;border-radius:7px;text-align:center;font-size:1.15rem;font-weight:900;color:var(--red);letter-spacing:-1px;outline:none;background:#fff;-moz-appearance:textfield;padding:0 2px}.carry-cell::-webkit-outer-spin-button,.carry-cell::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.carry-cell:focus,.digit-input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(52,152,219,.12)}.carry-row{display:contents}.digit-input{width:48px;height:46px;border:2px solid #cbd5e0;border-radius:8px;text-align:center;font-size:1.8rem;font-weight:900;font-family:"Courier New",monospace;outline:none;background:#fff;-moz-appearance:textfield}.digit-input::-webkit-outer-spin-button,.digit-input::-webkit-inner-spin-button{ -webkit-appearance:none;margin:0 }.op{font-size:2rem;font-weight:900;color:var(--red);text-align:center}.line{grid-column:1/-1;border-bottom:3px solid #333;height:4px;margin:1px 0 2px}.explain{width:100%;margin-top:12px;background:#fff;border-radius:14px;padding:11px 14px;color:#475569;font-size:.94rem;line-height:1.65}.feedback{height:34px;margin-top:12px;font-size:1.1rem;font-weight:800;text-align:center}.controls{display:flex;align-items:center;gap:10px;margin-top:4px}.btn-move{width:55px;height:55px;border:0;border-radius:50%;background:#f39c12;color:#fff;font-weight:900;font-size:1.25rem;box-shadow:0 4px 0 #d35400;cursor:pointer}.secondary{background:none;border:0;color:#8a94a6;cursor:pointer;margin-top:10px}
.result{width:90%;background:#fff;border-radius:24px;padding:26px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.14);margin-top:30vh}.score{font-size:1.8rem;color:#f39c12;font-weight:900}.praise{font-size:1.15rem;line-height:1.7;margin:16px 0}.wrong-list{margin-top:12px;text-align:left;background:#f8fafc;border-radius:12px;padding:12px;font-size:.94rem}.balloon{position:fixed;bottom:-100px;width:38px;height:48px;border-radius:50%;animation:up 6s linear forwards;z-index:10}@keyframes up{to{transform:translateY(-120vh)}}
@media(max-width:520px){.vertical{grid-template-columns:34px repeat(5,46px);gap:3px}.cell{width:46px;font-size:1.75rem}.digit-input{width:41px;height:42px;font-size:1.6rem}.carry-cell{width:46px}.math-card{padding:12px 4px}.q-text{font-size:1.5rem}.final-ans{width:96px;height:46px;font-size:1.7rem}.top-question{gap:6px}}
</style>
</head>
<body>
<div class="page active" id="home">
  <div class="title">三年級｜四位數加減</div>
  <div class="subtitle">10000 以內的直式計算｜練習進位、退位與 0 的借位</div>
  <div id="menu-list"></div>
  <div class="hint"><b>本單元重點</b><br>① 千、百、十、個位對齊　② 從個位開始計算　③ 加法要注意進位　④ 減法要注意退位　⑤ 特別練習「5000－3」這類連續退位。</div>
</div>

<div class="page" id="game">
  <div class="info-bar"><span>題次：<span id="q-count">1</span>/10</span><span>得分：<span id="score">0</span></span></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="mode-label" id="mode-label"></div>
  <div class="instruction" id="instruction"></div>
  <div class="top-question"><div class="q-text"><span id="q1"></span> <span id="qo"></span> <span id="q2"></span> =</div><input class="final-ans" id="final-ans" type="text" inputmode="numeric" maxlength="5"><button class="btn-main" onclick="check()">送出</button></div>
  <div class="math-card">
    <div class="vertical" id="grid"></div>
    <button class="btn-move" title="把直式答案帶到答案框" aria-label="把直式答案帶到答案框" onclick="moveAndSubmit()">➜</button>
  </div>
  <div class="feedback" id="feedback"></div>
<div style="font-size:.82rem;color:#94a3b8;text-align:center;margin-top:0">右箭頭：把直式答案帶到上方答案框</div>
  <div class="explain" id="explain"></div>
  <button class="secondary" onclick="goHome()">↩ 返回選單</button>
</div>

<div class="page" id="result">
  <div class="result"><h2 id="result-title"></h2><div class="score" id="result-score"></div><div class="praise" id="praise"></div><div class="wrong-list" id="stats"></div><button class="btn-main" onclick="goHome()">再挑戰一次</button></div>
</div>

<script>
let n1=0,n2=0,op='+',correctVal=0,currentType=1,currentQ=1,totalPoints=0,currentQPoints=10,wrongCount=0;

const praisePerfect=['太棒了！你把四位數直式算得又快又準！','千、百、十、個位都站對位置了，漂亮！','進位與退位都難不倒你！'];
const praiseGood=['這次有完成挑戰！把錯題再算一次，會更穩。','計算方法已經掌握了，下一輪注意每一個位值。','很不錯！尤其是遇到 0 時，慢一步檢查就能更準。'];

function initMenu(){
 const types=[
  {id:1,n:'四位數加法',c:'add',d:'基本加法：不進位＋進位'},
  {id:2,n:'四位數減法',c:'sub',d:'基本減法：不退位＋退位'},
  {id:3,n:'減法連續退位',c:'borrow',d:'專練 5000－3 這類題型'},
  {id:4,n:'加法進位挑戰',c:'carry',d:'至少一次進位'},
  {id:5,n:'加減混合',c:'mix',d:'隨機判斷加法或減法'}
 ];
 document.getElementById('menu-list').innerHTML=types.map(t=>
  `<button class="btn-menu ${t.c}" onclick="start(${t.id})">${t.n}<small style="display:block;font-size:.78rem;opacity:.9;margin-top:5px">${t.d}</small></button>`
 ).join('');
}

function start(type){
 currentType=type;currentQ=1;totalPoints=0;wrongCount=0;
 show('game');
 document.getElementById('score').innerText='0';
 loadProblem();
}

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function digits(n){return String(n).padStart(4,'0').split('').map(Number);}

// ===== 加法判斷 =====
function hasCarry(a,b){
 const A=digits(a),B=digits(b);
 let carry=0;
 for(let i=3;i>=0;i--){
  const sum=A[i]+B[i]+carry;
  if(sum>=10)return true;
  carry=0;
 }
 return false;
}

// 明確判斷「完全沒有進位」
function noCarry(a,b){
 const A=digits(a),B=digits(b);
 let carry=0;
 for(let i=3;i>=0;i--){
  if(A[i]+B[i]+carry>=10)return false;
  carry=0;
 }
 return true;
}

// ===== 減法判斷 =====
function hasBorrow(a,b){
 const A=digits(a),B=digits(b);
 let borrow=0;
 for(let i=3;i>=0;i--){
  const x=A[i]-borrow;
  if(x<B[i]){
   borrow=1;
   return true;
  }
  borrow=0;
 }
 return false;
}

function noBorrow(a,b){
 const A=digits(a),B=digits(b);
 let borrow=0;
 for(let i=3;i>=0;i--){
  if(A[i]-borrow<B[i])return false;
  borrow=0;
 }
 return true;
}

// ===== 四位數加法 =====
// mode：mixed / carry / noCarry
function makeAddition(mode){
 for(let k=0;k<1000;k++){
  let a=rand(1000,8999);
  let b=rand(1000,9999-a);
  if(b<1000)continue;

  const carry=hasCarry(a,b);
  if(mode==='carry' && !carry)continue;
  if(mode==='noCarry' && carry)continue;
  if(a+b>10000)continue;

  return [a,b,'+'];
 }

 // 理論上不會走到這裡；保底題也不超過 10000
 if(mode==='carry')return [6379,3621,'+']; // 10000，必有進位
 if(mode==='noCarry')return [1234,2345,'+'];
 return [3210,4567,'+'];
}

// ===== 四位數減法 =====
// mode：mixed / borrow / noBorrow / chain
function makeSubtraction(mode){
 for(let k=0;k<1000;k++){
  let a=rand(1000,9999);
  let b=rand(1,a);

  const borrow=hasBorrow(a,b);

  if(mode==='borrow' && !borrow)continue;
  if(mode==='noBorrow' && borrow)continue;

  if(mode==='chain'){
   // 必須真的跨過 0 借位，例如 5000－3、7000－8、4000－25。
   const crossesZero=(a%1000===0 && b<1000) ||
                     (Math.floor(a/100)%10===0 && b<100);
   if(!crossesZero || !borrow)continue;
  }

  return [a,b,'-'];
 }

 if(mode==='chain')return [5000,3,'-'];
 if(mode==='borrow')return [6200,185,'-'];
 if(mode==='noBorrow')return [8765,1234,'-'];
 return [7654,3210,'-'];
}

function loadProblem(){
 let q;

 if(currentType===1){
  // 基本加法：明確混合「不進位」與「有進位」，不是靠嘗試次數碰運氣。
  q=Math.random()<0.5?makeAddition('noCarry'):makeAddition('carry');
 }else if(currentType===2){
  // 基本減法：明確混合「不退位」與「有退位」。
  q=Math.random()<0.5?makeSubtraction('noBorrow'):makeSubtraction('borrow');
 }else if(currentType===3){
  q=makeSubtraction('chain');
 }else if(currentType===4){
  q=makeAddition('carry');
 }else{
  q=Math.random()<0.5
    ?(Math.random()<0.5?makeAddition('noCarry'):makeAddition('carry'))
    :(Math.random()<0.5?makeSubtraction('noBorrow'):makeSubtraction('borrow'));
 }

 [n1,n2,op]=q;
 correctVal=op==='+'?n1+n2:n1-n2;
 currentQPoints=10;

 const labels={1:'四位數加法',2:'四位數減法',3:'連續退位',4:'進位挑戰',5:'加減混合'};
 document.getElementById('mode-label').innerText=labels[currentType];
 document.getElementById('instruction').innerText=
  op==='+'
   ?'從個位開始，加起來滿 10 要進位。'
   :'從個位開始，下面的數比較大時要退位；遇到 0 要繼續向前找可以借的位數。';

 document.getElementById('q1').innerText=n1;
 document.getElementById('qo').innerText=op;
 document.getElementById('q2').innerText=n2;
 document.getElementById('q-count').innerText=currentQ;
 document.getElementById('score').innerText=totalPoints;
 document.getElementById('bar').style.width=((currentQ-1)/10*100)+'%';
 document.getElementById('final-ans').value='';
 document.getElementById('feedback').innerText='';

 renderGrid();
 renderExplain();
}

function renderGrid(){
 const A=digits(n1),B=digits(n2);
 const isFive=correctVal===10000;

 /*
  固定 6 欄：說明／符號 + 萬 + 千 + 百 + 十 + 個
  四位數一律放在「千、百、十、個」四欄。
  因此 6379 + 6658 必定是：
       萬 千 百 十 個
          6  3  7  9
          6  6  5  8
  答案也完全使用同一組欄位。
 */
 let html='';
 html+=`<div></div>
         <div class="header">萬</div>
         <div class="header">千</div>
         <div class="header">百</div>
         <div class="header">十</div>
         <div class="header">個</div>`;

 // 進／退位操作區：保留兩列虛線格，不預設名稱，讓孩子自行決定如何記錄。
 html+=`<div></div>
         <div></div>
         <div><input class="carry-cell" id="c-0" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="c-1" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="c-2" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="c-3" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>

         <div></div>
         <div></div>
         <div><input class="carry-cell" id="d-0" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="d-1" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="d-2" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="d-3" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>`;

 // 第一個數：萬位留白，千～個位放四位數；每個數字都可點擊，在數字上加／取消紅色「／」標記。
 html+=`<div></div><div class="cell"></div>`;
 A.forEach((x,i)=>{
  html+=`<div class="cell clickable-digit" data-digit-index="${i}" onclick="toggleBorrowMark(this)" style="color:${i===3?'#2563eb':'#334155'}">${x}</div>`;
 });

 // 第二個數：同樣固定在千～個位。
 html+=`<div class="op">${op}</div><div class="cell"></div>`;
 B.forEach(x=>{html+=`<div class="cell">${x}</div>`;});

 html+=`<div class="line"></div>`;

 // 答案：只有剛好 10000 才使用萬位；其他全部四格，與千～個位完全對齊。
 if(isFive){
  html+=`<div></div>
   <div><input class="digit-input" id="a-0" type="text" inputmode="numeric" maxlength="1" oninput="limitOne(this)"></div>
   <div><input class="digit-input" id="a-1" type="text" inputmode="numeric" maxlength="1" oninput="limitOne(this)"></div>
   <div><input class="digit-input" id="a-2" type="text" inputmode="numeric" maxlength="1" oninput="limitOne(this)"></div>
   <div><input class="digit-input" id="a-3" type="text" inputmode="numeric" maxlength="1" oninput="limitOne(this)"></div>
   <div><input class="digit-input" id="a-4" type="text" inputmode="numeric" maxlength="1" oninput="limitOne(this)"></div>`;
 }else{
  html+=`<div></div><div class="cell"></div>`;
  for(let i=0;i<4;i++){
   html+=`<div><input class="digit-input" id="a-${i}" type="text" inputmode="numeric" maxlength="1" oninput="limitOne(this)"></div>`;
  }
 }

 document.getElementById('grid').innerHTML=html;
}

function renderExplain(){
 const el=document.getElementById('explain');
 if(op==='-' && n2<100 && n1%1000===0){
  el.innerHTML='<b>本題提醒：</b>遇到像「5000－3」時，不能直接向 0 借。要從千位借到百位，再一路傳到個位，最後才算個位。';
 }else if(op==='-'){
  el.innerHTML='<b>檢查：</b>個位 → 十位 → 百位 → 千位。需要退位時，記得前一位要少 1。';
 }else{
  el.innerHTML='<b>檢查：</b>個位 → 十位 → 百位 → 千位。某一位加起來滿 10，就在左邊下一位記進位；本單元答案不超過 10000。';
 }
}

function toggleBorrowMark(el){
 el.classList.toggle('marked');
}

function limitOne(el){
 el.value=el.value.replace(/[^0-9]/g,'').slice(0,1);
}
function limitMark(el){
 el.value=el.value.replace(/[^0-9]/g,'').slice(0,1);
}

function moveAndSubmit(){
 const count=correctVal===10000?5:4;
 let v='';
 for(let i=0;i<count;i++){
  const x=document.getElementById(`a-${i}`)?.value||'';
  if(x!=='')v+=x;
 }
 if(v==='')return;
 document.getElementById('final-ans').value=String(parseInt(v,10));
 check();
}

function check(){
 const raw=document.getElementById('final-ans').value.trim();
 if(!/^\d+$/.test(raw))return;
 const userVal=parseInt(raw,10);
 const msg=document.getElementById('feedback');

 if(userVal===correctVal){
  totalPoints+=currentQPoints;
  document.getElementById('score').innerText=totalPoints;
  msg.style.color='var(--green)';
  msg.innerText='答對了！繼續下一題。';
  setTimeout(()=>{
   if(currentQ<10){currentQ++;loadProblem();}
   else showResult();
  },650);
 }else{
  wrongCount++;
  currentQPoints=Math.max(2,currentQPoints-2);
  msg.style.color='var(--red)';
  msg.innerText='再檢查一次：先看個位，再往左算。';
  document.getElementById('final-ans').value='';
  setTimeout(()=>msg.innerText='',1300);
 }
}

function showResult(){
 show('result');
 document.getElementById('result-score').innerText=`總積分：${totalPoints} / 100`;
 document.getElementById('result-title').innerText=totalPoints===100?'全部答對！':'挑戰完成！';
 const arr=totalPoints===100?praisePerfect:praiseGood;
 document.getElementById('praise').innerText=arr[Math.floor(Math.random()*arr.length)];
 document.getElementById('stats').innerText=`10 題完成｜需要重新計算的題目：${wrongCount} 題｜每題最多 10 分，重新嘗試會扣 2 分。`;
}

function show(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
function goHome(){show('home');initMenu();}
window.onload=initMenu;
</script>
</body>
</html>
