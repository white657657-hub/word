<style>

.top-question{display:flex;align-items:center;justify-content:center;gap:10px;margin:5px 0 14px}.q-text{font-size:1.8rem;font-weight:900;letter-spacing:1px;color:#263238}.final-ans{width:115px;height:50px;font-size:1.85rem;font-family:var(--math-font);text-align:center;border:3px solid #333;border-radius:10px;background:#fff;outline:none;-moz-appearance:textfield}.final-ans::-webkit-outer-spin-button,.final-ans::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.btn-main{padding:11px 18px;font-size:1.08rem;font-weight:800;color:#fff;background:var(--green);border:0;border-radius:11px;box-shadow:0 4px 0 #219653;cursor:pointer}
.math-card{background:var(--card);padding:16px 12px 14px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.1);width:100%;display:flex;justify-content:center;align-items:center;gap:12px}.vertical{display:grid;grid-template-columns:42px repeat(5,54px);gap:4px;align-items:center}.header{font-weight:800;color:#64748b;font-size:1rem;text-align:center;height:25px}.place{font-size:.72rem;color:#94a3b8;text-align:center;height:18px}.cell{width:54px;height:50px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;font-family:var(--math-font)}.place-digit{font-family:var(--math-font);font-weight:900}.place-wan{color:var(--place-wan)}.place-qian{color:var(--place-qian)}.place-bai{color:var(--place-bai)}.place-shi{color:var(--place-shi)}.place-ge{color:var(--place-ge)}.answer-wan{border-color:var(--place-wan)!important}.answer-qian{border-color:var(--place-qian)!important}.answer-bai{border-color:var(--place-bai)!important}.answer-shi{border-color:var(--place-shi)!important}.answer-ge{border-color:var(--place-ge)!important}.clickable-digit{position:relative;cursor:pointer;user-select:none;border-radius:8px;transition:.12s}.clickable-digit.marked{background:#dbeafe}.clickable-digit.marked::after{content:"/";position:absolute;color:var(--red);font-size:3rem;font-weight:900;line-height:1;transform:rotate(35deg);left:50%;top:50%;translate:-50% -50%;pointer-events:none}.clickable-digit:hover{background:rgba(52,152,219,.08)}.carry-cell{width:54px;height:34px;border:1.5px dashed #aaa;border-radius:7px;text-align:center;font-size:1.15rem;font-weight:900;font-family:var(--math-font);color:var(--red);letter-spacing:-1px;outline:none;background:#fff;-moz-appearance:textfield;padding:0 2px}.carry-cell::-webkit-outer-spin-button,.carry-cell::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.carry-cell:focus,.digit-input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(52,152,219,.12)}.carry-row{display:contents}.digit-input{width:48px;height:46px;border:2px solid #cbd5e0;border-radius:8px;text-align:center;font-size:1.8rem;font-weight:900;font-family:var(--math-font);outline:none;background:#fff;-moz-appearance:textfield}.digit-input::-webkit-outer-spin-button,.digit-input::-webkit-inner-spin-button{ -webkit-appearance:none;margin:0 }.op{font-size:2rem;font-weight:900;color:var(--red);text-align:center}.line{grid-column:1/-1;border-bottom:3px solid #333;height:4px;margin:1px 0 2px}.explain{width:100%;margin-top:12px;background:#fff;border-radius:14px;padding:11px 14px;color:#475569;font-size:.94rem;line-height:1.65}.feedback{height:34px;margin-top:12px;font-size:1.1rem;font-weight:800;text-align:center}.controls{display:flex;align-items:center;gap:10px;margin-top:4px}.btn-move{width:55px;height:55px;border:0;border-radius:50%;background:#f39c12;color:#fff;font-weight:900;font-size:1.25rem;box-shadow:0 4px 0 #d35400;cursor:pointer}.secondary{background:none;border:0;color:#8a94a6;cursor:pointer;margin-top:10px}
.result{width:90%;background:#fff;border-radius:24px;padding:26px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.14);margin-top:30vh}.score{font-size:1.8rem;color:#f39c12;font-weight:900}.praise{font-size:1.15rem;line-height:1.7;margin:16px 0}.wrong-list{margin-top:12px;text-align:left;background:#f8fafc;border-radius:12px;padding:12px;font-size:.94rem}.balloon{position:fixed;bottom:-100px;width:38px;height:48px;border-radius:50%;animation:up 6s linear forwards;z-index:1000}.confetti-piece{position:fixed;top:-18px;width:10px;height:16px;z-index:1001;pointer-events:none;animation:confetti-fall linear forwards}.celebrate-text{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);z-index:1002;background:#fff;border-radius:22px;padding:14px 22px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:1.55rem;font-weight:900;text-align:center;white-space:nowrap;animation:pop .5s ease-out forwards}.celebrate-text.fade{animation:fade .5s ease-in forwards}@keyframes confetti-fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot));opacity:.95}}@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}@keyframes fade{to{opacity:0;transform:translate(-50%,-50%) scale(1.04)}}@keyframes up{to{transform:translateY(-120vh)}}
@media(max-width:520px){.vertical{grid-template-columns:34px repeat(5,46px);gap:3px}.cell{width:46px;font-size:1.75rem}.digit-input{width:41px;height:42px;font-size:1.6rem}.carry-cell{width:46px}.math-card{padding:12px 4px}.q-text{font-size:1.5rem}.final-ans{width:96px;height:46px;font-size:1.7rem;font-family:var(--math-font)}.top-question{gap:6px}}

:root{
 --place-thousand:#2563eb;
 --place-hundred:#059669;
 --place-ten:#0891b2;

 --place-ten-thousand:#7c3aed;

}

}

<body>
<div class="page active" id="home">
  <div class="title">三年級｜四位數加減</div>
  <div class="subtitle">10000 以內的直式計算｜練習進位、退位與 0 的借位</div>
  <div id="menu-list"></div>
  <div class="hint"><b>本單元重點</b><br>① 千、百、十、個位對齊　② 從個位開始計算　③ 加法要注意進位　④ 減法要注意退位　⑤ 特別練習「5000－3」這類連續退位。</div>
</div>

<div class="page" id="game">
  <div class="practice-status" id="paper-mode-badge"></div>
<div class="info-bar"><span>題次：<span id="q-count">1</span>/10</span><span>得分：<span id="score">0</span></span></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="mode-label" id="mode-label"></div>
  <div class="instruction" id="instruction" aria-hidden="true" style="display:none"></div>
  <div class="top-question"><div class="q-text"><span id="q1"></span> <span id="qo" style="color:#263238"></span> <span id="q2"></span> =</div><input class="final-ans" id="final-ans" type="text" inputmode="numeric" maxlength="5"><button class="btn-main" onclick="check()">送出</button></div>
  <div class="math-card">
    <div class="vertical" id="grid"></div>
    <button class="btn-move" title="把直式答案帶到上方答案框" aria-label="把直式答案帶到上方答案框" onclick="moveAndSubmit()">➜</button>
  </div>
  <div class="feedback" id="feedback"></div>
<div style="font-size:.82rem;color:#94a3b8;text-align:center;margin-top:0">右箭頭：把直式答案帶到上方答案框</div>
  <div class="paper-bridge" id="paper-bridge">
      <strong>紙上也可以這樣算：</strong> 直式位置、計算順序與現在相同。
    </div>
  <button class="secondary" onclick="goHome()">↩ 返回選單</button>
</div>

<div class="page" id="result">
  <div class="result"><h2 id="result-title"></h2><div class="score" id="result-score"></div><div class="praise" id="praise"></div><div class="wrong-list" id="stats"></div><button class="btn-main" onclick="goHome()">再挑戰一次</button></div>
</div>

<script>

function updatePaperBridge(){
    const badge = document.getElementById('paper-mode-badge');
    const bridge = document.getElementById('paper-bridge');

    if(!badge) return;

    // 前 8 題：完整位值顏色輔助。
    // 第 9、10 題：保留直式，但降低顏色依賴，模擬紙本過渡。
    if(currentQ >= 9){
        badge.innerText = '紙本銜接';
        badge.style.color = '#64748b';

        if(bridge){
            bridge.innerHTML =
              '<strong>最後兩題：</strong>試著先看位置，再看顏色。紙上計算也能用同樣的方法。';
        }

        document.body.classList.add('paper-mode');
    }else{
        badge.innerText = '';
        if(bridge){
            bridge.innerHTML =
              '<strong>紙上也可以這樣算：</strong>直式位置、計算順序與現在相同。';
        }
        document.body.classList.remove('paper-mode');
    }
}

function paperBridgeResetMarks(){
    document.querySelectorAll('.clickable-digit.marked').forEach(el=>{
        el.classList.remove('marked');
    });
}

let n1=0,n2=0,op='+',correctVal=0,currentType=1,currentQ=1,totalPoints=0,currentQPoints=10,wrongCount=0;

const praisePerfect=['太棒了！你把四位數直式算得又快又準！','千、百、十、個位都站對位置了，漂亮！','進位與退位都難不倒你！'];
const praiseGood=['這次有完成挑戰！把錯題再算一次，會更穩。','計算方法已經掌握了，下一輪注意每一個位值。','很不錯！尤其是遇到 0 時，慢一步檢查就能更準。'];

function initMenu(){
 const types=[
  {id:1,n:'四位數加法',c:'add',d:'基本加法：不進位＋進位'},
  {id:2,n:'四位數減法',c:'sub',d:'基本減法：不退位＋退位'},
  {id:3,n:'減法連續退位',c:'borrow',d:'專練 5000－3 這類題型'},
  {id:4,n:'加法進位挑戰',c:'carry',d:'至少一次進位'},
  {id:5,n:'加減混合',c:'mix',d:'隨機判斷加法或減法'}
 ];
 document.getElementById('menu-list').innerHTML=types.map(t=>
  `<button class="btn-menu ${t.c}" onclick="start(${t.id})">${t.n}<small style="display:block;font-size:.78rem;opacity:.9;margin-top:5px">${t.d}</small></button>`
 ).join('');
}

function start(type){
 currentType=type;currentQ=1;totalPoints=0;wrongCount=0;
 show('game');
 document.getElementById('score').innerText='0';
 loadProblem();
}

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function digits(n){return String(n).padStart(4,'0').split('').map(Number);}

// ===== 加法判斷 =====
function hasCarry(a,b){
 const A=digits(a),B=digits(b);
 let carry=0;
 for(let i=3;i>=0;i--){
  const sum=A[i]+B[i]+carry;
  if(sum>=10)return true;
  carry=0;
 }
 return false;
}

// 明確判斷「完全沒有進位」
function noCarry(a,b){
 const A=digits(a),B=digits(b);
 let carry=0;
 for(let i=3;i>=0;i--){
  if(A[i]+B[i]+carry>=10)return false;
  carry=0;
 }
 return true;
}

// ===== 減法判斷 =====
function hasBorrow(a,b){
 const A=digits(a),B=digits(b);
 let borrow=0;
 for(let i=3;i>=0;i--){
  const x=A[i]-borrow;
  if(x<B[i]){
   borrow=1;
   return true;
  }
  borrow=0;
 }
 return false;
}

function noBorrow(a,b){
 const A=digits(a),B=digits(b);
 let borrow=0;
 for(let i=3;i>=0;i--){
  if(A[i]-borrow<B[i])return false;
  borrow=0;
 }
 return true;
}

// ===== 四位數加法 =====
// mode：mixed / carry / noCarry
function makeAddition(mode){
 for(let k=0;k<1000;k++){
  let a=rand(1000,8999);
  let b=rand(1000,9999-a);
  if(b<1000)continue;

  const carry=hasCarry(a,b);
  if(mode==='carry' && !carry)continue;
  if(mode==='noCarry' && carry)continue;
  if(a+b>10000)continue;

  return [a,b,'+'];
 }

 // 理論上不會走到這裡；保底題也不超過 10000
 if(mode==='carry')return [6379,3621,'+']; // 10000，必有進位
 if(mode==='noCarry')return [1234,2345,'+'];
 return [3210,4567,'+'];
}

// ===== 四位數減法 =====
// mode：mixed / borrow / noBorrow / chain
function makeSubtraction(mode){
 for(let k=0;k<1000;k++){
  let a=rand(1000,9999);
  let b=rand(1,a);

  const borrow=hasBorrow(a,b);

  if(mode==='borrow' && !borrow)continue;
  if(mode==='noBorrow' && borrow)continue;

  if(mode==='chain'){
   // 必須真的跨過 0 借位，例如 5000－3、7000－8、4000－25。
   const crossesZero=(a%1000===0 && b<1000) ||
                     (Math.floor(a/100)%10===0 && b<100);
   if(!crossesZero || !borrow)continue;
  }

  return [a,b,'-'];
 }

 if(mode==='chain')return [5000,3,'-'];
 if(mode==='borrow')return [6200,185,'-'];
 if(mode==='noBorrow')return [8765,1234,'-'];
 return [7654,3210,'-'];
}

function loadProblem(){
 let q;

 if(currentType===1){
  // 基本加法：明確混合「不進位」與「有進位」，不是靠嘗試次數碰運氣。
  q=Math.random()<0.5?makeAddition('noCarry'):makeAddition('carry');
 }else if(currentType===2){
  // 基本減法：明確混合「不退位」與「有退位」。
  q=Math.random()<0.5?makeSubtraction('noBorrow'):makeSubtraction('borrow');
 }else if(currentType===3){
  q=makeSubtraction('chain');
 }else if(currentType===4){
  q=makeAddition('carry');
 }else{
  q=Math.random()<0.5
    ?(Math.random()<0.5?makeAddition('noCarry'):makeAddition('carry'))
    :(Math.random()<0.5?makeSubtraction('noBorrow'):makeSubtraction('borrow'));
 }

 [n1,n2,op]=q;
 correctVal=op==='+'?n1+n2:n1-n2;
 currentQPoints=10;

 const labels={1:'四位數加法',2:'四位數減法',3:'連續退位',4:'進位挑戰',5:'加減混合'};
 document.getElementById('mode-label').innerText=labels[currentType];
 document.getElementById('instruction').innerText=''; // 
  op==='+'
   ?'從個位開始，加起來滿 10 要進位。'
   :'從個位開始往左算；需要退位時，自己留下記號。遇到 0 要繼續向前找可以借的位數。';

 renderTopQuestion();
 document.getElementById('q-count').innerText=currentQ;
 document.getElementById('score').innerText=totalPoints;
 document.getElementById('bar').style.width=((currentQ-1)/10*100)+'%';
 document.getElementById('final-ans').value='';
 document.getElementById('feedback').innerText='';

 renderGrid();
 renderExplain();
}

function placeClass(index){
  // digits() 回傳 [千,百,十,個]，index 0~3。
  return ['place-qian','place-bai','place-shi','place-ge'][index];
}

function answerClass(index){
  // 四位答案 index 0~3 = 千、百、十、個；10000 的 index 0~4 = 萬、千、百、十、個。
  return correctVal===10000
    ? ['answer-wan','answer-qian','answer-bai','answer-shi','answer-ge'][index]
    : ['answer-qian','answer-bai','answer-shi','answer-ge'][index];
}

function colorizedNumberHTML(value){
  const arr=digits(value);
  let firstNonZero=arr.findIndex(x=>x!==0);
  if(firstNonZero<0) firstNonZero=3;
  return arr.map((x,i)=>{
    const cls=placeClass(i);
    // 題目橫式不補前導 0；但四位數本身的 0 仍保留在原位置。
    if(i<firstNonZero) return '';
    return `<span class="place-digit ${cls}">${x}</span>`;
  }).join('');
}

function renderTopQuestion(){
  const q1=document.getElementById('q1');
  const q2=document.getElementById('q2');
  q1.innerHTML=colorizedNumberHTML(n1);
  q2.innerHTML=colorizedNumberHTML(n2);
  document.getElementById('qo').innerText=op;
}

function renderGrid(){
 const A=digits(n1),B=digits(n2);
 const isFive=correctVal===10000;

 /*
  固定 6 欄：說明／符號 + 萬 + 千 + 百 + 十 + 個
  四位數一律放在「千、百、十、個」四欄。
  因此 6379 + 6658 必定是：
       萬 千 百 十 個
          6  3  7  9
          6  6  5  8
  答案也完全使用同一組欄位。
 */
 let html='';
 html+=`<div></div>
         <div class="header">萬</div>
         <div class="header">千</div>
         <div class="header">百</div>
         <div class="header">十</div>
         <div class="header">個</div>`;

 // 進／退位操作區：保留兩列虛線格，不預設名稱，讓孩子自行決定如何記錄。
 html+=`<div></div>
         <div></div>
         <div><input class="carry-cell" id="c-0" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="c-1" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="c-2" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="c-3" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>

         <div></div>
         <div></div>
         <div><input class="carry-cell" id="d-0" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="d-1" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="d-2" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="d-3" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>`;

 // 第一個數：萬位留白，千～個位放四位數；每個數字都可點擊，在數字上加／取消紅色「／」標記。
 html+=`<div></div><div class="cell"></div>`;
 A.forEach((x,i)=>{
  const cls=placeClass(i);
  if(op==='-'){
    html+=`<div class="cell place-digit ${cls} clickable-digit" data-digit-index="${i}" onclick="toggleBorrowMark(this)">${x}</div>`;
  }else{
    html+=`<div class="cell place-digit ${cls}">${x}</div>`;
  }
 });

 // 第二個數：同樣固定在千～個位。
 html+=`<div class="op">${op}</div><div class="cell"></div>`;
 B.forEach((x,i)=>{html+=`<div class="cell place-digit ${placeClass(i)}">${x}</div>`;});

 html+=`<div class="line"></div>`;

 // 答案：只有剛好 10000 才使用萬位；其他全部四格，與千～個位完全對齊。
 if(isFive){
  html+=`<div></div>`;
  for(let i=0;i<5;i++){
   html+=`<div><input class="digit-input ${answerClass(i)}" id="a-${i}" type="text" inputmode="numeric" maxlength="1" oninput="limitOne(this)"></div>`;
  }
 }else{
  html+=`<div></div><div class="cell"></div>`;
  for(let i=0;i<4;i++){
   html+=`<div><input class="digit-input ${answerClass(i)}" id="a-${i}" type="text" inputmode="numeric" maxlength="1" oninput="limitOne(this)"></div>`;
  }
 }

 document.getElementById('grid').innerHTML=html;
}

function renderExplain(){
 const el=document.getElementById('explain');
 if(op==='-' && n2<100 && n1%1000===0){
  el.innerHTML='<b>本題提醒：</b>遇到像「5000－3」時，不能直接向 0 借。要從千位借到百位，再一路傳到個位，最後才算個位。';
 }else if(op==='-'){
  el.innerHTML='<b>檢查：</b>個位 → 十位 → 百位 → 千位。需要退位時，記得前一位要少 1。';
 }else{
  el.innerHTML='<b>檢查：</b>個位 → 十位 → 百位 → 千位。某一位加起來滿 10，就在左邊下一位記進位；本單元答案不超過 10000。';
 }
}

function toggleBorrowMark(el){
 el.classList.toggle('marked');
}

function limitOne(el){
 el.value=el.value.replace(/[^0-9]/g,'').slice(0,1);
}
function limitMark(el){
 el.value=el.value.replace(/[^0-9]/g,'').slice(0,1);
}

function moveAndSubmit(){
 const count=correctVal===10000?5:4;
 let v='';
 for(let i=0;i<count;i++){
  const x=document.getElementById(`a-${i}`)?.value||'';
  if(x!=='')v+=x;
 }
 if(v==='')return;
 document.getElementById('final-ans').value=String(parseInt(v,10));
 check();
}

];

function randomItem(arr){return arr[Math.floor(Math.random()*arr.length)];}

function celebrateCorrect(){
  const text=document.createElement('div');
  text.className='celebrate-text';
  text.textContent=randomItem(praiseFast);
  document.body.appendChild(text);
  setTimeout(()=>{text.classList.add('fade');setTimeout(()=>text.remove(),500)},850);

  const pieces=Array.from({length:90},(_,i)=>{
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=(Math.random()*100)+'vw';
    p.style.width=(6+Math.random()*8)+'px';
    p.style.height=(8+Math.random()*13)+'px';
    p.style.background=['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899'][Math.floor(Math.random()*6)];
    p.style.setProperty('--dx',((Math.random()-.5)*45)+'vw');
    p.style.setProperty('--rot',(Math.random()*1080-540)+'deg');
    p.style.animationDuration=(1.8+Math.random()*1.8)+'s';
    p.style.animationDelay=(Math.random()*.25)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),4500);
    return p;
  });
}

function check(){
 const raw=document.getElementById('final-ans').value.trim();
 if(!/^\d+$/.test(raw))return;
 const userVal=parseInt(raw,10);
 const msg=document.getElementById('feedback');

 if(userVal===correctVal){
  celebrateCorrect();
  totalPoints+=currentQPoints;
  document.getElementById('score').innerText=totalPoints;
  msg.style.color='var(--green)';
  msg.innerText='答對了！繼續下一題。';
  setTimeout(()=>{
   if(currentQ<10){currentQ++;loadProblem();}
   else showResult();
  },650);
 }else{
  wrongCount++;
  currentQPoints=Math.max(2,currentQPoints-2);
  msg.style.color='var(--red)';
  msg.innerText='再檢查一次：先看個位，再往左算。';
  document.getElementById('final-ans').value='';
  setTimeout(()=>msg.innerText='',1300);
 }
}

function showResult(){
 show('result');
 document.getElementById('result-score').innerText=`總積分：${totalPoints} / 100`;
 document.getElementById('result-title').innerText=totalPoints===100?'全部答對！':'挑戰完成！';
 const arr=totalPoints===100?praisePerfect:praiseGood;
 document.getElementById('praise').innerText=arr[Math.floor(Math.random()*arr.length)];
 document.getElementById('stats').innerText=`10 題完成｜需要重新計算的題目：${wrongCount} 題｜每題最多 10 分，重新嘗試會扣 2 分。`;
}

function show(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
function goHome(){show('home');initMenu();}
window.onload=initMenu;

document.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
        const active = document.activeElement;
        if(active && (
            active.classList.contains('digit-input') ||
            active.classList.contains('final-ans') ||
            active.classList.contains('carry-cell')
        )){
            e.preventDefault();
            const finalInput = document.getElementById('final-ans');
            if(finalInput && active !== finalInput && typeof moveAndSubmit === 'function'){
                moveAndSubmit();
            }else if(typeof check === 'function'){
                check();
            }
        }
    }
});
