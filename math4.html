<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三年級｜10000以內四位數加減</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--text:#263238;--blue:#3498db;--orange:#e67e22;--green:#27ae60;--red:#e74c3c;--line:#333;--muted:#718096}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);font-family:"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text)}
body{overflow-x:hidden}.page{display:none;width:100%;max-width:700px;min-height:100vh;margin:auto;padding:18px 14px 28px;flex-direction:column;align-items:center}.page.active{display:flex}
.title{font-size:1.7rem;font-weight:800;margin:12px 0 6px}.subtitle{color:var(--muted);font-size:.98rem;text-align:center;margin-bottom:12px}
#menu-list{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.btn-menu{padding:18px 8px;font-size:1.08rem;border:0;border-radius:14px;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.16)}.btn-menu:active,.btn-main:active,.btn-move:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.16)}.add{background:var(--blue)}.sub{background:var(--orange)}.mix{background:#8e44ad}.carry{background:#16a085}.borrow{background:#c0392b}.hint{margin-top:20px;background:#fff;border-radius:16px;padding:14px 16px;width:100%;line-height:1.7;font-size:.95rem;color:#4a5568}
.info-bar{display:flex;justify-content:space-between;width:94%;font-weight:800;margin:4px 0 6px}.progress{width:94%;height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:15px}.bar{height:100%;width:0;background:var(--green);transition:.3s}
.mode-label{font-size:1rem;font-weight:800;padding:6px 14px;border-radius:20px;background:#fff;margin-bottom:8px}.instruction{min-height:30px;text-align:center;font-weight:700;color:#4a5568;margin-bottom:5px}
.top-question{display:flex;align-items:center;justify-content:center;gap:10px;margin:5px 0 14px}.q-text{font-size:2rem;font-weight:900;letter-spacing:1px}.final-ans{width:125px;height:54px;font-size:2rem;text-align:center;border:3px solid #333;border-radius:10px;background:#fff;outline:none}.btn-main{padding:11px 18px;font-size:1.08rem;font-weight:800;color:#fff;background:var(--green);border:0;border-radius:11px;box-shadow:0 4px 0 #219653;cursor:pointer}
.math-card{background:var(--card);padding:16px 12px 14px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.1);width:100%;display:flex;justify-content:center;align-items:center;gap:12px}.vertical{display:grid;grid-template-columns:36px repeat(5,54px);gap:4px;align-items:center}.header{font-weight:800;color:#64748b;font-size:1rem;text-align:center;height:25px}.place{font-size:.72rem;color:#94a3b8;text-align:center;height:18px}.cell{width:54px;height:50px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;font-family:"Courier New",monospace}.carry-cell{width:42px;height:30px;border:1.5px dashed #aaa;border-radius:7px;text-align:center;font-size:1rem;font-weight:800;color:var(--red);outline:none}.carry-cell:focus,.digit-input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(52,152,219,.12)}.digit-input{width:48px;height:46px;border:2px solid #cbd5e0;border-radius:8px;text-align:center;font-size:1.8rem;font-weight:900;font-family:"Courier New",monospace;outline:none}.op{font-size:2rem;font-weight:900;color:var(--red);text-align:center}.line{grid-column:1/-1;border-bottom:3px solid #333;height:4px;margin:1px 0 2px}.explain{width:100%;margin-top:12px;background:#fff;border-radius:14px;padding:11px 14px;color:#475569;font-size:.94rem;line-height:1.65}.feedback{height:34px;margin-top:12px;font-size:1.1rem;font-weight:800;text-align:center}.controls{display:flex;align-items:center;gap:10px;margin-top:4px}.btn-move{width:55px;height:55px;border:0;border-radius:50%;background:#f39c12;color:#fff;font-weight:900;font-size:1.25rem;box-shadow:0 4px 0 #d35400;cursor:pointer}.secondary{background:none;border:0;color:#8a94a6;cursor:pointer;margin-top:10px}
.result{width:90%;background:#fff;border-radius:24px;padding:26px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.14);margin-top:30vh}.score{font-size:1.8rem;color:#f39c12;font-weight:900}.praise{font-size:1.15rem;line-height:1.7;margin:16px 0}.wrong-list{margin-top:12px;text-align:left;background:#f8fafc;border-radius:12px;padding:12px;font-size:.94rem}.balloon{position:fixed;bottom:-100px;width:38px;height:48px;border-radius:50%;animation:up 6s linear forwards;z-index:10}@keyframes up{to{transform:translateY(-120vh)}}
@media(max-width:520px){.vertical{grid-template-columns:30px repeat(5,46px);gap:3px}.cell{width:46px;font-size:1.75rem}.digit-input{width:41px;height:42px;font-size:1.6rem}.carry-cell{width:36px}.math-card{padding:12px 4px}.q-text{font-size:1.65rem}.final-ans{width:100px;height:48px}.top-question{gap:6px}}
</style>
</head>
<body>
<div class="page active" id="home">
  <div class="title">三年級｜四位數加減</div>
  <div class="subtitle">10000 以內的直式計算｜練習進位、退位與 0 的借位</div>
  <div id="menu-list"></div>
  <div class="hint"><b>本單元重點</b><br>① 千、百、十、個位對齊　② 從個位開始計算　③ 加法要注意進位　④ 減法要注意退位　⑤ 特別練習「5000－3」這類連續退位。</div>
</div>

<div class="page" id="game">
  <div class="info-bar"><span>題次：<span id="q-count">1</span>/10</span><span>得分：<span id="score">0</span></span></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="mode-label" id="mode-label"></div>
  <div class="instruction" id="instruction"></div>
  <div class="top-question"><div class="q-text"><span id="q1"></span> <span id="qo"></span> <span id="q2"></span> =</div><input class="final-ans" id="final-ans" type="number" inputmode="numeric"><button class="btn-main" onclick="check()">送出</button></div>
  <div class="math-card">
    <div class="vertical" id="grid"></div>
    <button class="btn-move" title="用直式答案送出" onclick="moveAndSubmit()">➜</button>
  </div>
  <div class="feedback" id="feedback"></div>
  <div class="explain" id="explain"></div>
  <button class="secondary" onclick="goHome()">↩ 返回選單</button>
</div>

<div class="page" id="result">
  <div class="result"><h2 id="result-title"></h2><div class="score" id="result-score"></div><div class="praise" id="praise"></div><div class="wrong-list" id="stats"></div><button class="btn-main" onclick="goHome()">再挑戰一次</button></div>
</div>

<script>
let n1=0,n2=0,op='+',correctVal=0,currentType=1,currentQ=1,totalPoints=0,currentQPoints=10,wrongCount=0,attempts=0;
const praisePerfect=['太棒了！你把四位數直式算得又快又準！','千、百、十、個位都站對位置了，漂亮！','進位與退位都難不倒你！'];
const praiseGood=['這次有完成挑戰！把錯題再算一次，會更穩。','計算方法已經掌握了，下一輪注意每一個位值。','很不錯！尤其是遇到 0 時，慢一步檢查就能更準。'];

function initMenu(){
 const types=[
  {id:1,n:'四位數加法',c:'add',d:'基本加法：含進位與不進位'},
  {id:2,n:'四位數減法',c:'sub',d:'基本減法：含退位與不退位'},
  {id:3,n:'減法連續退位',c:'borrow',d:'專練 5000－3 這類題型'},
  {id:4,n:'加法進位挑戰',c:'carry',d:'多個位數需要進位'},
  {id:5,n:'加減混合',c:'mix',d:'隨機判斷該用加法或減法'}
 ];
 document.getElementById('menu-list').innerHTML=types.map(t=>`<button class="btn-menu ${t.c}" onclick="start(${t.id})">${t.n}<small style="display:block;font-size:.78rem;opacity:.9;margin-top:5px">${t.d}</small></button>`).join('');
}
function start(type){currentType=type;currentQ=1;totalPoints=0;wrongCount=0;attempts=0;show('game');document.getElementById('score').innerText=0;loadProblem();}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function digits(n){return String(n).padStart(4,'0').split('').map(Number);}
function hasCarry(a,b){let A=digits(a),B=digits(b),c=0;for(let i=3;i>=0;i--){if(A[i]+B[i]+c>=10)return true;c=A[i]+B[i]+c>=10?1:0;}return false;}
function hasBorrow(a,b){let A=digits(a),B=digits(b),borrow=0,yes=false;for(let i=3;i>=0;i--){let x=A[i]-borrow;if(x<B[i]){yes=true;borrow=1;}else borrow=0;}return yes;}
function makeAddition(mode){
 let a,b;
 for(let k=0;k<100;k++){
  a=rand(1000,9999); b=rand(1000,9999); if(a+b>99999)continue;
  const carry=hasCarry(a,b);
  if(mode==='carry' && !carry)continue;
  if(mode==='basic' && k<30 && carry)continue;
  return [a,b,'+'];
 }
 return [rand(1000,4999),rand(1000,4999),'+'];
}
function makeSubtraction(mode){
 let a,b;
 for(let k=0;k<200;k++){
  a=rand(1000,9999); b=rand(1,Math.min(9999,a));
  const borrow=hasBorrow(a,b);
  if(mode==='chain'){
   // 特別保留跨 0 的連續退位題，例如 5000-3、7000-8、4000-25
   if(!(a%1000===0 || (Math.floor(a/100)%10===0 && b<100)))continue;
   if(!borrow)continue;
  }
  if(mode==='basic' && k<40 && borrow)continue;
  return [a,b,'-'];
 }
 return [5000,3,'-'];
}
function loadProblem(){
 let q;
 if(currentType===1)q=makeAddition('basic');
 else if(currentType===2)q=makeSubtraction('basic');
 else if(currentType===3)q=makeSubtraction('chain');
 else if(currentType===4)q=makeAddition('carry');
 else {if(Math.random()<.5)q=makeAddition('basic');else q=makeSubtraction('basic');}
 [n1,n2,op]=q;correctVal=op==='+'?n1+n2:n1-n2;currentQPoints=10;
 const labels={1:'四位數加法',2:'四位數減法',3:'連續退位',4:'進位挑戰',5:'加減混合'};
 document.getElementById('mode-label').innerText=labels[currentType];
 document.getElementById('instruction').innerText=op==='+'?'從個位開始，加起來滿 10 要進位。':'從個位開始，下面的數比較大時要退位；遇到 0 要繼續向前找可以借的位數。';
 document.getElementById('q1').innerText=n1;document.getElementById('qo').innerText=op;document.getElementById('q2').innerText=n2;
 document.getElementById('q-count').innerText=currentQ;document.getElementById('score').innerText=totalPoints;document.getElementById('bar').style.width=((currentQ-1)/10*100)+'%';
 document.getElementById('final-ans').value='';document.getElementById('feedback').innerText='';
 renderGrid();renderExplain();
}
function renderGrid(){
 const A=digits(n1),B=digits(n2);const names=['千','百','十','個'];
 const five=correctVal>=10000; let html='<div></div>'+ (five?'<div class="header">萬</div>':'<div class="header"></div>') + names.map(x=>`<div class="header">${x}</div>`).join('');
 html+='<div class="place">進/退位</div>'+ (five?'<div></div>':'<div></div>') + [0,1,2,3].map(i=>`<div><input class="carry-cell" id="c-${i}" type="text" inputmode="numeric" maxlength="2" oninput="limitMark(this)"></div>`).join('');
 html+='<div></div>'+ (five?'':'<div class="cell"></div>') + A.map((x,i)=>`<div class="cell" style="color:${i===3?'#2563eb':'#334155'}">${x}</div>`).join('');
 html+=`<div class="op">${op}</div>`+ (five?'':'<div class="cell"></div>') + B.map(x=>`<div class="cell">${x}</div>`).join('');
 html+='<div class="line"></div>';
 html+='<div></div>'+ (five?'':'<div class="cell"></div>') +[0,1,2,3].map(i=>`<div><input class="digit-input" id="a-${i}" type="number" inputmode="numeric" maxlength="1" oninput="limitOne(this)"></div>`).join('');
 document.getElementById('grid').innerHTML=html;
}
function renderExplain(){
 const el=document.getElementById('explain');
 if(op==='-' && n2<100 && n1%1000===0)el.innerHTML='<b>本題提醒：</b>遇到像「5000－3」時，不能直接向 0 借。要從千位借到百位，再一路傳到個位，最後才算個位。';
 else if(op==='-')el.innerHTML='<b>檢查：</b>個位 → 十位 → 百位 → 千位。需要退位時，記得前一位要少 1。';
 else el.innerHTML='<b>檢查：</b>個位 → 十位 → 百位 → 千位。某一位加起來滿 10，就在左邊下一位記進位。';
}
function limitOne(el){el.value=el.value.replace(/[^0-9]/g,'').slice(0,1);}
function limitMark(el){el.value=el.value.replace(/[^0-9]/g,'').slice(0,2);}
function moveAndSubmit(){let v='';for(let i=0;i<4;i++){const x=document.getElementById('a-'+i).value;if(x!=='')v+=x;}if(v==='')return;document.getElementById('final-ans').value=String(parseInt(v,10));check();}
function getEnteredDigits(){let v='';for(let i=0;i<4;i++){const x=document.getElementById('a-'+i).value;if(x==='')return null;v+=x;}return parseInt(v,10);}
function check(){
 const raw=document.getElementById('final-ans').value.trim();if(raw==='')return;
 const userVal=parseInt(raw,10);attempts++;
 const msg=document.getElementById('feedback');
 if(userVal===correctVal){totalPoints+=currentQPoints;document.getElementById('score').innerText=totalPoints;msg.style.color=varGreen();msg.innerText='答對了！繼續下一題。';
  setTimeout(()=>{if(currentQ<10){currentQ++;loadProblem();}else showResult();},650);
 }else{wrongCount++;currentQPoints=Math.max(2,currentQPoints-2);msg.style.color='var(--red)';msg.innerText='再檢查一次：先看個位，再往左算。';document.getElementById('final-ans').value='';setTimeout(()=>msg.innerText='',1300);}
}
function varGreen(){return 'var(--green)';}
function showResult(){show('result');document.getElementById('result-score').innerText=`總積分：${totalPoints} / 100`;document.getElementById('result-title').innerText=totalPoints===100?'全部答對！':'挑戰完成！';document.getElementById('praise').innerText=(totalPoints===100?praisePerfect:praiseGood)[Math.floor(Math.random()*(totalPoints===100?praisePerfect.length:praiseGood.length))];document.getElementById('stats').innerText=`10 題完成｜需要重新計算的題目：${wrongCount} 題｜每題最多 10 分，重新嘗試會扣 2 分。`;}
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goHome(){show('home');initMenu();}
window.onload=initMenu;
</script>
</body>
</html>
