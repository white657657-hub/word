<script>

function updatePaperBridge(){
    const badge = document.getElementById('paper-mode-badge');
    const bridge = document.getElementById('paper-bridge');

    if(!badge) return;

    // 前 8 題：完整位值顏色輔助。
    // 第 9、10 題：保留直式，但降低顏色依賴，模擬紙本過渡。
    if(currentQ >= 9){
        badge.innerText = '紙本銜接';
        badge.style.color = '#64748b';

        if(bridge){
            bridge.innerHTML =
              '<strong>最後兩題：</strong>試著先看位置，再看顏色。紙上計算也能用同樣的方法。';
        }

        document.body.classList.add('paper-mode');
    }else{
        badge.innerText = '';
        if(bridge){
            bridge.innerHTML =
              '<strong>紙上也可以這樣算：</strong>直式位置、計算順序與現在相同。';
        }
        document.body.classList.remove('paper-mode');
    }
}

function paperBridgeResetMarks(){
    document.querySelectorAll('.clickable-digit.marked').forEach(el=>{
        el.classList.remove('marked');
    });
}

let n1=0,n2=0,op='+',correctVal=0,currentType=1,currentQ=1,totalPoints=0,currentQPoints=10,wrongCount=0;
let answerRevealed=false;
let appProblem=null, appChosenOp=null;
let appOpWrongCount=0, appCalcWrongCount=0;
let wrongProblems=[];
let sessionQuestionTotal=10;
let appSessionUsed=new Set();
let appRecentUsed=[];
const APP_RECENT_LIMIT=120;

function loadAppRecent(){
  try{
    const raw=localStorage.getItem('math_app_recent_v2');
    const parsed=raw?JSON.parse(raw):[];
    appRecentUsed=Array.isArray(parsed)?parsed.filter(x=>typeof x==='string').slice(-APP_RECENT_LIMIT):[];
  }catch(e){appRecentUsed=[];}
}
function saveAppRecent(){
  try{localStorage.setItem('math_app_recent_v2',JSON.stringify(appRecentUsed.slice(-APP_RECENT_LIMIT)));}
  catch(e){}
}
function appSignature(p){return `${p.themeKey}|${p.op}|${p.a}|${p.b}`;}
function rememberAppProblem(p){
  const sig=appSignature(p);
  appSessionUsed.add(sig);
  appRecentUsed.push(sig);
  if(appRecentUsed.length>APP_RECENT_LIMIT) appRecentUsed=appRecentUsed.slice(-APP_RECENT_LIMIT);
  saveAppRecent();
}
loadAppRecent();

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function digits(n){return String(n).padStart(4,'0').split('').map(Number);}

// ===== 加法判斷 =====
function hasCarry(a,b){
 const A=digits(a),B=digits(b);
 let carry=0;
 for(let i=3;i>=0;i--){
  const sum=A[i]+B[i]+carry;
  if(sum>=10)return true;
  carry=0;
 }
 return false;
}

// 明確判斷「完全沒有進位」
function noCarry(a,b){
 const A=digits(a),B=digits(b);
 let carry=0;
 for(let i=3;i>=0;i--){
  if(A[i]+B[i]+carry>=10)return false;
  carry=0;
 }
 return true;
}

// ===== 減法判斷 =====
function hasBorrow(a,b){
 const A=digits(a),B=digits(b);
 let borrow=0;
 for(let i=3;i>=0;i--){
  const x=A[i]-borrow;
  if(x<B[i]){
   borrow=1;
   return true;
  }
  borrow=0;
 }
 return false;
}

function noBorrow(a,b){
 const A=digits(a),B=digits(b);
 let borrow=0;
 for(let i=3;i>=0;i--){
  if(A[i]-borrow<B[i])return false;
  borrow=0;
 }
 return true;
}

// ===== 四位數加法 =====
// mode：mixed / carry / noCarry
function makeAddition(mode){
 for(let k=0;k<1000;k++){
  let a=rand(1000,8999);
  let b=rand(1000,9999-a);
  if(b<1000)continue;

  const carry=hasCarry(a,b);
  if(mode==='carry' && !carry)continue;
  if(mode==='noCarry' && carry)continue;
  if(a+b>10000)continue;

  return [a,b,'+'];
 }

 // 理論上不會走到這裡；保底題也不超過 10000
 if(mode==='carry')return [6379,3621,'+']; // 10000，必有進位
 if(mode==='noCarry')return [1234,2345,'+'];
 return [3210,4567,'+'];
}

// ===== 四位數減法 =====
// mode：mixed / borrow / noBorrow / chain
function makeSubtraction(mode){
 for(let k=0;k<1000;k++){
  let a=rand(1000,9999);
  let b=rand(1,a);

  const borrow=hasBorrow(a,b);

  if(mode==='borrow' && !borrow)continue;
  if(mode==='noBorrow' && borrow)continue;

  if(mode==='chain'){
   // 必須真的跨過 0 借位，例如 5000－3、7000－8、4000－25。
   const crossesZero=(a%1000===0 && b<1000) ||
                     (Math.floor(a/100)%10===0 && b<100);
   if(!crossesZero || !borrow)continue;
  }

  return [a,b,'-'];
 }

 if(mode==='chain')return [5000,3,'-'];
 if(mode==='borrow')return [6200,185,'-'];
 if(mode==='noBorrow')return [8765,1234,'-'];
 return [7654,3210,'-'];
}

   for(let attempt=0;attempt<120;attempt++){
     theme=appThemes[rand(0,appThemes.length-1)];
     candidate=theme.make();
     candidate.themeKey=theme.key;
     const sig=appSignature(candidate);
     if(!appSessionUsed.has(sig) && !appRecentUsed.includes(sig)) break;
   }
   // 若極端情況下候選題仍重複，至少保證本次作答不重複。
   if(!candidate || appSessionUsed.has(appSignature(candidate))){
     for(const t of appThemes){
       const c=t.make(); c.themeKey=t.key;
       if(!appSessionUsed.has(appSignature(c))){candidate=c;break;}
     }

   appProblem=candidate;

function placeClass(index){
  // digits() 回傳 [千,百,十,個]，index 0~3。
  return ['place-qian','place-bai','place-shi','place-ge'][index];
}

function answerClass(index){
  // 四位答案 index 0~3 = 千、百、十、個；10000 的 index 0~4 = 萬、千、百、十、個。
  return correctVal===10000
    ? ['answer-wan','answer-qian','answer-bai','answer-shi','answer-ge'][index]
    : ['answer-qian','answer-bai','answer-shi','answer-ge'][index];
}

function colorizedNumberHTML(value){
  // 橫式題目固定以四位數字處理，但不顯示前導 0。
  // 這裡不依賴其他 DOM 狀態，避免題目區因輔助函式異常而整段空白。
  const raw=String(value);
  const num=Number.isFinite(Number(value)) ? Math.max(0,Math.trunc(Number(value))) : 0;
  const text=String(num);
  const arr=text.padStart(4,'0').slice(-4).split('');
  const firstNonZero=arr.findIndex(x=>x!=='0');
  const start=firstNonZero<0 ? 3 : firstNonZero;
  const classes=['place-qian','place-bai','place-shi','place-ge'];
  return arr.map((x,i)=>{
    if(i<start) return '';
    return `<span class="place-digit ${classes[i]}">${x}</span>`;
  }).join('');
}

function renderGrid(){
 const A=digits(n1),B=digits(n2);
 const isFive=correctVal===10000;
 const placeClasses=['place-qian','place-bai','place-shi','place-ge'];
 const answerClasses=isFive
   ? ['answer-wan','answer-qian','answer-bai','answer-shi','answer-ge']
   : ['answer-qian','answer-bai','answer-shi','answer-ge'];

 /*
  固定 6 欄：說明／符號 + 萬 + 千 + 百 + 十 + 個
  四位數一律放在「千、百、十、個」四欄。
  因此 6379 + 6658 必定是：
       萬 千 百 十 個
          6  3  7  9
          6  6  5  8
  答案也完全使用同一組欄位。
 */
 let html='';
 html+=`<div></div>
         <div class="header">萬</div>
         <div class="header">千</div>
         <div class="header">百</div>
         <div class="header">十</div>
         <div class="header">個</div>`;

 // 進／退位操作區：保留兩列虛線格，不預設名稱，讓孩子自行決定如何記錄。
 html+=`<div></div>
         <div></div>
         <div><input class="carry-cell" id="c-0" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="c-1" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="c-2" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="c-3" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>

         <div></div>
         <div></div>
         <div><input class="carry-cell" id="d-0" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="d-1" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="d-2" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>
         <div><input class="carry-cell" id="d-3" type="text" inputmode="numeric" maxlength="2" autocomplete="off" oninput="limitMark(this)"></div>`;

 // 第一個數：萬位留白，千～個位放四位數。
 // 重要：前導 0 不顯示，但「中間的 0」必須保留。
 // 例如 3 要顯示在個位：   3，而不是 0 0 0 3；
 // 5000 則必須顯示：5 0 0 0，不能把有意義的 0 隱藏。
 const visibleAStart=A.findIndex(x=>x!==0);
 const visibleBStart=B.findIndex(x=>x!==0);
 const aStart=visibleAStart<0 ? A.length-1 : visibleAStart;
 const bStart=visibleBStart<0 ? B.length-1 : visibleBStart;
 html+=`<div></div><div class="cell"></div>`;
 A.forEach((x,i)=>{
  const cls=placeClasses[i];
  const show=i>=aStart;
  if(op==='-'){
    html+=`<div class="cell place-digit ${cls} clickable-digit" data-digit-index="${i}" onclick="toggleBorrowMark(this)">${show?x:''}</div>`;
  }else{
    html+=`<div class="cell place-digit ${cls}">${show?x:''}</div>`;
  }
 });

 // 第二個數：固定對齊千～個位；前導 0 不顯示。
 html+=`<div class="op">${op}</div><div class="cell"></div>`;
 B.forEach((x,i)=>{
  const show=i>=bStart;
  html+=`<div class="cell place-digit ${placeClasses[i]}">${show?x:''}</div>`;
 });

 html+=`<div class="line"></div>`;

 // 答案：只有剛好 10000 才使用萬位；其他全部四格，與千～個位完全對齊。
 if(isFive){
  html+=`<div></div>`;
  for(let i=0;i<5;i++){
   html+=`<div><input class="digit-input ${answerClasses[i]}" id="a-${i}" type="text" inputmode="numeric" maxlength="1" oninput="limitOne(this)"></div>`;
  }
 }else{
  html+=`<div></div><div class="cell"></div>`;
  for(let i=0;i<4;i++){
   html+=`<div><input class="digit-input ${answerClasses[i]}" id="a-${i}" type="text" inputmode="numeric" maxlength="1" oninput="limitOne(this)"></div>`;
  }
 }

 document.getElementById('grid').innerHTML=html;
}

function limitOne(el){

function getVerticalAnswerValue(){
 const count=correctVal===10000?5:4;
 const values=[];
 for(let i=0;i<count;i++){
  values.push((document.getElementById(`a-${i}`)?.value||'').trim());
 }
 // 允許最前面的 0 不填；但中間不能留空。
 let firstNonZero=values.findIndex(x=>x!=='' && x!=='0');
 if(firstNonZero===-1){
  if(values.every(x=>x==='' || x==='0'))return {valid:false,empty:values.every(x=>x===''),values};
 }
 const start=firstNonZero===-1?count-1:firstNonZero;
 for(let i=start;i<count;i++){
  if(values[i]==='')return {valid:false,empty:false,values};
 }
 const normalized=values.map((x,i)=>i<start?'0':x).join('');
 return {valid:true,value:parseInt(normalized,10),values,normalized};
}

function moveAndSubmit(){

  return;
 }
 document.getElementById('final-ans').value=String(result.value);
 check();
}

function placeName(index,total){
 if(total===5)return ['萬位','千位','百位','十位','個位'][index];
 return ['千位','百位','十位','個位'][index];
}

function normalizedUserAnswer(){
 const finalRaw=(document.getElementById('final-ans')?.value||'').trim();
 if(/^\d+$/.test(finalRaw))return {value:parseInt(finalRaw,10),raw:finalRaw};
 const v=getVerticalAnswerValue();
 return v.valid?{value:v.value,raw:v.normalized}:{value:null,raw:''};
}

function getDigitErrorText(userVal){
 const total=correctVal===10000?5:4;
 const correctDigits=String(correctVal).padStart(total,'0').split('');
 const userDigits=String(userVal).padStart(total,'0').split('');
 for(let i=0;i<total;i++){
  if(correctDigits[i]!==userDigits[i]){
   const place=placeName(i,total);
   return `你在${place}寫成 ${userDigits[i]}，正確是 ${correctDigits[i]}。先只看這一位，再回頭檢查這一位的進位或退位。`;
  }
 }
 return '';
}

function buildCalculationTeaching(){
 const A=String(n1).padStart(4,'0').split('').map(Number);
 const B=String(n2).padStart(4,'0').split('').map(Number);
 const places=['個位','十位','百位','千位'];
 const steps=[];
 let carry=0;
 let borrow=0;
 if(op==='+'){
  for(let i=3;i>=0;i--){
   const sum=A[i]+B[i]+carry;
   const out=Math.floor(sum/10);
   steps.push(`${places[3-i]}：${A[i]}＋${B[i]}${carry?`＋${carry}`:''}＝${sum}，這一位寫 ${sum%10}${out?'，並向左進 1':''}。`);
   carry=out;
  }
 }else{
  for(let i=3;i>=0;i--){
   const top=A[i]-borrow;
   if(top<B[i]){
    const shown=top+10;
    if(A[i]===0 && borrow===1){
      steps.push(`${places[3-i]}：這一位原本是 0，右邊需要借位，所以要繼續向左借 1；這個 0 會變成 9，讓右邊的位數可以繼續計算。`);
    }else{
      steps.push(`${places[3-i]}：${top} 不夠減 ${B[i]}，所以要從左邊借 1；這一位變成 ${shown}，${shown}－${B[i]}＝${shown-B[i]}。`);
    }
    borrow=1;
   }else{
    steps.push(`${places[3-i]}：${top}－${B[i]}＝${top-B[i]}。`);
    borrow=0;
   }
  }
 }
 return steps;
}

function buildAnswerEquationHTML(userVal){
 const total=correctVal===10000?5:4;
 const width=5; // 畫面固定保留「萬位」欄，四位數前面只留空白，不補 0。
 const a=String(n1).padStart(width,' ').split('');
 const b=String(n2).padStart(width,' ').split('');
 const correct=String(correctVal).padStart(width,' ').split('');
 const user=userVal===null?null:String(userVal).padStart(total,'0').padStart(width,' ').split('');
 const wrong=[];
 if(user){
  const correctDigits=String(correctVal).padStart(total,'0').split('');
  const userDigits=String(userVal).padStart(total,'0').split('');
  for(let i=0;i<total;i++) if(userDigits[i]!==correctDigits[i]) wrong.push(width-total+i);
 }
 const row=(chars,opSymbol='')=>{
  let h=`<div class="ae-row"><span class="ae-op">${opSymbol}</span>`;
  chars.forEach((ch,i)=>{
   h+=`<span class="ae-digit">${ch===' ' ? '&nbsp;' : ch}</span>`;
  });
  return h+'</div>';
 };
 let html='<div class="answer-equation"><div class="answer-equation-title">正確的直式</div>';
 html+=row(a,'');
 html+=row(b,op);
 html+='<div class="ae-line"></div>';
 html+=`<div class="ae-row"><span class="ae-op">＝</span>`;
 correct.forEach((ch,i)=>{
   const cls=user && wrong.includes(i)?'ae-digit ae-correct':'ae-digit';
   html+=`<span class="${cls}">${ch===' ' ? '&nbsp;' : ch}</span>`;
 });
 html+='</div>';
 if(user && wrong.length){
   html+='<div class="ae-note">你這次的答案：<span style="font-family:\"Courier New\",monospace;font-weight:900">';
   user.forEach((ch,i)=>{
     html+=`<span class="${wrong.includes(i)?'ae-wrong':''}">${ch===' ' ? '&nbsp;' : ch}</span>`;
   });
   html+='</span><br>紅框是你需要重新檢查的位數；綠底是這一位的正確答案。</div>';
 }
 html+='</div>';
 return html;
}
function showAnswer(){
 const box=document.getElementById('answer-help');
 const btn=document.getElementById('show-answer-btn');
 const appBtn=document.getElementById('show-answer-app');
 if(!box)return;
 answerRevealed=true;
 if(btn)btn.innerText='💡 答案已顯示';
 if(appBtn)appBtn.innerText='💡 答案已顯示';
 let html='<div class="answer-title">💡 一起看答案，不要卡住</div>';
 if(currentType===6 && appProblem){
   const reason=op==='+'?'兩個數量合在一起，所以用加法。':'原來的數量拿走一部分，所以用減法。';
   html+=`<div>這題要用 <strong>${op==='+'?'加法（＋）':'減法（－）'}</strong>。${reason}</div>`;
   if(appChosenOp && appChosenOp!==op){
     html+=`<div class="answer-error">你剛才選的是 ${appChosenOp==='+'?'加法':'減法'}，第一個錯誤是在「判斷要用哪一種運算」。</div>`;
   }
 }
 const user=normalizedUserAnswer();
 html+=buildAnswerEquationHTML(user.value);
 if(user.value!==null && user.value!==correctVal){
   const err=getDigitErrorText(user.value);
   html+=`<div class="answer-error">你填的是 ${user.value.toLocaleString()}。${err||'答案和正確答案不同，請重新檢查每一位。'}</div>`;
 }else if(user.value===correctVal){
   html+='<div>你填的答案已經正確！可以直接送出。</div>';
 }else{
   html+='<div>目前還沒有完整答案，所以先看正確直式，再回到原題自己算一次。</div>';
 }
 html+='<div class="answer-teach"><strong>怎麼算：</strong><ol>';
 buildCalculationTeaching().forEach(step=>{html+=`<li>${step}</li>`;});
 html+='</ol></div>';
 html+=`<div class="answer-teach"><strong>正確答案：</strong> <span class="answer-number">${correctVal.toLocaleString()}</span></div>`;
 box.innerHTML=html;
 box.classList.remove('hidden');
 box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function check(){
 if(currentType===6 && appChosenOp!==appProblem?.op)return;
 const finalInput=document.getElementById('final-ans');
 let raw=(finalInput?.value||'').trim();
 // 上方送出與直式送出共用同一套答案解析：
 // 若上方答案框沒填，就直接讀取直式答案；前導 0 可省略。
 if(!/^\d+$/.test(raw)){
  const vertical=getVerticalAnswerValue();
  if(vertical.valid){
   raw=String(vertical.value);
   if(finalInput)finalInput.value=raw;
  }else{
   const msg=document.getElementById('feedback');
   if(msg){
    msg.style.color='var(--red)';
    msg.innerText=vertical.empty?'先填答案再送出。':'前面的 0 可以不填；中間的位數不能空著。';
   }
   return;
  }
 }
 const userVal=parseInt(raw,10);
 const msg=document.getElementById('feedback');

 if(userVal===correctVal){
  celebrateCorrect();
  totalPoints+=currentQPoints;
  document.getElementById('score').innerText=totalPoints;
  msg.style.color='var(--green)';
  msg.innerText='答對了！繼續下一題。';
  setTimeout(()=>{
   if(window.__retryQueue && Array.isArray(window.__retryQueue)){
     if(currentQ < window.__retryQueue.length){
       currentQ++;
       appProblem={...window.__retryQueue[currentQ-1]};
       appChosenOp=null; n1=appProblem.a;n2=appProblem.b;op=appProblem.op;correctVal=op==='+'?n1+n2:n1-n2;currentQPoints=10;
       answerRevealed=false; resetAnswerHelp();
       document.getElementById('mode-label').innerText='🔁 今日錯題再戰';
       renderContext(appProblem); renderAppChoices();
       document.querySelector('.top-question').classList.add('app-hidden');
       document.querySelector('.math-card').classList.add('app-hidden');
       document.getElementById('q-count').innerText=currentQ;
       document.getElementById('bar').style.width=((currentQ-1)/window.__retryQueue.length*100)+'%';
     }else{
       window.__retryQueue=null; showResult();
     }
   }else if(currentQ<10){currentQ++;loadProblem();}
   else showResult();
  },650);
 }else{
  wrongCount++;
  appCalcWrongCount += currentType===6 ? 1 : 0;
  recordWrongProblem();
  currentQPoints=Math.max(2,currentQPoints-2);
  msg.style.color='var(--red)';
  msg.innerText='再試一次，仔細看看你的直式。';
  document.getElementById('final-ans').value='';
  setTimeout(()=>msg.innerText='',1300);
 }
}

function retryWrong(){

 currentQ=1; totalPoints=0; wrongCount=0; appOpWrongCount=0; appCalcWrongCount=0;
 answerRevealed=false; resetAnswerHelp();
 const queue=wrongProblems.map(x=>({...x}));

 wrongProblems=[];
 show('game');
 document.getElementById('score').innerText='0';
 document.getElementById('q-count').innerText='1';
 document.getElementById('mode-label').innerText='🔁 今日錯題再戰';

 n1=p.a;n2=p.b;op=p.op;correctVal=op==='+'?n1+n2:n1-n2;currentQPoints=10;

 window.__retryQueue=queue;
 updatePaperBridge();
}
