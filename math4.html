<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三年級｜10000以內四位數加減</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--text:#263238;--blue:#3498db;--orange:#e67e22;--green:#27ae60;--red:#e74c3c;--line:#333;--muted:#718096;--purple:#8e44ad;--teal:#16a085;--darkred:#c0392b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text)}
body{overflow-x:hidden}
.page{display:none;width:100%;max-width:700px;min-height:100vh;margin:auto;padding:18px 14px 28px;flex-direction:column;align-items:center}.page.active{display:flex}
.title{font-size:1.7rem;font-weight:800;margin:12px 0 6px}.subtitle{color:var(--muted);font-size:.98rem;text-align:center;margin-bottom:12px}
#menu-list{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.btn-menu{padding:17px 8px;font-size:1.05rem;border:0;border-radius:14px;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.16)}
.btn-menu:active,.btn-main:active,.btn-move:active,.btn-review:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.add{background:var(--blue)}.sub{background:var(--orange)}.mix{background:var(--purple)}.carry{background:var(--teal)}.borrow{background:var(--darkred)}.practice{background:#536dfe}.review{background:#607d8b}
.hint{margin-top:20px;background:#fff;border-radius:16px;padding:14px 16px;width:100%;line-height:1.7;font-size:.95rem;color:#4a5568}
.review-note{display:none;width:100%;margin-top:12px;background:#fff8e1;border:1px solid #f0d98a;border-radius:14px;padding:12px 14px;color:#6b5a16;font-size:.92rem;line-height:1.6}
.info-bar{display:flex;justify-content:space-between;width:94%;font-weight:800;margin:4px 0 6px}.progress{width:94%;height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:15px}.bar{height:100%;width:0;background:var(--green);transition:.3s}
.mode-label{font-size:1rem;font-weight:800;padding:6px 14px;border-radius:20px;background:#fff;margin-bottom:8px}.instruction{min-height:30px;text-align:center;font-weight:700;color:#4a5568;margin-bottom:5px}
.top-question{display:flex;align-items:center;justify-content:center;gap:10px;margin:5px 0 14px}.q-text{font-size:2rem;font-weight:900;letter-spacing:1px}.final-ans{width:125px;height:54px;font-size:2rem;text-align:center;border:3px solid #333;border-radius:10px;background:#fff;outline:none;-moz-appearance:textfield}.final-ans::-webkit-outer-spin-button,.final-ans::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.btn-main{padding:11px 18px;font-size:1.08rem;font-weight:800;color:#fff;background:var(--green);border:0;border-radius:11px;box-shadow:0 4px 0 #219653;cursor:pointer}
.practice-note{display:none;color:#536dfe;font-size:.9rem;font-weight:700;margin:-4px 0 10px}.practice-mode .practice-note{display:block}.practice-mode .top-answer{display:none}
.math-card{background:var(--card);padding:16px 12px 14px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.1);width:100%;display:flex;justify-content:center;align-items:center;gap:12px}
.vertical{display:grid;grid-template-columns:42px repeat(5,54px);gap:4px;align-items:center}.header{font-weight:800;color:#64748b;font-size:1rem;text-align:center;height:25px}.cell{width:54px;height:50px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;font-family:"Courier New",monospace}.clickable-digit{position:relative;cursor:pointer;user-select:none}.clickable-digit.marked::after{content:"/";position:absolute;color:var(--red);font-size:2.7rem;font-weight:900;line-height:1;transform:rotate(-18deg);left:8px;top:0;pointer-events:none}.clickable-digit:hover{background:rgba(52,152,219,.06);border-radius:8px}
.carry-cell{width:42px;height:30px;border:1.5px dashed #aaa;border-radius:7px;text-align:center;font-size:1rem;font-weight:800;color:var(--red);outline:none;background:#fff;-moz-appearance:textfield}.carry-cell::-webkit-outer-spin-button,.carry-cell::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.carry-cell:focus,.digit-input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(52,152,219,.12)}
.digit-input{width:48px;height:46px;border:2px solid #cbd5e0;border-radius:8px;text-align:center;font-size:1.8rem;font-weight:900;font-family:"Courier New",monospace;outline:none;background:#fff;-moz-appearance:textfield}.digit-input::-webkit-outer-spin-button,.digit-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.op{font-size:2rem;font-weight:900;color:var(--red);text-align:center}.line{grid-column:1/-1;border-bottom:3px solid #333;height:4px;margin:1px 0 2px}
.explain{width:100%;margin-top:12px;background:#fff;border-radius:14px;padding:11px 14px;color:#475569;font-size:.94rem;line-height:1.65}.feedback{min-height:34px;margin-top:12px;font-size:1.08rem;font-weight:800;text-align:center}.controls{display:flex;align-items:center;gap:10px;margin-top:4px}.btn-move{width:55px;height:55px;border:0;border-radius:50%;background:#f39c12;color:#fff;font-weight:900;font-size:1.25rem;box-shadow:0 4px 0 #d35400;cursor:pointer}.secondary{background:none;border:0;color:#8a94a6;cursor:pointer;margin-top:10px}
.result{width:90%;background:#fff;border-radius:24px;padding:26px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.14);margin-top:30vh}.score{font-size:1.8rem;color:#f39c12;font-weight:900}.praise{font-size:1.15rem;line-height:1.7;margin:16px 0}.wrong-list{margin-top:12px;text-align:left;background:#f8fafc;border-radius:12px;padding:12px;font-size:.94rem;line-height:1.7}.balloon{position:fixed;bottom:-100px;width:38px;height:48px;border-radius:50%;animation:up 6s linear forwards;z-index:10}@keyframes up{to{transform:translateY(-120vh)}}
@media(max-width:520px){.vertical{grid-template-columns:34px repeat(5,46px);gap:3px}.cell{width:46px;font-size:1.75rem}.digit-input{width:41px;height:42px;font-size:1.6rem}.carry-cell{width:36px}.math-card{padding:12px 4px}.q-text{font-size:1.65rem}.final-ans{width:100px;height:48px}.top-question{gap:6px}}
</style>
</head>
<body>

<div class="page active" id="home">
  <div class="title">三年級｜四位數加減</div>
  <div class="subtitle">10000 以內的直式計算｜把「位值、進退位、計算程序」練穩</div>
  <div id="menu-list"></div>
  <div class="review-note" id="review-note"></div>
  <div class="hint"><b>練習方式</b><br>先自己判斷，再決定是否在數字上留下「／」或使用上方兩排空白格。系統不規定你的記號方式。紙本也建議保留，用來練習自己排出完整直式。</div>
</div>

<div class="page" id="game">
  <div class="info-bar"><span>題次：<span id="q-count">1</span>/10</span><span>得分：<span id="score">0</span></span></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="mode-label" id="mode-label"></div>
  <div class="instruction" id="instruction"></div>
  <div class="practice-note">直式練習：請使用下方四／五個答案格完成答案。</div>
  <div class="top-question top-answer"><div class="q-text"><span id="q1"></span> <span id="qo"></span> <span id="q2"></span> =</div><input class="final-ans" id="final-ans" type="text" inputmode="numeric" maxlength="5"><button class="btn-main" onclick="check()">送出</button></div>
  <div class="math-card">
    <div class="vertical" id="grid"></div>
    <button class="btn-move" title="用直式答案送出" onclick="moveAndSubmit()">➜</button>
  </div>
  <div class="feedback" id="feedback"></div>
  <div class="explain" id="explain"></div>
  <button class="secondary" onclick="goHome()">↩ 返回選單</button>
</div>

<div class="page" id="result">
  <div class="result"><h2 id="result-title"></h2><div class="score" id="result-score"></div><div class="praise" id="praise"></div><div class="wrong-list" id="stats"></div><button class="btn-main" onclick="goHome()">再挑戰一次</button></div>
</div>

<script>
let n1=0,n2=0,op='+',correctVal=0,currentType=1,currentQ=1,totalPoints=0,currentQPoints=10,wrongCount=0;
let currentSkill='';
let reviewQueue=[];
let currentProblemWrong=false;

const STORAGE_KEY='math_four_digit_skill_v2';
const praisePerfect=['你把位值與計算程序都做得很穩。','這次每一位都處理得很清楚。','進位、退位與位值排列都掌握得很好。'];
const praiseGood=['這次有完成挑戰。把今天的錯題再練一次，會更穩。','計算程序已經在建立中，繼續注意每一個位值。','慢一點檢查進退位，準確度會比單純追速度更重要。'];

function getSkillData(){
 try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){return {}}
}
function saveSkillData(data){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){}
}
function recordWeakSkill(skill,problem){
 const data=getSkillData();
 if(!data[skill])data[skill]={count:0,last:0,examples:[]};
 data[skill].count=Math.min((data[skill].count||0)+1,20);
 data[skill].last=Date.now();
 if(problem && !data[skill].examples.includes(problem))data[skill].examples.unshift(problem);
 data[skill].examples=data[skill].examples.slice(0,5);
 saveSkillData(data);
}
function clearWeakSkill(skill){
 const data=getSkillData();
 if(!data[skill])return;
 data[skill].count=Math.max(0,(data[skill].count||0)-1);
 data[skill].last=Date.now();
 if(data[skill].count===0)delete data[skill];
 saveSkillData(data);
}
function getReviewSkills(){
 const data=getSkillData();
 return Object.entries(data).filter(([k,v])=>(v.count||0)>0).sort((a,b)=>(b[1].count||0)-(a[1].count||0));
}
function prepareReviewQueue(){
 reviewQueue=[];
 const skills=getReviewSkills();
 const allowed={
  1:['carry','noCarry'],
  2:['borrow','noBorrow'],
  3:['chain'],
  4:['carry'],
  5:['carry','noCarry','borrow','noBorrow','chain'],
  6:['carry','noCarry','borrow','noBorrow','chain']
 }[currentType]||[];
 skills.filter(([skill])=>allowed.includes(skill)).slice(0,2).forEach(([skill])=>reviewQueue.push(skill));
}

function initMenu(){
 const types=[
  {id:1,n:'四位數加法',c:'add',d:'基本加法：不進位＋進位'},
  {id:2,n:'四位數減法',c:'sub',d:'基本減法：不退位＋退位'},
  {id:3,n:'減法連續退位',c:'borrow',d:'專練 5000－3 這類題型'},
  {id:4,n:'加法進位挑戰',c:'carry',d:'至少一次進位'},
  {id:5,n:'加減混合',c:'mix',d:'依計算能力混合出題'},
  {id:6,n:'直式練習',c:'practice',d:'只能用下方答案格作答'}
 ];
 document.getElementById('menu-list').innerHTML=types.map(t=>`<button class="btn-menu ${t.c}" onclick="start(${t.id})">${t.n}<small style="display:block;font-size:.78rem;opacity:.9;margin-top:5px">${t.d}</small></button>`).join('');
 const skills=getReviewSkills();
 const note=document.getElementById('review-note');
 if(skills.length){
  const names={noCarry:'加法不進位',carry:'加法進位',noBorrow:'減法不退位',borrow:'一般退位',chain:'連續／跨0退位'};
  note.style.display='block';
  note.innerHTML='<b>最近需要再練：</b>'+skills.slice(0,3).map(([s,v])=>`${names[s]||s}（${v.count}次）`).join('、')+'。開始任一模式時，前幾題會優先安排類似題。';
 }else note.style.display='none';
}

function start(type){
 currentType=type;currentQ=1;totalPoints=0;wrongCount=0;currentProblemWrong=false;prepareReviewQueue();
 const game=document.getElementById('game');
 game.classList.toggle('practice-mode',type===6);
 show('game');
 document.getElementById('score').innerText='0';
 loadProblem();
}

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function digits(n){return String(n).padStart(4,'0').split('').map(Number);}

// ===== 計算結構判斷 =====
function carryInfo(a,b){
 const A=digits(a),B=digits(b);let carry=0,count=0,positions=[];
 for(let i=3;i>=0;i--){const sum=A[i]+B[i]+carry;if(sum>=10){count++;positions.push(i);carry=1}else carry=0;}
 return {count,positions};
}
function borrowInfo(a,b){
 const A=digits(a),B=digits(b);let borrow=0,count=0,positions=[];
 for(let i=3;i>=0;i--){const x=A[i]-borrow;if(x<B[i]){count++;positions.push(i);borrow=1}else borrow=0;}
 return {count,positions};
}
function hasCarry(a,b){return carryInfo(a,b).count>0}
function noCarry(a,b){return carryInfo(a,b).count===0}
function hasBorrow(a,b){return borrowInfo(a,b).count>0}
function noBorrow(a,b){return borrowInfo(a,b).count===0}
function isChainBorrow(a,b){
 const A=digits(a),B=digits(b),info=borrowInfo(a,b);
 if(info.count<2)return false;
 // 只有「借位時碰到 0」才算跨 0 連續退位。
 let borrow=0;
 for(let i=3;i>=0;i--){
  const x=A[i]-borrow;
  if(x<B[i]){
   if(A[i]===0)return true;
   borrow=1;
  }else{
   borrow=0;
  }
 }
 return false;
}

// ===== 題目產生：明確控制結構，不靠「抽很多次碰運氣」 =====
function makeAddition(mode){
 for(let k=0;k<2000;k++){
  const a=rand(1000,8999);const b=rand(1000,Math.min(9999,10000-a));if(b<1000)continue;
  const info=carryInfo(a,b);
  if(mode==='carry'&&info.count<1)continue;
  if(mode==='noCarry'&&info.count!==0)continue;
  if(mode==='multiCarry'&&info.count<2)continue;
  if(a+b>10000)continue;
  return [a,b,'+',mode];
 }
 if(mode==='carry')return [6379,3621,'+','carry'];
 if(mode==='noCarry')return [1234,2345,'+','noCarry'];
 if(mode==='multiCarry')return [5876,4765,'+','multiCarry'];
 return [3210,4567,'+','noCarry'];
}
function makeSubtraction(mode){
 for(let k=0;k<2000;k++){
  const a=rand(1000,9999);const b=rand(1,a);const info=borrowInfo(a,b);
  if(mode==='borrow'&&info.count<1)continue;
  if(mode==='noBorrow'&&info.count!==0)continue;
  if(mode==='chain'&&!isChainBorrow(a,b))continue;
  if(a-b<0)continue;
  return [a,b,'-',mode];
 }
 if(mode==='chain')return [5000,3,'-','chain'];
 if(mode==='borrow')return [6200,185,'-','borrow'];
 if(mode==='noBorrow')return [8765,1234,'-','noBorrow'];
 return [7654,3210,'-','noBorrow'];
}

function makeBySkill(skill){
 if(skill==='carry')return makeAddition('carry');
 if(skill==='noCarry')return makeAddition('noCarry');
 if(skill==='borrow')return makeSubtraction('borrow');
 if(skill==='noBorrow')return makeSubtraction('noBorrow');
 if(skill==='chain')return makeSubtraction('chain');
 return makeAddition('carry');
}

function chooseNormalProblem(){
 if(currentType===1)return Math.random()<0.5?makeAddition('noCarry'):makeAddition('carry');
 if(currentType===2)return Math.random()<0.5?makeSubtraction('noBorrow'):makeSubtraction('borrow');
 if(currentType===3)return makeSubtraction('chain');
 if(currentType===4)return Math.random()<0.65?makeAddition('carry'):makeAddition('multiCarry');
 if(currentType===5){
  return Math.random()<0.5?(Math.random()<0.5?makeAddition('noCarry'):makeAddition('carry')):(Math.random()<0.5?makeSubtraction('noBorrow'):makeSubtraction('borrow'));
 }
 // 直式練習：涵蓋不同結構，不追求速度。
 const r=rand(1,5);return r===1?makeAddition('noCarry'):r===2?makeAddition('carry'):r===3?makeSubtraction('noBorrow'):r===4?makeSubtraction('borrow'):makeSubtraction('chain');
}

function loadProblem(){
 let q;
 // 前兩題優先補最近錯誤類型；之後依模式正常出題。
 if(reviewQueue.length && currentQ<=2){q=makeBySkill(reviewQueue.shift())}
 else q=chooseNormalProblem();
 [n1,n2,op,currentSkill]=q;
 correctVal=op==='+'?n1+n2:n1-n2;
 currentQPoints=10;currentProblemWrong=false;
 const labels={1:'四位數加法',2:'四位數減法',3:'連續退位',4:'進位挑戰',5:'加減混合',6:'直式練習'};
 document.getElementById('mode-label').innerText=labels[currentType];
 document.getElementById('instruction').innerText=op==='+'?'從個位開始，加起來滿 10 就處理進位。':'從個位開始，先判斷夠不夠減；不夠時自己決定如何留下退位記號。';
 document.getElementById('q1').innerText=n1;document.getElementById('qo').innerText=op;document.getElementById('q2').innerText=n2;
 document.getElementById('q-count').innerText=currentQ;document.getElementById('score').innerText=totalPoints;document.getElementById('bar').style.width=((currentQ-1)/10*100)+'%';document.getElementById('final-ans').value='';document.getElementById('feedback').innerText='';
 renderGrid();renderExplain();
}

function renderGrid(){
 const A=digits(n1),B=digits(n2),isFive=correctVal===10000;let html='';
 html+=`<div></div><div class="header">萬</div><div class="header">千</div><div class="header">百</div><div class="header">十</div><div class="header">個</div>`;
 // 兩排完全空白的虛線格，不指定「進位」或「退位」，讓孩子自由使用。
 for(const row of ['c','d']){
  html+=`<div></div><div></div>`;
  for(let i=0;i<4;i++)html+=`<div><input class="carry-cell" id="${row}-${i}" type="text" inputmode="numeric" maxlength="1" oninput="limitMark(this)"></div>`;
 }
 html+=`<div></div><div class="cell"></div>`;
 A.forEach((x,i)=>{html+=`<div class="cell clickable-digit" data-digit-index="${i}" onclick="toggleBorrowMark(this)" style="color:${i===3?'#2563eb':'#334155'}">${x}</div>`});
 html+=`<div class="op">${op}</div><div class="cell"></div>`;B.forEach(x=>{html+=`<div class="cell">${x}</div>`});
 html+=`<div class="line"></div>`;
 if(isFive){
  html+=`<div></div>`;for(let i=0;i<5;i++)html+=`<div><input class="digit-input" id="a-${i}" type="text" inputmode="numeric" maxlength="1" oninput="limitOne(this)"></div>`;
 }else{
  html+=`<div></div><div class="cell"></div>`;for(let i=0;i<4;i++)html+=`<div><input class="digit-input" id="a-${i}" type="text" inputmode="numeric" maxlength="1" oninput="limitOne(this)"></div>`;
 }
 document.getElementById('grid').innerHTML=html;
}

function renderExplain(){
 const el=document.getElementById('explain');
 if(op==='-'&&isChainBorrow(n1,n2))el.innerHTML='<b>本題：</b>這是連續／跨 0 退位。先自己判斷要從哪一位開始借，記號格與數字上的「／」都可以自由使用。';
 else if(op==='-'&&hasBorrow(n1,n2))el.innerHTML='<b>本題：</b>有退位。先判斷哪一位不夠減，再往左處理；可以自己留下記號，不必照固定格式。';
 else if(op==='+'&&hasCarry(n1,n2))el.innerHTML='<b>本題：</b>有進位。從個位開始，滿 10 再往左處理；記號由你自己決定。';
 else el.innerHTML='<b>檢查：</b>千、百、十、個位要對齊；從個位開始，一位一位往左算。';
}

function toggleBorrowMark(el){el.classList.toggle('marked')}
function limitOne(el){el.value=el.value.replace(/[^0-9]/g,'').slice(0,1)}
function limitMark(el){el.value=el.value.replace(/[^0-9]/g,'').slice(0,1)}

function moveAndSubmit(){
 const count=correctVal===10000?5:4;let v='';
 for(let i=0;i<count;i++){const x=document.getElementById(`a-${i}`)?.value||'';if(x!=='')v+=x}
 if(v==='')return;
 document.getElementById('final-ans').value=String(parseInt(v,10));check();
}

function classifyError(){
 if(op==='+'&&hasCarry(n1,n2))return 'carry';
 if(op==='+'&&!hasCarry(n1,n2))return 'noCarry';
 if(op==='-'&&isChainBorrow(n1,n2))return 'chain';
 if(op==='-'&&hasBorrow(n1,n2))return 'borrow';
 return 'noBorrow';
}
function strategyFeedback(){
 if(op==='-'&&isChainBorrow(n1,n2))return '這題是跨 0 退位，先不要急著算，從右邊判斷後，再往左找可以借的位數。';
 if(op==='-'&&hasBorrow(n1,n2))return '先看個位是否夠減；需要退位時，前一位要重新調整。';
 if(op==='+'&&hasCarry(n1,n2))return '先算個位；滿 10 時再處理進位，接著往左。';
 return '先確認千、百、十、個位，再從個位往左算。';
}

function check(){
 const raw=document.getElementById('final-ans').value.trim();if(!/^\d+$/.test(raw))return;
 const userVal=parseInt(raw,10),msg=document.getElementById('feedback');
 if(userVal===correctVal){
  totalPoints+=currentQPoints;document.getElementById('score').innerText=totalPoints;msg.style.color='var(--green)';
  // 正確完成後降低該技能的待補強權重；錯題不會永遠追著孩子。
  clearWeakSkill(currentSkill);
  msg.innerText=currentProblemWrong?'這次訂正成功，這個計算方法記住了。':'這題的計算程序做對了。';
  setTimeout(()=>{if(currentQ<10){currentQ++;loadProblem()}else showResult()},650);
 }else{
  currentProblemWrong=true;wrongCount++;currentQPoints=Math.max(2,currentQPoints-2);
  const skill=classifyError();recordWeakSkill(skill,`${n1}${op}${n2}`);
  msg.style.color='var(--red)';msg.innerText=strategyFeedback();
  document.getElementById('final-ans').value='';
  setTimeout(()=>msg.innerText='',2200);
 }
}

function showResult(){
 show('result');
 document.getElementById('result-score').innerText=`總積分：${totalPoints} / 100`;
 document.getElementById('result-title').innerText=totalPoints===100?'全部答對！':'挑戰完成！';
 const arr=totalPoints===100?praisePerfect:praiseGood;document.getElementById('praise').innerText=arr[Math.floor(Math.random()*arr.length)];
 const skills=getReviewSkills();const names={noCarry:'加法不進位',carry:'加法進位',noBorrow:'減法不退位',borrow:'一般退位',chain:'連續／跨0退位'};
 let extra=`10 題完成｜本組需要重新計算：${wrongCount} 題。`;
 if(skills.length)extra+=`<br><b>建議再練：</b>${skills.slice(0,3).map(([s,v])=>`${names[s]||s}（${v.count}次）`).join('、')}`;
 document.getElementById('stats').innerHTML=extra;
}

function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}
function goHome(){show('home');initMenu()}
window.onload=initMenu;
</script>
