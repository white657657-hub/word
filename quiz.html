<script>

function updatePaperBridge(){
    const badge = document.getElementById('paper-mode-badge');
    const bridge = document.getElementById('paper-bridge');

    if(!badge) return;

    // 前 8 題：完整位值顏色輔助。
    // 第 9、10 題：保留直式，但降低顏色依賴，模擬紙本過渡。
    if(currentQ >= 9){
        badge.innerText = '紙本銜接';
        badge.style.color = '#64748b';

        if(bridge){
            bridge.innerHTML =
              '<strong>最後兩題：</strong>試著先看位置，再看顏色。紙上計算也能用同樣的方法。';
        }

        document.body.classList.add('paper-mode');
    }else{
        badge.innerText = '';
        if(bridge){
            bridge.innerHTML =
              '<strong>紙上也可以這樣算：</strong>直式位置、計算順序與現在相同。';
        }
        document.body.classList.remove('paper-mode');
    }
}

function paperBridgeResetMarks(){
    document.querySelectorAll('.clickable-digit.marked').forEach(el=>{
        el.classList.remove('marked');
    });
}

let n1=0,n2=0,op='+',correctVal=0,currentType=1,currentQ=1,totalPoints=0,currentQPoints=10,wrongCount=0;
let answerRevealed=false;
let appProblem=null, appChosenOp=null;
let appPlaced=[null,null];
let appTargetRow=null;
let appSelectedNumber=null;
let appOpWrongRecorded=false;
let appOpWrongCount=0, appCalcWrongCount=0;
let wrongProblems=[];
let sessionQuestionTotal=10;
let appSessionUsed=new Set();
let appRecentUsed=[];
let appDemoStep=1;
let answerViewLogged=false;
let sessionErrorLogCount=0;
let sessionAnswerViewCount=0;
const APP_RECENT_LIMIT=120;

// ===== 數學答題行為觀察資料層：描述行為，不做診斷 =====
const OBS_KEY='math4_observation_v3';
let qId='',qStartTime=0,qAttemptCount=0,qInitialAnswer='',qFinalAnswer='',qAnswerChangeCount=0,qRepeatedQuestionCount=0,qHintUsed=false,qParentHelpCount=0,qParentHelpTypes=[];
let qBorrowUsed=false,qCarryUsed=false,qCrossZero=false,qBorrowActions=[],qCarryActions=[];
let qEvents=[],qLastActivity=0,qHesitationCount=0,qHesitationDurationMs=0,qLongestPauseMs=0,qRestartCount=0,qReviewBeforeSubmit=false;
let currentStrategy='unknown',currentTransfer='not_observable',lastObservationIndex=-1;
let qInputStarted=false,qProcessActionCount=0,qFirstInputAt=null,qSubmittedAt=null,qLastAnswerValue='';
function getObs(){try{const a=JSON.parse(localStorage.getItem(OBS_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveObs(a){try{localStorage.setItem(OBS_KEY,JSON.stringify(a.slice(-2000)))}catch(e){}}
function obsDate(){return new Date().toISOString().slice(0,10)}
function obsOp(o){return o==='+'?'addition':'subtraction'}
function obsCrossZero(a,b){if(a<=b)return false;const A=String(a),B=String(b).padStart(A.length,'0');for(let i=A.length-1;i>=0;i--){if(Number(A[i])<Number(B[i])){let j=i-1;while(j>=0&&A[j]==='0')j--;return j>=0&&j<i;}}return false}
function obsDigits(a,b){return Math.max(String(a).length,String(b).length)}
function obsComplexity(){
 if(currentType===6)return 6;
 if(op==='-'&&qCrossZero)return 5;
 if(op==='-'){const A=digits(n1),B=digits(n2);let borrow=0,count=0;for(let i=3;i>=0;i--){if(A[i]-borrow<B[i]){count++;borrow=1}else borrow=0}return count>=2?4:count===1?2:1;}
 if(op==='+'){const A=digits(n1),B=digits(n2);let c=0,count=0;for(let i=3;i>=0;i--){if(A[i]+B[i]+c>=10){count++;c=1}else c=0}return count>=2?3:count===1?2:1;}
 return 1;
}
function obsErrorType(correct){if(correct)return null;if(currentType===6&&appChosenOp!==appProblem?.op)return 'operation_selection';if(op==='+'&&qCarryUsed)return 'carry_error';if(op==='-'&&qCrossZero&&qBorrowUsed)return 'cross_zero_error';if(op==='-'&&qBorrowUsed)return 'borrow_error';if(qAnswerChangeCount>1)return 'repeated_calculation_error';return 'calculation_error'}
function obsRecordEvent(type,detail={}){const now=Date.now();if(qLastActivity){const gap=now-qLastActivity;if(gap>=4000){qHesitationCount++;qHesitationDurationMs+=gap;qLongestPauseMs=Math.max(qLongestPauseMs,gap);qEvents.push({type:'pause',time:now-qStartTime,durationMs:gap});}}qLastActivity=now;qEvents.push({type,time:now-qStartTime,...detail})}
function obsBaselineTimes(operation,complexity){return getObs().filter(x=>x.correct&&x.operation===operation&&x.complexityLevel===complexity&&x.responseTimeMs>0).slice(-30).map(x=>x.responseTimeMs)}
function obsMedian(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y),m=Math.floor(b.length/2);return b.length%2?b[m]:Math.round((b[m-1]+b[m])/2)}

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function digits(n){return String(n).padStart(4,'0').split('').map(Number);}

// ===== 加法判斷 =====
function hasCarry(a,b){
 const A=digits(a),B=digits(b);
 let carry=0;
 for(let i=3;i>=0;i--){
  const sum=A[i]+B[i]+carry;
  if(sum>=10)return true;
  carry=0;
 }
 return false;
}

// 明確判斷「完全沒有進位」
function noCarry(a,b){
 const A=digits(a),B=digits(b);
 let carry=0;
 for(let i=3;i>=0;i--){
  if(A[i]+B[i]+carry>=10)return false;
  carry=0;
 }
 return true;
}

// ===== 減法判斷 =====
function hasBorrow(a,b){
 const A=digits(a),B=digits(b);
 let borrow=0;
 for(let i=3;i>=0;i--){
  const x=A[i]-borrow;
  if(x<B[i]){
   borrow=1;
   return true;
  }
  borrow=0;
 }
 return false;
}

function noBorrow(a,b){
 const A=digits(a),B=digits(b);
 let borrow=0;
 for(let i=3;i>=0;i--){
  if(A[i]-borrow<B[i])return false;
  borrow=0;
 }
 return true;
}

// ===== 四位數加法 =====
// mode：mixed / carry / noCarry
function makeAddition(mode){
 for(let k=0;k<1000;k++){
  let a=rand(1000,8999);
  let b=rand(1000,9999-a);
  if(b<1000)continue;

  const carry=hasCarry(a,b);
  if(mode==='carry' && !carry)continue;
  if(mode==='noCarry' && carry)continue;
  if(a+b>10000)continue;

  return [a,b,'+'];
 }

 // 理論上不會走到這裡；保底題也不超過 10000
 if(mode==='carry')return [6379,3621,'+']; // 10000，必有進位
 if(mode==='noCarry')return [1234,2345,'+'];
 return [3210,4567,'+'];
}

// ===== 四位數減法 =====
// mode：mixed / borrow / noBorrow / chain
function makeSubtraction(mode){
 for(let k=0;k<1000;k++){
  let a=rand(1000,9999);
  let b=rand(1,a);

  const borrow=hasBorrow(a,b);

  if(mode==='borrow' && !borrow)continue;
  if(mode==='noBorrow' && borrow)continue;

  if(mode==='chain'){
   // 必須真的跨過 0 借位，例如 5000－3、7000－8、4000－25。
   const crossesZero=(a%1000===0 && b<1000) ||
                     (Math.floor(a/100)%10===0 && b<100);
   if(!crossesZero || !borrow)continue;
  }

  return [a,b,'-'];
 }

 if(mode==='chain')return [5000,3,'-'];
 if(mode==='borrow')return [6200,185,'-'];
 if(mode==='noBorrow')return [8765,1234,'-'];
 return [7654,3210,'-'];
}

function reverseSubject(themeKey){
 const map={
  butterfly:'紫斑蝶',spoonbill:'黑面琵鷺',hawk:'灰面鵟鷹',duck:'小水鴨',forest:'樹木',river:'水環境資料',weather:'降雨資料',map:'參加者',go:'參賽者',school:'學生',dinosaur:'化石資料',park:'自然觀察紀錄',spoonbill_route:'黑面琵鷺',season_birds:'候鳥',eagle:'赤腹鷹',typhoon:'氣象觀測資料',wetland:'鳥類觀察紀錄',national_park_route:'路線調查',taiwan_counties:'參加者',museum:'參觀者',sea_turtle:'海龜觀察資料'
 };
 return map[themeKey]||'資料';
}
function makeReverseAppQuestion(p){
 const subject=reverseSubject(p.themeKey);
 if(p.op==='+'){
   const total=p.a+p.b;
   const templates=[
    `目前有 ${total.toLocaleString()} 個${subject}，已知原有 ${p.a.toLocaleString()} 個，請問增加多少個？`,
    `原來有 ${p.a.toLocaleString()} 個${subject}，現在變成 ${total.toLocaleString()} 個，請問增加了多少個？`,
    `原本記錄 ${p.a.toLocaleString()} 個${subject}，後來增加後共有 ${total.toLocaleString()} 個，請問增加了多少個？`
   ];
   return {...p,a:total,b:p.a,op:'-',text:templates[rand(0,templates.length-1)]};
 }
 const remain=p.a-p.b;
 const templates=[
   `原來有 ${p.a.toLocaleString()} 個${subject}，現在剩下 ${remain.toLocaleString()} 個，請問減少了多少個？`,
   `原本有 ${p.a.toLocaleString()} 個${subject}，後來變成 ${remain.toLocaleString()} 個，請問少了多少個？`,
   `一開始記錄 ${p.a.toLocaleString()} 個${subject}，現在只剩 ${remain.toLocaleString()} 個，請問減少了多少個？`
 ];
 return {...p,a:p.a,b:remain,op:'-',text:templates[rand(0,templates.length-1)]};
}

function escapeHTML(str){return String(str).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
function interactiveAppText(p){
 let text=escapeHTML(p.text);
 const a=escapeHTML(p.a.toLocaleString()), b=escapeHTML(p.b.toLocaleString());
 const tokenA=`<span class="app-number" draggable="true" data-app-num="0" onclick="appNumberClick(0)" ondragstart="appNumberDragStart(event,0)" ondragend="appNumberDragEnd(event)">${a}</span>`;
 const tokenB=`<span class="app-number" draggable="true" data-app-num="1" onclick="appNumberClick(1)" ondragstart="appNumberDragStart(event,1)" ondragend="appNumberDragEnd(event)">${b}</span>`;
 if(a===b) text=text.replace(a,'@@APP_A@@').replace(a,'@@APP_B@@');
 else text=text.replace(a,'@@APP_A@@').replace(b,'@@APP_B@@');
 return text.replace('@@APP_A@@',tokenA).replace('@@APP_B@@',tokenB);
}

function placeClass(index){
  // digits() 回傳 [千,百,十,個]，index 0~3。
  return ['place-qian','place-bai','place-shi','place-ge'][index];
}

function answerClass(index){
  // 四位答案 index 0~3 = 千、百、十、個；10000 的 index 0~4 = 萬、千、百、十、個。
  return correctVal===10000
    ? ['answer-wan','answer-qian','answer-bai','answer-shi','answer-ge'][index]
    : ['answer-qian','answer-bai','answer-shi','answer-ge'][index];
}

function colorizedNumberHTML(value){
  // 橫式題目固定以四位數字處理，但不顯示前導 0。
  // 這裡不依賴其他 DOM 狀態，避免題目區因輔助函式異常而整段空白。
  const raw=String(value);
  const num=Number.isFinite(Number(value)) ? Math.max(0,Math.trunc(Number(value))) : 0;
  const text=String(num);
  const arr=text.padStart(4,'0').slice(-4).split('');
  const firstNonZero=arr.findIndex(x=>x!=='0');
  const start=firstNonZero<0 ? 3 : firstNonZero;
  const classes=['place-qian','place-bai','place-shi','place-ge'];
  return arr.map((x,i)=>{
    if(i<start) return '';
    return `<span class="place-digit ${classes[i]}">${x}</span>`;
  }).join('');
}

function buildCalculationTeaching(){
 const A=String(n1).padStart(4,'0').split('').map(Number);
 const B=String(n2).padStart(4,'0').split('').map(Number);
 const places=['千位','百位','十位','個位'];
 const steps=[];
 if(op==='+'){
  let carry=0;
  for(let i=3;i>=0;i--){
   const sum=A[i]+B[i]+carry;
   const carryText=carry?`＋${carry}`:'';
   const out=Math.floor(sum/10);
   steps.push(`${places[i]}：${A[i]}＋${B[i]}${carryText}＝${sum}，這一位寫 ${sum%10}${out?'，並向左進 1':''}。`);
   carry=out;
  }
  return steps;
 }
 // 減法：完全依照實際紙本退位順序計算，讓說明與算式中的每一位一致。
 const work=A.slice();
 for(let i=3;i>=0;i--){
  const current=work[i];
  const sub=B[i];
  if(current>=sub){
   steps.push(`${places[i]}：${current}－${sub}＝${current-sub}。`);
   continue;
  }

  // 找左邊最近的非 0 位；中間若有 0，依序變成 9。
  let j=i-1;
  while(j>=0 && work[j]===0) j--;
  if(j<0){
   steps.push(`${places[i]}：${current} 不夠減 ${sub}，這一位需要退位。`);
   continue;
  }

  const sourceOld=work[j];
  work[j]=sourceOld-1;
  const through=[];
  for(let k=j+1;k<i;k++){
   work[k]=9;
   through.push(`${places[k]}的 0 變成 9`);
  }
  work[i]=current+10;

  let sentence=`${places[i]}：${current} 不夠減 ${sub}，要向左退位 1。`;
  if(j===i-1){
   sentence+=`${places[j]}的 ${sourceOld} 變成 ${work[j]}，${places[i]}得到 10，${work[i]}－${sub}＝${work[i]-sub}。`;
  }else{
   sentence+=`${places[j]}的 ${sourceOld} 變成 ${work[j]}，`;
   sentence+=through.join('，') + '，';
   sentence+=`${places[i]}得到 10，${work[i]}－${sub}＝${work[i]-sub}。`;
  }
  steps.push(sentence);
 }
 return steps;
}

function buildBorrowVisualHTML(){
 if(op!=='-' || n1===null || n2===null) return '';
 const A=String(n1).padStart(4,'0').split('').map(Number);
 const B=String(n2).padStart(4,'0').split('').map(Number);
 const work=A.slice();
 const events=[];
 const changed=new Set();
 const newValue=Array(4).fill(null);
 const places=['千位','百位','十位','個位'];

 // 與作答區完全相同的退位邏輯：從右往左，找到最近的非 0 位借 1，
 // 中間經過的 0 變 9，接收位得到 10。這裡只呈現「正確解答」，不替孩子改原題。
 for(let i=3;i>=0;i--){
   if(work[i] < B[i]){
     let j=i-1;
     while(j>=0 && work[j]===0){
       changed.add(j);
       work[j]=9;
       newValue[j]=9;
       events.push({source:j,receiver:i,sourceOld:0,sourceNew:9,kind:'through'});
       j--;
     }
     if(j<0) continue;
     const old=work[j];
     changed.add(j);
     work[j]=old-1;
     newValue[j]=work[j];
     work[i]+=10;
     newValue[i]=work[i];
     changed.add(i);
     events.push({source:j,receiver:i,sourceOld:old,sourceNew:work[j],kind:'borrow',ten:10});
   }
 }
 if(!events.length) return '';

 const receivers=new Set(events.map(e=>e.receiver));
 const width=5;
 let html='<div class="answer-borrow-wrap">';
 html+='<div class="answer-borrow-caption"></div>';
 html+='<div class="answer-borrow-grid">';

 // 第一列：與實際作答區第一列虛線格一致，保持空白，不製造額外步驟。
 html+='<div class="answer-borrow-label"></div>';
 html+='<div class="answer-borrow-empty"></div>'.repeat(5);

 // 第二列：與孩子操作的 d-0~d-3 完全同邏輯；正確解答在需要退位的位置填 10，
 // 並在「10」本身畫同方向的紅色 /。
 html+='<div class="answer-borrow-label">退位</div>';
 html+='<div class="answer-borrow-empty"></div>';
 for(let i=0;i<4;i++){
   const show=receivers.has(i);
   html+=`<div class="answer-borrow-box ${show?'applied':''}">${show?'10':''}</div>`;
 }

 // 只保留「變化」結果；不再重複列出一排「原數」。
 // 下面的彩色直式就是孩子要直接比對、計算的原算式，不另外重寫原數。
 html+='<div class="answer-borrow-label">變化</div>';
 html+='<div class="answer-borrow-empty"></div>';
 for(let i=0;i<4;i++){
   const nv=newValue[i];
   html+=`<div class="answer-borrow-new">${nv!==null?nv:''}</div>`;
 }
 html+='</div>';

 const notes=[];
 events.slice().reverse().forEach(e=>{
   if(e.kind==='through'){
     notes.push(`${places[e.source]}原本是 0，借位過程中變成 9。`);
   }else{
     notes.push(`${places[e.source]}借 1 給${places[e.receiver]}，${places[e.source]}的 ${e.sourceOld} 變成 ${e.sourceNew}，${places[e.receiver]}得到 10。`);
   }
 });
 html+=`<div class="correction-borrow-note">${notes.join('<br>')}</div>`;
 html+='</div>';
 return html;
}
function buildBorrowComparisonSteps(){
 const A=String(n1).padStart(4,'0').split('').map(Number);
 const B=String(n2).padStart(4,'0').split('').map(Number);
 const work=A.slice();
 const places=['千位','百位','十位','個位'];
 const events=[];
 for(let i=3;i>=0;i--){
  if(work[i]>=B[i]) continue;
  let j=i-1;
  while(j>=0 && work[j]===0) j--;
  if(j<0) continue;
  const sourceOld=work[j];
  work[j]=sourceOld-1;
  for(let k=j+1;k<i;k++) work[k]=9;
  work[i]+=10;
  events.push({source:j,receiver:i,sourceOld,sourceNew:work[j],receiverNew:work[i],through:(i-j>1)});
 }
 events.sort((a,b)=>a.source-b.source);
 return events.map(e=>{
  if(e.through){
   const middle=[];
   for(let k=e.source+1;k<e.receiver;k++) middle.push(`${places[k]}的 0 變成 9`);
   return `${places[e.source]}借 1 給${places[e.receiver]}，${places[e.source]}的 ${e.sourceOld} 變成 ${e.sourceNew}，${middle.join('，')}，${places[e.receiver]}得到 10。`;
  }
  return `${places[e.source]}借 1 給${places[e.receiver]}，${places[e.source]}的 ${e.sourceOld} 變成 ${e.sourceNew}，${places[e.receiver]}得到 10。`;
 });
}

 if(userVal!==null){

  }
 }

 if(userVal!==null && wrong.length){
  const cd=String(correctVal).padStart(total,'0').split('');
  const ud=String(userVal).padStart(total,'0').split('');
  const details=wrong.map(i=>{

 }else if(userVal===correctVal){

 }
 return html;
}

     return;
   }
   // 看答案時一律回到「題意的正確運算」，不能讓孩子誤選的＋／－改掉正解。
   const correctN1=appProblem.a;
   const correctN2=appProblem.b;
   n1=correctN1;
   n2=correctN2;
   op=appProblem.op;
   correctVal=op==='+'?n1+n2:n1-n2;
   const correction=document.getElementById('correction-under-problem');
   const topQ=document.querySelector('.top-question');
   if(topQ)topQ.classList.remove('app-hidden');
   const q1=document.getElementById('q1');
   const q2=document.getElementById('q2');
   const qo=document.getElementById('qo');
   if(q1)q1.innerHTML=colorizedNumberHTML(n1);
   if(q2)q2.innerHTML=colorizedNumberHTML(n2);
   if(qo)qo.innerText=op;
   if(appChosenOp!==appProblem.op){
     const box=document.getElementById('answer-help');
     const correctSign=appProblem.op==='+'?'＋':'－';
     const reason=appProblem.op==='+'?'題目是在問合起來／總共有多少。':'題目是在問從原來的數量中減少多少。';
     if(box){box.innerHTML=`<div class="answer-title">💡 這題要用正確的運算</div><div>${reason}所以要用 <strong>${correctSign}</strong>。</div>`;box.classList.remove('hidden');}
   }
 }
 const box=document.getElementById('answer-help');
 if(!box)return;
 const key=currentProblemKey();
 if(box.dataset.problemKey!==key){
   box.innerHTML='';
   box.classList.add('hidden');
 }
 box.dataset.problemKey=key;
 answerRevealed=true;
 const answerBtn=document.getElementById('show-answer-btn');
 if(answerBtn)answerBtn.innerText='💡 答案已顯示';
 let html='<div class="answer-title">💡 一起看答案，不要卡住</div>';
 if(currentType===6 && appProblem){
   const reason=op==='+'?'兩個數量合在一起，所以用加法。':'原來的數量拿走一部分，所以用減法。';
   html+=`<div>這題要用 <strong>${op==='+'?'加法（＋）':'減法（－）'}</strong>。${reason}</div>`;
   if(appChosenOp && appChosenOp!==op){
     html+=`<div class="answer-error">你剛才選的是 ${appChosenOp==='+'?'加法':'減法'}，第一個錯誤是在「判斷要用哪一種運算」。</div>`;
   }
 }
 const user=normalizedUserAnswer();
 const correction=document.getElementById('correction-under-problem');
 if(correction){
  correction.innerHTML=buildCorrectionUnderProblemHTML(user.value);
  correction.classList.remove('hidden');
 }
 if(user.value!==null && user.value!==correctVal){
   const err=getDigitErrorText(user.value);
   html+=`<div class="answer-error">這一題是 <strong>${n1.toLocaleString()} ${op} ${n2.toLocaleString()} = ${correctVal.toLocaleString()}</strong>。你填的是 ${user.value.toLocaleString()}。${err||'答案和這個算式不同，請重新檢查每一位。'}</div>`;
 }else if(user.value===correctVal){
   html+='<div>你填的答案已經正確！可以直接送出。</div>';
 }else{
   html+='<div>目前還沒有完整答案，所以先看正確直式，再回到原題自己算一次。</div>';
 }
 html+=`<div class="answer-teach"><strong>正確答案：</strong> <span class="answer-number">${correctVal.toLocaleString()}</span></div>`;
 box.innerHTML=html;
 box.classList.remove('hidden');
 box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function check(){
 if(currentType===6){
   const originalA=appProblem?.a, originalB=appProblem?.b, originalOp=appProblem?.op;
   const originalCorrect=originalOp==='+'?originalA+originalB:originalA-originalB;
   if(!appPlacementReady()){
     logMathError('直式建立錯誤','尚未把題目中的兩個數字放進第一列與第二列');
     const msg=document.getElementById('feedback');
     if(msg){msg.style.color='var(--red)';msg.innerText='先把題目中的兩個數字放進直式。';}
     return;
   }
   if(appChosenOp!==originalOp){
     if(!appOpWrongRecorded){
       appOpWrongRecorded=true;wrongCount++;appOpWrongCount++;qAttemptCount++;obsRecordEvent('operation_error',{chosen:appChosenOp,correct:originalOp});recordWrongProblem();
       const savedN1=n1,savedN2=n2,savedOp=op,savedCorrect=correctVal;
       n1=originalA;n2=originalB;op=originalOp;correctVal=originalCorrect;
       logMathError('運算判斷錯誤',`孩子選了 ${appChosenOp==='+'?'加法':'減法'}，正確應為 ${originalOp==='+'?'加法':'減法'}`);
       n1=savedN1;n2=savedN2;op=savedOp;correctVal=savedCorrect;
     }
     currentQPoints=Math.max(2,currentQPoints-2);
     const msg=document.getElementById('feedback');
     if(msg){msg.style.color='var(--red)';msg.innerText=`這題要用 ${originalOp==='+'?'＋ 加法':'－ 減法'}，點一下「切換加減」再試一次。`;}
     return;
   }
   const placedN1=appPlaced[0]===0?appProblem.a:appProblem.b;
   const placedN2=appPlaced[1]===0?appProblem.a:appProblem.b;
   if(originalOp==='-' && placedN1<placedN2){
     logMathError('直式建立錯誤','減法第一列放了較小的數量');
     const msg=document.getElementById('feedback');
     if(msg){msg.style.color='var(--red)';msg.innerText='減法時，第一列要放較大的數量。';}
     return;
   }
   // 到這裡才把孩子排出的直式同步成目前真正要計算的題目。
   n1=placedN1;n2=placedN2;op=originalOp;correctVal=originalCorrect;
 }
 const finalInput=document.getElementById('final-ans');
 let raw=(finalInput?.value||'').trim();
 // 上方送出與直式送出共用同一套答案解析：
 // 若上方答案框沒填，就直接讀取直式答案；前導 0 可省略。
 if(!/^\d+$/.test(raw)){
  const vertical=getVerticalAnswerValue();
  if(vertical.valid){
   raw=String(vertical.value);
   if(finalInput)finalInput.value=raw;
  }else{
   const msg=document.getElementById('feedback');
   if(msg){
    msg.style.color='var(--red)';
    msg.innerText=vertical.empty?'先填答案再送出。':'前面的 0 可以不填；中間的位數不能空著。';
   }
   return;
  }
 }
 const userVal=parseInt(raw,10);
 qAttemptCount++;qFinalAnswer=raw;if(qInitialAnswer==='')qInitialAnswer=raw;else if(raw!==qInitialAnswer){qAnswerChangeCount++;qChangedAnswer=true;}qReviewBeforeSubmit=(qAnswerChangeCount>0||(qProcessActionCount>0&&qFirstInputAt!==null&&Date.now()-qFirstInputAt>=3000));obsRecordEvent('submit',{answer:raw,attempt:qAttemptCount});
 const obsCorrect=(userVal===correctVal); recordObservation(obsCorrect);
 const msg=document.getElementById('feedback');

 if(userVal===correctVal){
  celebrateCorrect();
  totalPoints+=currentQPoints;
  document.getElementById('score').innerText=totalPoints;
  awardPokemonGrowth();
  msg.style.color='var(--green)';
  msg.innerText='答對了！繼續下一題。';
  setTimeout(()=>{
   if(window.__retryQueue && Array.isArray(window.__retryQueue)){
     if(currentQ < window.__retryQueue.length){
       currentQ++;
       appProblem={...window.__retryQueue[currentQ-1]};
       appChosenOp='+'; appPlaced=[null,null]; appTargetRow=null; appSelectedNumber=null; appOpWrongRecorded=false; n1=appProblem.a;n2=appProblem.b;op=appProblem.op;correctVal=op==='+'?n1+n2:n1-n2;currentQPoints=10;
       resetObservationQuestion();
       answerRevealed=false; resetAnswerHelp();
       document.getElementById('mode-label').innerText='🔁 今日錯題再戰';
       renderContext(appProblem); renderAppChoices();
       document.querySelector('.top-question').classList.add('app-hidden');
       document.querySelector('.math-card').classList.add('app-hidden');
       document.getElementById('q-count').innerText=currentQ;
       document.getElementById('bar').style.width=((currentQ-1)/window.__retryQueue.length*100)+'%';
     }else{
       window.__retryQueue=null; showResult();
     }
   }else if(currentQ<10){currentQ++;loadProblem();}
   else showResult();
  },650);
 }else{
  wrongCount++;
  appCalcWrongCount += currentType===6 ? 1 : 0;
  logMathError('答案錯誤','孩子送出的答案與正確答案不同');
  recordWrongProblem();
  currentQPoints=Math.max(2,currentQPoints-2);
  msg.style.color='var(--red)';
  msg.innerText='再試一次，仔細看看你的直式。';
  qRestartCount++;obsRecordEvent('retry',{attempt:qAttemptCount});document.getElementById('final-ans').value='';
  setTimeout(()=>msg.innerText='',1300);
 }
}

function showResult(){
 qStartTime=0;
 show('result');
 const maxScore=sessionQuestionTotal*10;
 document.getElementById('result-score').innerText=`總積分：${totalPoints} / ${maxScore}`;
 document.getElementById('result-title').innerText=totalPoints===sessionQuestionTotal*10?'全部答對！':'挑戰完成！';
 const arr=totalPoints===maxScore?praisePerfect:praiseGood;
 document.getElementById('praise').innerText=arr[Math.floor(Math.random()*arr.length)];
 const stats=document.getElementById('stats');
 if(currentType===6){
   stats.innerHTML=`${sessionQuestionTotal} 題完成｜情境判斷錯誤：${appOpWrongCount} 次｜計算錯誤：${appCalcWrongCount} 次｜本次錯誤已記錄：${sessionErrorLogCount} 筆｜看答案：${sessionAnswerViewCount} 次｜需要再練習的題目：${wrongProblems.length} 題`;
 }else{
   stats.innerText=`${sessionQuestionTotal} 題完成｜需要重新計算的題目：${wrongCount} 題｜錯誤已記錄：${sessionErrorLogCount} 筆｜看答案：${sessionAnswerViewCount} 次｜每題最多 10 分，重新嘗試會扣 2 分。`;
 }
 const pp=pokemonById(pokemonState.species);
 stats.innerHTML += `<br>🐾 ${pp.name} Lv.${pokemonState.level}｜訓練 HP：${pokemonState.hp}/${pokemonMaxHp()}`;
 const wrap=document.getElementById('retry-wrong-wrap');
 if(wrap)wrap.style.display=wrongProblems.length?'block':'none';
}

function retryWrong(){
 if(!wrongProblems.length)return;
 currentQ=1; totalPoints=0; wrongCount=0; appOpWrongCount=0; appCalcWrongCount=0;
 answerRevealed=false; answerViewLogged=false; sessionErrorLogCount=0; sessionAnswerViewCount=0; resetAnswerHelp();
 const queue=wrongProblems.map(x=>({...x}));
 sessionQuestionTotal=queue.length;
 wrongProblems=[];
 show('game');
 document.getElementById('score').innerText='0';
 document.getElementById('q-count').innerText='1';
 document.getElementById('mode-label').innerText='🔁 今日錯題再戰';
 const p=queue[0];
 appProblem=p; appChosenOp='+'; appPlaced=[null,null]; appTargetRow=null; appSelectedNumber=null; appOpWrongRecorded=false;
 n1=p.a;n2=p.b;op=p.op;correctVal=op==='+'?n1+n2:n1-n2;currentQPoints=10;
 resetObservationQuestion();
 renderContext(p); renderAppChoices();
 document.getElementById('context-card').classList.remove('app-hidden');
 document.querySelector('.top-question').classList.add('app-hidden');
 document.querySelector('.math-card').classList.add('app-hidden');
 window.__retryQueue=queue;
 updatePaperBridge();
}


function show(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
function goHome(){qStartTime=0;show('home');initMenu();}
window.onload=initMenu;

document.addEventListener('focusin',function(e){if(e.target&&e.target.matches('input,button'))obsRecordEvent('focus',{target:e.target.id||e.target.className||e.target.tagName})});
document.addEventListener('input',function(e){if(!qStartTime||!e.target)return;if(e.target.id==='final-ans'){const v=e.target.value;if(!qInputStarted&&v!==''){qInputStarted=true;qFirstInputAt=Date.now();qInitialAnswer=v;obsRecordEvent('input',{field:'final-ans',value:v})}else {if(v!==qLastAnswerValue){qAnswerChangeCount++;qLastAnswerValue=v}obsRecordEvent(v?'input':'delete',{field:'final-ans',value:v})}}});
document.addEventListener('visibilitychange',function(){if(document.hidden)obsRecordEvent('pause',{reason:'visibility_hidden'});else obsRecordEvent('resume',{reason:'visibility_visible'})});
document.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
        const active = document.activeElement;
        if(active && (
            active.classList.contains('digit-input') ||
            active.classList.contains('final-ans') ||
            active.classList.contains('carry-cell')
        )){
            e.preventDefault();
            const finalInput = document.getElementById('final-ans');
            if(finalInput && active !== finalInput && typeof moveAndSubmit === 'function'){
                moveAndSubmit();
            }else if(typeof check === 'function'){
                check();
            }
        }
    }
});

</script>

    <img id="pokemon-levelup-img" alt="寶可夢升級" onerror="this.style.visibility='hidden'">
    <div class="pokemon-levelup-title">✨ 升級成功！✨</div>
    <div class="pokemon-levelup-sub" id="pokemon-levelup-text"></div>
    <button class="btn-main" onclick="closePokemonLevelUp()">繼續數學挑戰</button>
  </div>
