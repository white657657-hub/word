<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>樂活英文｜老人單字學習</title>
<style>
:root{
  --bg:#f7f3e8; --card:#fffdf7; --ink:#263238; --muted:#66736d;
  --green:#477a5a; --green2:#e7f1e8; --gold:#c68b25; --red:#b94a48;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding:16px}
header{text-align:center;padding:8px 0 14px}
h1{font-size:30px;margin:0 0 6px;color:var(--green)}
.subtitle{font-size:18px;color:var(--muted)}
.panel{background:var(--card);border:2px solid #ddd5c5;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 3px 12px #0000000d}
.label{font-size:18px;font-weight:800;margin-bottom:8px}
select{width:100%;padding:15px;border:2px solid #aaa18f;border-radius:14px;background:white;font-size:20px;color:var(--ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tab{border:0;border-radius:16px;padding:15px;font-size:21px;font-weight:900;cursor:pointer}
.tab.active{background:var(--green);color:white}.tab:not(.active){background:var(--green2);color:var(--green)}
.word-card{text-align:center;padding:20px 10px}
.cn{font-size:38px;font-weight:900;color:#76531b;margin-bottom:6px}
.en{font-size:48px;font-weight:900;letter-spacing:1px}
.sound{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:15px;padding:14px 24px;border:0;border-radius:18px;background:#e7f1e8;color:#28553a;font-size:23px;font-weight:900;cursor:pointer}
.hint{font-size:17px;color:var(--muted);margin-top:12px}
.progress{font-size:18px;font-weight:800;color:var(--muted);text-align:center;margin:10px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav button,.next{padding:14px;border:0;border-radius:14px;font-size:20px;font-weight:900;cursor:pointer}
.prev{background:#e7e2d7;color:#555}.next{background:var(--green);color:#fff}
.quiz-card{text-align:center}
.quiz-en{font-size:52px;font-weight:900;margin:10px}
.quiz-sound{border:0;background:#e7f1e8;color:#28553a;border-radius:14px;padding:11px 18px;font-size:20px;font-weight:900;cursor:pointer}
.question{font-size:21px;font-weight:800;margin:18px 0 10px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{min-height:74px;border:2px solid #c9c0ae;background:#fff;border-radius:16px;font-size:25px;font-weight:900;cursor:pointer;color:var(--ink)}
.option.correct{background:#dff2e1;border-color:#4c9b62;color:#245b32}
.option.wrong{background:#f8dfdd;border-color:#c55b57;color:#8e302d}
.result{min-height:32px;text-align:center;font-size:21px;font-weight:900;margin-top:12px}
.hidden{display:none!important}
.unit-list{display:grid;gap:9px}
.unit-btn{display:flex;justify-content:space-between;align-items:center;text-align:left;border:2px solid #ddd5c5;background:#fffdf7;border-radius:15px;padding:14px 16px;font-size:20px;font-weight:800;cursor:pointer}
.unit-btn span{font-size:16px;color:var(--muted)}
footer{text-align:center;color:#7c837e;font-size:15px;padding:8px 0 24px}
@media(max-width:560px){
 .app{padding:10px}.en{font-size:40px}.quiz-en{font-size:44px}.cn{font-size:34px}
 .options{grid-template-columns:1fr}.option{min-height:66px}
 h1{font-size:27px}.tab{font-size:19px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>🌿 樂活英文</h1>
  <div class="subtitle">每天學一點，生活用得到的英文</div>
</header>

<div class="panel">
  <div class="label">📚 選擇今天的單元</div>
  <select id="unitSelect"></select>
</div>

<div class="panel">
  <div class="tabs">
    <button id="practiceTab" class="tab active" onclick="showMode('practice')">🔊 看單字・聽發音</button>
    <button id="quizTab" class="tab" onclick="showMode('quiz')">📝 小測驗</button>
  </div>
</div>

<section id="practice" class="panel">
  <div class="progress" id="practiceProgress"></div>
  <div class="word-card">
    <div class="cn" id="practiceCn"></div>
    <div class="en" id="practiceEn"></div>
    <button class="sound" onclick="speakCurrent()">🔊 再唸一次</button>
    <div class="hint">不用輸入英文，只要看、聽、按發音。</div>
  </div>
  <div class="nav">
    <button class="prev" onclick="prevWord()">← 上一個</button>
    <button class="next" onclick="nextWord()">下一個 →</button>
  </div>
</section>

<section id="quiz" class="panel hidden">
  <div class="progress" id="quizProgress"></div>
  <div class="quiz-card">
    <div class="quiz-en" id="quizEn"></div>
    <button class="quiz-sound" onclick="speakQuiz()">🔊 再唸一次</button>
    <div class="question">請問這個英文是什麼？</div>
    <div class="options" id="options"></div>
    <div class="result" id="result"></div>
    <button class="next" id="quizNext" style="width:100%;margin-top:12px" onclick="nextQuiz()">下一題 →</button>
  </div>
</section>

<div class="panel">
  <div class="label">📖 十個單元</div>
  <div class="unit-list" id="unitList"></div>
</div>

<footer>字體放大、按鈕放大、不需要打字，適合長輩使用。</footer>
</div>

<script>
const units=[
 {name:"第一單元｜數字 1～10",words:[
  ["one","一"],["two","二"],["three","三"],["four","四"],["five","五"],
  ["six","六"],["seven","七"],["eight","八"],["nine","九"],["ten","十"]
 ]},
 {name:"第二單元｜家裡常用品",words:[
  ["chair","椅子"],["table","桌子"],["bed","床"],["door","門"],["window","窗戶"],
  ["lamp","燈"],["phone","電話"],["clock","時鐘"],["key","鑰匙"],["cup","杯子"]
 ]},
 {name:"第三單元｜吃飯喝水",words:[
  ["rice","飯"],["bread","麵包"],["egg","蛋"],["milk","牛奶"],["water","水"],
  ["tea","茶"],["coffee","咖啡"],["apple","蘋果"],["banana","香蕉"],["fish","魚"]
 ]},
 {name:"第四單元｜家人",words:[
  ["family","家人"],["father","爸爸"],["mother","媽媽"],["son","兒子"],["daughter","女兒"],
  ["husband","丈夫"],["wife","妻子"],["brother","兄弟"],["sister","姊妹"],["friend","朋友"]
 ]},
 {name:"第五單元｜穿著用品",words:[
  ["shirt","襯衫"],["pants","褲子"],["shoes","鞋子"],["socks","襪子"],["hat","帽子"],
  ["coat","外套"],["bag","包包"],["umbrella","雨傘"],["glasses","眼鏡"],["watch","手錶"]
 ]},
 {name:"第六單元｜交通",words:[
  ["car","汽車"],["bus","公車"],["train","火車"],["taxi","計程車"],["bike","腳踏車"],
  ["motorcycle","機車"],["station","車站"],["road","道路"],["ticket","票"],["airport","機場"]
 ]},
 {name:"第七單元｜身體與健康",words:[
  ["head","頭"],["eye","眼睛"],["ear","耳朵"],["nose","鼻子"],["mouth","嘴巴"],
  ["hand","手"],["foot","腳"],["doctor","醫生"],["medicine","藥"],["hospital","醫院"]
 ]},
 {name:"第八單元｜時間生活",words:[
  ["morning","早上"],["afternoon","下午"],["evening","晚上"],["today","今天"],["tomorrow","明天"],
  ["yesterday","昨天"],["day","天"],["week","星期"],["month","月份"],["year","年"]
 ]},
 {name:"第九單元｜生活場所",words:[
  ["home","家"],["school","學校"],["market","市場"],["store","商店"],["bank","銀行"],
  ["park","公園"],["restaurant","餐廳"],["church","教堂"],["library","圖書館"],["post office","郵局"]
 ]},
 {name:"第十單元｜生活常用動作",words:[
  ["eat","吃"],["drink","喝"],["go","去"],["come","來"],["sit","坐"],
  ["stand","站"],["walk","走路"],["read","閱讀"],["sleep","睡覺"],["help","幫忙"]
 ]}
];

let unit=0,wi=0,quizIndex=0,quizAnswered=false;
const $=id=>document.getElementById(id);

function populate(){
  $("unitSelect").innerHTML=units.map((u,i)=>`<option value="${i}">${u.name}</option>`).join("");
  $("unitSelect").onchange=()=>{unit=+$("unitSelect").value;wi=0;quizIndex=0;quizAnswered=false;renderAll();};
  $("unitList").innerHTML=units.map((u,i)=>`<button class="unit-btn" onclick="selectUnit(${i})"><b>${u.name}</b><span>10 個單字</span></button>`).join("");
}
function selectUnit(i){unit=i;wi=0;quizIndex=0;quizAnswered=false;$("unitSelect").value=i;renderAll();window.scrollTo({top:0,behavior:"smooth"});}
function current(){return units[unit].words[wi];}
function renderPractice(){
 const [en,cn]=current();
 $("practiceCn").textContent=cn;$("practiceEn").textContent=en;
 $("practiceProgress").textContent=`第 ${wi+1} / 10 個`;
}
function renderQuiz(){
 const words=units[unit].words;
 const [en]=words[quizIndex];
 $("quizEn").textContent=en;
 $("quizProgress").textContent=`小測驗：第 ${quizIndex+1} / 10 題`;
 $("result").textContent="";quizAnswered=false;
 let choices=[words[quizIndex]];
 while(choices.length<4){
   const w=words[Math.floor(Math.random()*words.length)];
   if(!choices.includes(w))choices.push(w);
 }
 choices.sort(()=>Math.random()-.5);
 $("options").innerHTML=choices.map(w=>`<button class="option" onclick="answer('${w[0].replace(/'/g,"\\'")}',this)">${w[1]}</button>`).join("");
}
function renderAll(){renderPractice();renderQuiz();}
function showMode(m){
 $("practice").classList.toggle("hidden",m!=="practice");
 $("quiz").classList.toggle("hidden",m!=="quiz");
 $("practiceTab").classList.toggle("active",m==="practice");
 $("quizTab").classList.toggle("active",m==="quiz");
 if(m==="quiz")renderQuiz();
}
function speak(text){
 if(!("speechSynthesis" in window)){alert("這個瀏覽器不支援語音播放。");return;}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.78;u.pitch=1;
 speechSynthesis.speak(u);
}
function speakCurrent(){speak(current()[0]);}
function speakQuiz(){speak(units[unit].words[quizIndex][0]);}
function nextWord(){wi=(wi+1)%10;renderPractice();speakCurrent();}
function prevWord(){wi=(wi+9)%10;renderPractice();speakCurrent();}
function answer(en,btn){
 if(quizAnswered)return;
 quizAnswered=true;
 const correct=units[unit].words[quizIndex];
 document.querySelectorAll(".option").forEach(b=>{
   if(b.textContent===correct[1])b.classList.add("correct");
 });
 if(en===correct[0]){
   btn.classList.add("correct");$("result").textContent="✓ 答對了！很好！";$("result").style.color="#2e7442";
 }else{
   btn.classList.add("wrong");$("result").textContent=`再想一下：答案是「${correct[1]}」`;
   $("result").style.color="#9b3d39";
   speak(correct[0]);
 }
}
function nextQuiz(){quizIndex=(quizIndex+1)%10;renderQuiz();}
populate();renderAll();
</script>
</body>
</html>
