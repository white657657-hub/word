<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY ENGLISH LAB｜成人雙領域英文</title>
<style>
:root{--navy:#18324b;--blue:#2f6f9f;--pale:#edf5fb;--ink:#263746;--muted:#6b7d8d;--line:#dce6ee;--green:#26775c;--gold:#b88316}
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",Arial,sans-serif}
header{background:var(--navy);color:white;padding:22px max(18px,calc((100% - 980px)/2))}header h1{margin:0;font-size:24px;letter-spacing:.04em}header p{margin:5px 0 0;color:#c8d8e5}
main{max-width:980px;margin:22px auto;padding:0 16px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 18px #1c3b5510}
h2{font-size:20px;margin:0 0 14px;color:var(--navy)}h3{margin:0 0 8px}.muted{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
button,select,input,textarea{font:inherit}button{border:0;border-radius:11px;padding:11px 15px;background:var(--blue);color:white;font-weight:650;cursor:pointer}button.secondary{background:#eaf1f6;color:#29465e}button.ghost{background:white;color:var(--blue);border:1px solid var(--line)}button.danger{background:#fff0ef;color:#a53c35}button:disabled{opacity:.45;cursor:not-allowed}
.route{padding:20px;text-align:left;min-height:130px;background:var(--pale);color:var(--navy);border:1px solid #d7e7f3}.route small{display:block;color:var(--muted);font-weight:400;margin-top:8px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
select,input,textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:white;color:var(--ink);max-width:100%}input{width:100%}textarea{width:100%;min-height:75px}
.word{font-size:clamp(27px,5vw,38px);font-weight:750;color:var(--navy);margin:18px 0 8px}.meaning{font-size:20px;margin-bottom:14px}.sentence{background:#f7fafc;border-left:4px solid #83aeca;padding:13px;border-radius:8px;line-height:1.6}
.progress{height:8px;background:#e8eef3;border-radius:20px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:#4a9a7a;width:0}
.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item strong{display:block}.pill{font-size:12px;border-radius:99px;background:#edf3f7;padding:4px 8px;color:#4c6579}
.feedback{min-height:26px;font-weight:650;margin-top:10px}.good{color:var(--green)}.bad{color:#b04b42}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}.hidden{display:none!important}.stats{font-size:13px;color:var(--muted)}
@media(max-width:560px){main{margin:12px auto}.panel{padding:16px}header{padding:18px}button{padding:11px 12px}}
</style>
</head>
<body>
<header><h1>MY ENGLISH LAB</h1><p>成人雙領域英文學習｜旅遊 × 稽核與資訊安全</p></header>
<main>
<section id="home" class="panel">
<h2>選擇學習路線</h2>
<div class="grid">
<button class="route" onclick="choose('travel')"><b>Travel English</b><small>旅遊英文｜機場、飯店、交通、購物與緊急情境</small></button>
<button class="route" onclick="choose('audit')"><b>Audit & Cybersecurity English</b><small>稽核與資安英文｜ISO、ISMS、風險、控制措施與稽核溝通</small></button>
</div>
<div class="row" style="margin-top:14px"><button class="secondary" onclick="showStars()">☆ 星號複習</button><button class="secondary" onclick="showWrong()">錯題複習</button><button class="secondary" onclick="showManager()">題庫管理</button><button class="ghost" onclick="showProgress()">學習進度</button></div>
<p class="muted">資料保存在此瀏覽器；請定期使用題庫管理中的匯出備份。</p>
</section>
<section id="workspace" class="panel hidden">
<div class="between"><div><span id="routeTag" class="pill"></span><h2 id="unitTitle" style="margin-top:8px"></h2></div><button class="ghost" onclick="goHome()">回首頁</button></div>
<div class="row"><label style="margin:0">單元</label><select id="unitSelect" onchange="loadUnit()"></select><label style="margin:0">模式</label><select id="mode"><option value="learn">認識單字</option><option value="recall">中文回想英文</option><option value="spell">拼字練習</option><option value="test">單元測驗</option></select><button onclick="begin()">開始</button></div>
<div id="practice" class="hidden">
<div class="between stats"><span id="counter"></span><span id="score"></span></div><div class="progress"><span id="bar"></span></div>
<div class="word" id="prompt"></div><div class="meaning" id="answer"></div>
<div class="sentence" id="sentenceBox"></div>
<div class="row" style="margin-top:12px"><button class="secondary" onclick="sayWord()">🔊 單字</button><button class="secondary" onclick="saySentence()">🔊 情境句</button><button class="secondary" onclick="toggleStar()">☆ 標記星號</button></div>
<div id="responseArea" style="margin-top:15px"></div><div class="feedback" id="feedback" aria-live="polite"></div>
<div class="row"><button class="ghost" onclick="passItem()">PASS｜稍後再練</button><button id="nextBtn" onclick="nextItem()">下一題 →</button></div>
</div>
</section>
<section id="manager" class="panel hidden">
<div class="between"><h2>題庫管理</h2><button class="ghost" onclick="goHome()">回首頁</button></div>
<p class="muted">可新增單字、編輯中英文字與例句；匯入 JSON 備份。匯出後請自行保存檔案。</p>
<div class="grid">
<div><label>學習路線</label><select id="mRoute"><option value="travel">旅遊英文</option><option value="audit">稽核與資安英文</option></select></div>
<div><label>單元名稱</label><input id="mUnit" value="自訂單元"></div>
</div>
<div class="grid">
<div><label>英文單字／片語</label><input id="mWord" placeholder="例如：boarding pass"></div>
<div><label>繁體中文</label><input id="mMeaning" placeholder="例如：登機證"></div>
</div>
<div class="grid">
<div><label>英文情境句</label><input id="mSentence" placeholder="例如：May I see your boarding pass?"></div>
<div><label>句子中文</label><input id="mSentenceZh" placeholder="例如：可以看一下您的登機證嗎？"></div>
</div>
<div class="row" style="margin:12px 0"><button onclick="addWord()">新增／更新單字</button><button class="secondary" onclick="exportData()">匯出 JSON 備份</button><label class="ghost" style="padding:9px 12px;border-radius:10px;border:1px solid var(--line);cursor:pointer;color:var(--blue)">匯入 JSON<input type="file" accept=".json,application/json" onchange="importData(event)" style="display:none"></label></div>
<div id="manageList" class="list"></div>
</section>
<section id="report" class="panel hidden"><div class="between"><h2 id="reportTitle">學習進度</h2><button class="ghost" onclick="goHome()">回首頁</button></div><div id="reportBody"></div></section>
</main>
<script>
const starter={
travel:[
{unit:"01｜機場報到與出境",words:[
["departure","出境；出發","Our departure is at 10 a.m.","我們上午十點出發。"],["departure gate","登機門","Where is the departure gate?","登機門在哪裡？"],["boarding pass","登機證","May I see your boarding pass?","可以看一下您的登機證嗎？"],["passport","護照","Here is my passport.","這是我的護照。"],["luggage","行李","Where can I collect my luggage?","我在哪裡可以領取行李？"],["baggage allowance","行李額度","What is my baggage allowance?","我的行李額度是多少？"],["check-in counter","報到櫃檯","Where is the check-in counter?","報到櫃檯在哪裡？"],["aisle seat","走道座位","Could I have an aisle seat?","可以給我走道座位嗎？"],["window seat","靠窗座位","I'd like a window seat.","我想要靠窗座位。"],["boarding","登機","When does boarding begin?","什麼時候開始登機？"],["delayed","延誤的","My flight has been delayed.","我的航班延誤了。"],["cancelled","取消的","The flight was cancelled.","航班取消了。"],["security check","安全檢查","Where is the security check?","安全檢查在哪裡？"],["immigration","入境查驗","We need to go through immigration.","我們需要通過入境查驗。"],["customs","海關","Do I need to declare this?","這個需要申報嗎？"],["terminal","航廈","Which terminal should I go to?","我應該去哪個航廈？"],["connecting flight","轉機航班","I have a connecting flight.","我有轉機航班。"],["one-way ticket","單程票","I need a one-way ticket.","我需要一張單程票。"],["round-trip ticket","來回機票","I booked a round-trip ticket.","我訂了來回機票。"],["overhead compartment","頭頂置物櫃","Can I put this in the overhead compartment?","我可以把這個放在頭頂置物櫃嗎？"]]},
{unit:"02｜入境與海關",words:[["purpose of visit","訪問目的","What is the purpose of your visit?","您此行的目的為何？"],["vacation","度假","I'm here on vacation.","我是來度假的。"],["business trip","商務旅行","I'm here on a business trip.","我是來出差的。"],["duration","期間；時長","How long will you stay?","您會停留多久？"],["address","地址","Here is my hotel address.","這是我的飯店地址。"],["customs declaration","海關申報","Please complete the customs declaration.","請填寫海關申報。"],["declare","申報","Do I need to declare these items?","這些物品需要申報嗎？"],["resident","居民","Are you a resident?","您是居民嗎？"],["visa","簽證","Do I need a visa?","我需要簽證嗎？"],["entry","入境","Is entry permitted?","可以入境嗎？"]] }
],
audit:[
{unit:"01｜ISO 27001 基礎術語",words:[["information security","資訊安全","Information security is part of our management system.","資訊安全是我們管理制度的一部分。"],["ISMS","資訊安全管理系統","The ISMS is reviewed annually.","資訊安全管理系統每年接受審查。"],["scope","範圍","Please confirm the ISMS scope.","請確認 ISMS 範圍。"],["interested party","利害關係人","Identify relevant interested parties.","識別相關利害關係人。"],["requirement","要求","We need to determine applicable requirements.","我們需要判定適用要求。"],["policy","政策","The information security policy is approved.","資訊安全政策已核准。"],["objective","目標","The security objective is measurable.","資訊安全目標是可衡量的。"],["risk assessment","風險評鑑","The risk assessment is updated annually.","風險評鑑每年更新。"],["risk treatment","風險處理","The risk treatment plan is documented.","風險處理計畫已文件化。"],["control","控制措施","The control is implemented.","控制措施已實施。"],["audit evidence","稽核證據","Please provide audit evidence.","請提供稽核證據。"],["audit finding","稽核發現","The audit finding is documented.","稽核發現已記錄。"],["nonconformity","不符合事項","A nonconformity was identified.","已識別一項不符合事項。"],["corrective action","矯正措施","Please define corrective action.","請訂定矯正措施。"],["residual risk","剩餘風險","Residual risk is accepted by management.","剩餘風險由管理階層接受。"],["statement of applicability","適用性聲明","The statement of applicability is reviewed.","適用性聲明已審查。"],["management review","管理審查","Management review is conducted regularly.","定期執行管理審查。"],["access control","存取控制","Access control is based on business needs.","存取控制依業務需求設定。"],["vulnerability","弱點","The vulnerability is tracked to closure.","該弱點持續追蹤至結案。"],["remediation","修補；改善","Remediation is planned for next week.","修補作業預計下週執行。"]]}
]};
const KEY='myEnglishLab_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||starter;
let route='travel',unitIndex=0,items=[],pos=0,correct=0,passed=0,mode='learn',revealed=false,starred=new Set(JSON.parse(localStorage.getItem(KEY+'_stars')||'[]')),wrong=new Set(JSON.parse(localStorage.getItem(KEY+'_wrong')||'[]'));
function save(){localStorage.setItem(KEY,JSON.stringify(db));localStorage.setItem(KEY+'_stars',JSON.stringify([...starred]));localStorage.setItem(KEY+'_wrong',JSON.stringify([...wrong]));}
function key(w){return route+'|'+w.toLowerCase()}
function hideAll(){['home','workspace','manager','report'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
function goHome(){hideAll();home.classList.remove('hidden')}
function choose(r){route=r;hideAll();workspace.classList.remove('hidden');routeTag.textContent=r==='travel'?'TRAVEL ENGLISH｜旅遊英文':'AUDIT & CYBERSECURITY｜稽核與資安';unitSelect.innerHTML=db[r].map((u,i)=>`<option value="${i}">${esc(u.unit)}</option>`).join('');unitIndex=0;loadUnit()}
function loadUnit(){unitIndex=+unitSelect.value;unitTitle.textContent=db[route][unitIndex].unit;practice.classList.add('hidden')}
function begin(){mode=document.getElementById('mode').value;items=[...db[route][unitIndex].words].sort(()=>Math.random()-.5);if(mode==='test')items=items.slice(0,Math.min(10,items.length));pos=0;correct=0;passed=0;practice.classList.remove('hidden');renderQ()}
function renderQ(){if(pos>=items.length){document.getElementById('prompt').textContent='本次完成';answer.textContent=`答對 ${correct} 題｜PASS ${passed} 題｜本次題數 ${items.length}`;sentenceBox.textContent='建議稍後再複習答錯與 PASS 的單字。';responseArea.innerHTML='';feedback.textContent='';nextBtn.textContent='回到單元';nextBtn.onclick=()=>{practice.classList.add('hidden')};counter.textContent='完成';bar.style.width='100%';return}
revealed=false;let w=items[pos];counter.textContent=`第 ${pos+1} / ${items.length} 題`;score.textContent=`答對 ${correct}｜PASS ${passed}`;bar.style.width=(pos/items.length*100)+'%';feedback.textContent='';answer.textContent='';sentenceBox.textContent='';prompt.textContent=mode==='recall'?w[1]:w[0];if(mode==='learn'){answer.textContent=w[1];sentenceBox.innerHTML=`<b>${esc(w[2]||'尚無情境句')}</b><br>${esc(w[3]||'')}`}else{sentenceBox.textContent='先回想答案，再按「顯示答案」。'}
responseArea.innerHTML=mode==='spell'?'<input id="typed" autocomplete="off" placeholder="輸入英文答案"><div class="row" style="margin-top:8px"><button onclick="checkTyped()">確認答案</button><button class="secondary" onclick="reveal()">顯示答案</button></div>':mode==='learn'?'<button class="secondary" onclick="reveal()">顯示／隱藏中文與例句</button>':'<div class="row"><button onclick="reveal()">顯示答案</button><button class="secondary" onclick="markKnown()">我答對了</button></div>';nextBtn.textContent='下一題 →';nextBtn.onclick=nextItem;}
function reveal(){let w=items[pos];answer.textContent=w[1];sentenceBox.innerHTML=`<b>${esc(w[2]||'尚無情境句')}</b><br>${esc(w[3]||'')}`;revealed=true}
function markKnown(){if(!revealed){feedback.textContent='請先回想，再顯示答案。';return}correct++;wrong.delete(key(items[pos][0]));feedback.textContent='已記錄為答對。';feedback.className='feedback good'}
function checkTyped(){let v=(document.getElementById('typed').value||'').trim().toLowerCase();if(v===items[pos][0].toLowerCase()){correct++;wrong.delete(key(items[pos][0]));feedback.textContent='答對！';feedback.className='feedback good';reveal()}else{wrong.add(key(items[pos][0]));save();feedback.textContent='再看一次拼字，按顯示答案後可繼續。';feedback.className='feedback bad';reveal()}}
function nextItem(){pos++;save();renderQ()}
function passItem(){passed++;nextItem()}
function toggleStar(){let k=key(items[pos][0]);starred.has(k)?starred.delete(k):starred.add(k);save();feedback.textContent=starred.has(k)?'已加入星號複習。':'已取消星號。'}
function say(text,rate=1){if(!('speechSynthesis'in window)){feedback.textContent='此瀏覽器不支援語音合成。';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)}
function sayWord(){say(items[pos][0],.85)}function saySentence(){say(items[pos][2]||items[pos][0],.82)}
function showManager(){hideAll();manager.classList.remove('hidden');renderManager()}
function renderManager(){manageList.innerHTML=db[route].flatMap((u,i)=>u.words.map((w,j)=>`<div class="item"><div><strong>${esc(w[0])} <span class="pill">${esc(w[1])}</span></strong><small class="muted">${esc(u.unit)} · ${esc(w[2]||'')}</small></div><button class="danger" onclick="removeWord('${route}',${i},${j})">刪除</button></div>`)).join('')||'<p class="muted">目前沒有單字。</p>'}
function addWord(){let r=mRoute.value,name=mUnit.value.trim()||'自訂單元',w=mWord.value.trim(),zh=mMeaning.value.trim();if(!w||!zh){alert('英文與中文必填');return}let u=db[r].find(x=>x.unit===name);if(!u){u={unit:name,words:[]};db[r].push(u)}let old=u.words.findIndex(x=>x[0].toLowerCase()===w.toLowerCase());let entry=[w,zh,mSentence.value.trim(),mSentenceZh.value.trim()];old>=0?u.words[old]=entry:u.words.push(entry);save();mWord.value=mMeaning.value=mSentence.value=mSentenceZh.value='';route=r;renderManager()}
function removeWord(r,i,j){if(confirm('確定刪除此單字？')){db[r][i].words.splice(j,1);save();renderManager()}}
function exportData(){let blob=new Blob([JSON.stringify({db,starred:[...starred],wrong:[...wrong]},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-english-lab-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x.db||!x.db.travel||!x.db.audit)throw Error();db=x.db;starred=new Set(x.starred||[]);wrong=new Set(x.wrong||[]);save();renderManager();alert('匯入完成。')}catch(err){alert('檔案格式不正確，未變更現有資料。')}};rd.readAsText(f);e.target.value=''}
function showStars(){showCollection('星號複習',[...starred])}function showWrong(){showCollection('錯題複習',[...wrong])}
function showCollection(title,keys){hideAll();report.classList.remove('hidden');reportTitle.textContent=title;let rows=[];for(let r of ['travel','audit'])db[r].forEach(u=>u.words.forEach(w=>{if(keys.includes(r+'|'+w[0].toLowerCase()))rows.push(`<div class="item"><div><strong>${esc(w[0])}</strong><div>${esc(w[1])}</div><small>${esc(w[2]||'')}</small></div><button class="secondary" onclick="say(${JSON.stringify(w[0])})">🔊</button></div>`)}));reportBody.innerHTML=rows.join('')||'<p class="muted">目前沒有項目。</p>'}
function showProgress(){hideAll();report.classList.remove('hidden');reportTitle.textContent='學習進度';let out=[];for(let r of ['travel','audit']){let count=db[r].reduce((a,u)=>a+u.words.length,0);out.push(`<div class="panel"><h3>${r==='travel'?'旅遊英文':'稽核與資安英文'}</h3><b>${count} 個單字</b><p class="muted">${db[r].length} 個單元｜星號 ${[...starred].filter(x=>x.startsWith(r+'|')).length}｜錯題 ${[...wrong].filter(x=>x.startsWith(r+'|')).length}</p></div>`)}reportBody.innerHTML=out.join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
goHome();
</script>
</body></html>
