<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Hero V1448 - 練習模式：複數判斷／下一題</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #020617; --card: rgba(30, 41, 59, 0.9); --accent: #38bdf8; --success: #4ade80; --danger: #f87171; --gold: #fbbf24; --exp: #eab308; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; background: #020617; color: #fff; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
        .container { width: 100%; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(circle at top, #0f172a, #020617); padding: 4px; }
        .view-section { display: none; flex-direction: column; flex: 1; padding: 4px; overflow-y: auto; }

        /* 字母框：1px 邊框, Montserrat 800, 置中 */
        .box-input-container { display:flex; gap:5px; justify-content:center; align-items:center; flex-wrap:wrap; margin:8px auto 12px; max-width:100%; }
        .letter-box { width:52px; height:72px; border:1px solid var(--accent) !important; border-radius:8px; background:rgba(0,0,0,.85); color:#fff; text-align:center; font-family:'Montserrat',sans-serif !important; font-size:2rem; font-weight:800 !important; line-height:72px; display:inline-block; -webkit-appearance:none; padding:0 !important; box-sizing:border-box; }
        .word-separator { width:10px; text-align:center; color:var(--accent); font-size:1.2rem; }
        @media screen and (max-width: 600px) { .letter-box { width: 35px; height: 60px; font-size: 1.6rem; line-height: 60px; } #display-cn { font-size: 2.5rem !important; } }
        .letter-box.wrong { border-color: var(--danger) !important; color: var(--danger); }

        /* HP 頂部貼齊 */
        #combat-arena { height: 160px; background: url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/environments/grass.png') center/cover; border-radius: 12px; position: relative; border: 1px solid #334155; margin-bottom: 5px; flex-shrink: 0; }
        .hp-container { position:absolute; top:8px; width:132px; height:22px; background:rgba(0,0,0,.82); border:1px solid rgba(255,255,255,.35); border-radius:11px; overflow:hidden; z-index:10; box-shadow:0 2px 6px rgba(0,0,0,.45); }
        .hp-bar { height:100%; width:100%; background:var(--success); transition:width .35s ease; }
        .hp-label { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:900; color:#fff; text-shadow:1px 1px 2px #000; z-index:2; pointer-events:none; }
        #player-hp-box { left:10px; } #opp-hp-box { right:10px; }

        /* EXP 條 */
        .exp-container { position: absolute; bottom: 5px; left: 10px; width: 120px; height: 14px; background: rgba(0,0,0,0.7); border: 1px solid var(--exp); border-radius: 7px; overflow: hidden; display: flex; align-items: center; }
        .exp-bar { height: 100%; width: 0%; background: var(--exp); transition: 0.5s ease-out; }
        .exp-text { position: absolute; width: 100%; text-align: center; font-size: 0.65rem; font-weight: 900; color: #fff; text-shadow: 1px 1px 1px #000; z-index: 2; }

        .sprite { position: absolute; bottom: 22px; width: 85px !important; height: 85px !important; object-fit: contain; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.5)); z-index: 5; }
        #player-sprite { left: 10px; transform: scaleX(-1); } #opp-sprite { right: 10px; }

        .damage-pop { position:absolute; z-index:30; font-size:2rem; font-weight:1000; color:#fff; text-shadow:0 2px 5px #000, 0 0 8px #f87171; pointer-events:none; animation:damageFloat .75s ease-out forwards; }
        .damage-player { left:22%; top:54px; }
        .damage-opp { right:22%; top:54px; }
        .damage-shake { animation:shakeHit .28s ease; }
        @keyframes damageFloat { 0%{opacity:0;transform:translateY(12px) scale(.6)} 25%{opacity:1;transform:translateY(0) scale(1.25)} 100%{opacity:0;transform:translateY(-38px) scale(1)} }
        @keyframes shakeHit { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 50%{transform:translateX(7px)} 75%{transform:translateX(-5px)} }
        .evo-overlay { position:fixed; inset:0; z-index:9999; display:none; align-items:center; justify-content:center; background:radial-gradient(circle,#fef3c7 0%,#fde68a 12%,rgba(2,6,23,.98) 58%); overflow:hidden; }
        .evo-overlay.show { display:flex; animation:evoFlash .55s ease; }
        .evo-card { width:min(92vw,420px); text-align:center; position:relative; }
        .evo-title { font-size:2.4rem; font-weight:1000; color:#fff; text-shadow:0 0 8px #fbbf24,0 0 22px #f59e0b; animation:evoTitle 1s infinite alternate; }
        .evo-sub { color:#fde68a; font-weight:900; font-size:1rem; margin:6px 0 12px; }
        .evo-img { width:190px; height:190px; object-fit:contain; filter:drop-shadow(0 0 18px #fff) drop-shadow(0 0 34px #fbbf24); animation:evoPulse .7s infinite alternate; }
        .evo-rays { position:absolute; left:50%; top:52%; width:360px; height:360px; transform:translate(-50%,-50%); border:5px solid rgba(255,255,255,.75); border-radius:50%; box-shadow:0 0 30px #fff,0 0 70px #fbbf24, inset 0 0 50px #fff; animation:evoRing 1s linear infinite; }
        @keyframes evoFlash { 0%{filter:brightness(4)} 100%{filter:brightness(1)} }
        @keyframes evoTitle { from{transform:scale(1)} to{transform:scale(1.08)} }
        @keyframes evoPulse { from{transform:scale(.88) rotate(-2deg)} to{transform:scale(1.12) rotate(2deg)} }
        @keyframes evoRing { from{transform:translate(-50%,-50%) rotate(0) scale(.7);opacity:.95} to{transform:translate(-50%,-50%) rotate(360deg) scale(1.2);opacity:0} }

        /* 按鈕一致性風格 */
        .game-action-btn { width: 220px; padding: 12px; border-radius: 12px; border: 1px solid #475569; background: rgba(255,255,255,0.08); color: white; font-size: 1.1rem; font-weight: 800; cursor: pointer; margin: 4px auto; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .game-action-btn:active { transform: scale(0.97); }
        #btn-force-practice { border-color: var(--accent); background: rgba(56, 189, 248, 0.15); display: none; }

        /* 圖鑑網格 4格排列 */
        .grid-view { display: grid !important; grid-template-columns: repeat(4, 1fr) !important; gap: 6px; padding: 4px; }
        .grid-item { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 8px 2px; text-align: center; border: 1px solid transparent; min-height: 155px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .grid-item img { width: 85px !important; height: 85px !important; object-fit: contain !important; }
        .grid-item.locked img { filter: grayscale(100%) brightness(.72) !important; opacity:.48; }
        .grid-item.active { border-color: var(--accent); background: rgba(56, 189, 248, 0.15); }

        #display-cn { font-size: 3.2rem; font-weight: 800; color: var(--gold); text-shadow: 2px 2px 4px rgba(0,0,0,0.8); vertical-align: middle; }

        /* 練習模式：英文單字依音節分色，並放大字體 */
        #practice-guide {
            display:flex;
            justify-content:center;
            align-items:center;
            flex-wrap:wrap;
            gap:0;
            min-height:52px !important;
            height:auto !important;
            margin:4px 0 8px;
            font-size:2.35rem !important;
            line-height:1.15;
            font-weight:1000 !important;
            letter-spacing:.02em;
            text-shadow:2px 2px 5px rgba(0,0,0,.75);
        }
        .practice-syllable { display:inline-block; font-weight:1000; }
        .practice-syllable.color-1 { color:#38bdf8; }
        .practice-syllable.color-2 { color:#fbbf24; }
        .practice-syllable.color-3 { color:#4ade80; }
        .practice-syllable.color-4 { color:#f472b6; }
        .practice-syllable.color-5 { color:#a78bfa; }
        .practice-syllable.color-6 { color:#fb923c; }
        .practice-syllable-separator { color:#94a3b8; font-weight:800; margin:0 .08em; }
        .practice-phonics-note { display:block; width:100%; text-align:center; color:#cbd5e1; font-size:.78rem; font-weight:800; margin:3px 0 2px; }
        .practice-phonics-row { display:flex; width:100%; justify-content:center; align-items:center; flex-wrap:wrap; gap:5px; margin-top:2px; }
        .practice-phonics-item { display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border-radius:8px; background:rgba(15,23,42,.78); border:1px solid #475569; font-size:.78rem; font-weight:900; color:#f8fafc; cursor:pointer; user-select:none; transition:transform .08s, background .12s, border-color .12s; }
        .practice-phonics-item:hover { background:rgba(56,189,248,.14); border-color:#38bdf8; }
        .practice-phonics-item:active { transform:scale(.96); }
        .practice-phonics-item.is-playing { border-color:#fbbf24; background:rgba(251,191,36,.12); }
        .practice-phonics-speaker { color:#38bdf8; font-size:.72rem; margin-left:1px; }
        .practice-phonics-letter { color:#94a3b8; }
        .practice-phonics-arrow { color:#64748b; }
        .practice-phonics-sound { color:#f8fafc; }
        .practice-silent { color:#f87171; text-decoration:line-through; }
        .practice-rule { width:100%; text-align:center; color:#fbbf24; font-size:.7rem; font-weight:800; margin-top:2px; }
        .practice-syllable { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
        @media screen and (max-width: 600px) {
            #practice-guide { font-size:2.05rem !important; }
        }



        /* 舊版每題造句區：V1445 改為獨立造句單元，保留 DOM 僅供舊資料相容 */
        .sentence-inline { display:none !important; width:min(96%,520px); margin:8px auto 10px; padding:10px; border:1px solid #475569; border-radius:12px; background:rgba(15,23,42,.9); }
        .sentence-inline-title { text-align:center; color:#fbbf24; font-weight:1000; font-size:.95rem; margin-bottom:3px; }
        .sentence-inline-word { text-align:center; color:#38bdf8; font-size:1.15rem; font-weight:1000; margin-bottom:6px; }
        #sentence-inline-input { width:100%; min-height:72px; resize:vertical; padding:9px; border-radius:9px; border:1px solid #475569; background:#020617; color:#fff; font-size:1rem; line-height:1.45; font-family:inherit; }
        #sentence-inline-input:focus { border-color:#38bdf8; box-shadow:0 0 0 2px rgba(56,189,248,.15); }
        .sentence-inline-actions { display:grid; grid-template-columns:1fr 100px; gap:7px; margin-top:7px; }
        .pass-btn-inline { background:#475569; color:#fff; border:0; border-radius:10px; font-weight:1000; font-size:1rem; cursor:pointer; }
        .pass-btn-inline:active { transform:scale(.97); }

        /* V1448：練習模式子單元 */
        .practice-unit-title { text-align:center; color:#f8fafc; font-size:1.35rem; font-weight:1000; margin:8px 0 4px; }
        .practice-unit-subtitle { text-align:center; color:#94a3b8; font-size:.85rem; line-height:1.5; margin-bottom:12px; }
        .practice-unit-grid { display:grid; grid-template-columns:1fr; gap:10px; margin:auto 0; }
        .practice-unit-btn { min-height:78px; border:0; border-radius:16px; color:#fff; font-weight:1000; font-size:1.15rem; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.2); }
        .practice-unit-btn small { display:block; margin-top:4px; font-size:.72rem; opacity:.82; font-weight:700; }
        .practice-word-btn { background:#3b82f6; }
        .practice-sentence-btn { background:linear-gradient(135deg,#7c3aed,#a855f7); }
        .sentence-unit-card { width:min(96%,560px); margin:auto; padding:14px; border:1px solid #475569; border-radius:16px; background:rgba(15,23,42,.92); }
        .sentence-unit-cn { text-align:center; color:#fbbf24; font-size:1.2rem; font-weight:1000; min-height:30px; }
        .sentence-unit-word { text-align:center; color:#38bdf8; font-size:2.1rem; font-weight:1000; margin:4px 0 10px; }
        #sentence-unit-input { width:100%; min-height:105px; resize:vertical; padding:11px; border-radius:10px; border:1px solid #475569; background:#020617; color:#fff; font-size:1.05rem; line-height:1.5; font-family:inherit; box-sizing:border-box; }
        #sentence-unit-input:focus { border-color:#38bdf8; box-shadow:0 0 0 2px rgba(56,189,248,.15); outline:none; }
        .sentence-unit-actions { display:grid; grid-template-columns:1fr 100px; gap:7px; margin-top:8px; }
        .sentence-unit-pass { background:#475569; color:#fff; border:0; border-radius:10px; font-weight:1000; font-size:1rem; cursor:pointer; }
        .sentence-unit-progress { text-align:center; color:#94a3b8; font-size:.78rem; margin-top:8px; }
        /* V1448：文法說明後固定提供下一題 */
        .sentence-next-btn {
            display:none;
            width:100%;
            margin-top:9px;
            padding:11px;
            border:0;
            border-radius:10px;
            background:#0ea5e9;
            color:#fff;
            font-weight:1000;
            font-size:1.05rem;
            cursor:pointer;
        }
        .sentence-next-btn:active { transform:scale(.98); }
        .sentence-unit-back { margin-top:10px; background:#334155; }

        /* 造句功能 */
        .sentence-btn {
            border-color:#a78bfa !important;
            background:rgba(124,58,237,.16) !important;
        }
        .sentence-overlay {
            position:fixed;
            inset:0;
            z-index:10000;
            display:none;
            align-items:center;
            justify-content:center;
            padding:14px;
            background:rgba(2,6,23,.88);
            backdrop-filter:blur(5px);
        }
        .sentence-overlay.show { display:flex; }
        .sentence-card {
            width:min(96vw,520px);
            max-height:92vh;
            overflow:auto;
            background:#0f172a;
            border:1px solid #475569;
            border-radius:16px;
            padding:16px;
            box-shadow:0 18px 60px rgba(0,0,0,.55);
        }
        .sentence-title {
            text-align:center;
            font-size:1.35rem;
            font-weight:1000;
            color:#fbbf24;
            margin-bottom:5px;
        }
        .sentence-word {
            text-align:center;
            font-size:2rem;
            font-weight:1000;
            color:#38bdf8;
            margin-bottom:8px;
        }
        .sentence-help {
            text-align:center;
            color:#94a3b8;
            font-size:.82rem;
            line-height:1.5;
            margin-bottom:10px;
        }
        #sentence-input {
            width:100%;
            min-height:115px;
            resize:vertical;
            box-sizing:border-box;
            padding:12px;
            border-radius:11px;
            border:1px solid #475569;
            background:#020617;
            color:#fff;
            font-size:1.08rem;
            line-height:1.6;
            font-family:inherit;
        }
        #sentence-input:focus { border-color:#38bdf8; box-shadow:0 0 0 2px rgba(56,189,248,.15); }
        .sentence-actions {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:7px;
            margin-top:9px;
        }
        .sentence-check-btn {
            padding:11px;
            border:0;
            border-radius:10px;
            background:#7c3aed;
            color:#fff;
            font-weight:900;
            font-size:1rem;
            cursor:pointer;
        }
        .sentence-close-btn {
            padding:11px;
            border:1px solid #475569;
            border-radius:10px;
            background:#1e293b;
            color:#e2e8f0;
            font-weight:900;
            font-size:1rem;
            cursor:pointer;
        }
        .sentence-status {
            margin-top:10px;
            padding:10px;
            border-radius:10px;
            background:#020617;
            border:1px solid #334155;
            color:#cbd5e1;
            font-size:.9rem;
            line-height:1.6;
        }
        .sentence-status.good { border-color:#22c55e; background:rgba(34,197,94,.09); color:#dcfce7; }
        .sentence-status.warn { border-color:#f59e0b; background:rgba(245,158,11,.08); color:#fef3c7; }
        .sentence-status.error { border-color:#ef4444; background:rgba(239,68,68,.08); color:#fecaca; }
        .sentence-correction {
            margin-top:8px;
            padding:9px;
            border-radius:9px;
            background:rgba(56,189,248,.08);
            border:1px solid rgba(56,189,248,.35);
        }
        .sentence-example {
            margin-top:8px;
            color:#a5b4fc;
        }
        .sentence-loading { color:#fbbf24; }
        .sentence-choice {
            display:none; width:min(92%, 520px); margin:6px auto 4px; padding:10px 12px;
            border:1px solid #475569; border-radius:10px; background:rgba(30,41,59,.72);
            color:#e2e8f0; text-align:center; font-size:.88rem; font-weight:800;
        }
        .sentence-choice.show { display:block; }
        .sentence-choice-title { margin-bottom:7px; }
        .sentence-choice-buttons { display:flex; justify-content:center; gap:8px; }
        .sentence-choice-btn {
            border:1px solid #475569; border-radius:8px; padding:7px 18px;
            background:#0f172a; color:#e2e8f0; font-weight:900; cursor:pointer;
        }
        .sentence-choice-btn.yes:hover, .sentence-choice-btn.yes.active { border-color:#22c55e; background:rgba(34,197,94,.14); }
        .sentence-choice-btn.no:hover, .sentence-choice-btn.no.active { border-color:#f59e0b; background:rgba(245,158,11,.14); }

        .pass-btn { background: #475569; color: white; padding: 5px 12px; border-radius: 8px; font-size: 0.9rem; font-weight: 800; cursor: pointer; border: none; margin-left: 10px; vertical-align: middle; }
        .mode-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 800; font-size: 1.2rem; color: white; margin-bottom: 8px; cursor: pointer; }


        /* 後台管理 UI：低干擾、灰色、小尺寸 */
        /* V1450：8歲兒童首頁 UI/UX */
        .home-header { text-align:center; margin:5px 0 10px; }
        .home-title { color:var(--accent); font-size:1.55rem; font-weight:1000; letter-spacing:1px; }
        .home-user { color:#94a3b8; font-size:.78rem; margin-top:2px; }
        .unit-card { background:rgba(30,41,59,.75); border:1px solid #475569; border-radius:14px; padding:9px 10px; margin-bottom:10px; }
        .unit-label { color:#cbd5e1; font-size:.8rem; font-weight:900; margin-bottom:4px; }
        #unit-selector { width:100%; padding:10px 12px; border-radius:10px; background:#0f172a; color:var(--gold); border:1px solid #475569; font-weight:900; font-size:1.05rem; }
        .home-main-actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
        .home-action { min-height:105px; border:0; border-radius:16px; color:#fff; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(0,0,0,.22); font-weight:1000; font-size:1.12rem; }
        .home-action small { font-size:.68rem; font-weight:700; opacity:.88; margin-top:4px; }
        .home-action-icon { font-size:2rem; line-height:1; margin-bottom:4px; }
        .home-action.challenge { background:linear-gradient(135deg,#ef4444,#f59e0b); }
        .home-action.practice { background:#2563eb; }
        .home-action.sentence { background:linear-gradient(135deg,#7c3aed,#a855f7); }
        .home-action.star { background:#d99b00; color:#111827; }
        .home-adventure-title { color:#94a3b8; font-size:.78rem; font-weight:900; text-align:center; margin:13px 0 6px; }
        .home-secondary-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .home-secondary-actions button { min-height:52px; border:1px solid #475569; border-radius:12px; background:#1e293b; color:#fff; font-size:1rem; font-weight:900; cursor:pointer; }
        .home-secondary-actions button span { margin-left:5px; }
        .more-toggle { width:100%; margin-top:10px; padding:9px; border:1px solid #334155; border-radius:10px; background:transparent; color:#94a3b8; font-weight:800; cursor:pointer; }
        .more-tools { grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; padding:5px 0; }
        @media screen and (max-width:600px) { .home-action { min-height:96px; } .home-action-icon { font-size:1.75rem; } }

        .admin-btn {
            width:auto !important;
            min-width:0;
            padding:7px 10px !important;
            margin:0 !important;
            border-radius:8px !important;
            background:#475569 !important;
            color:#e2e8f0 !important;
            font-size:.78rem !important;
            font-weight:700 !important;
            line-height:1.2;
        }
        .admin-btn:hover { background:#64748b !important; }
        .admin-toolbar {
            display:flex;
            flex-wrap:wrap;
            gap:6px;
            align-items:center;
            margin:6px 0;
        }
        .bank-source-panel {
            background:rgba(30,41,59,.75);
            border:1px solid #475569;
            border-radius:10px;
            padding:9px;
            margin-bottom:8px;
        }
        .bank-source-title { font-size:.9rem; font-weight:900; color:#e2e8f0; margin-bottom:7px; }
        .bank-source-buttons { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
        .bank-source-btn { border:1px solid #475569; border-radius:9px; padding:9px 7px; background:#0f172a; color:#cbd5e1; font-weight:800; cursor:pointer; }
        .bank-source-btn.active { border-color:#38bdf8; background:rgba(56,189,248,.14); color:#fff; }
        .bank-source-note { margin-top:7px; color:#94a3b8; font-size:.76rem; line-height:1.5; }
        #txt-file-input { display:none; }

        .admin-panel {
            background:#111827;
            border:1px solid #334155;
            border-radius:10px;
            padding:9px;
            margin-bottom:8px;
        }
        .admin-title {
            font-size:1rem;
            font-weight:800;
            color:#cbd5e1;
            margin:4px 0 8px;
        }
        .admin-subtitle {
            font-size:.72rem;

        try { return JSON.parse(localStorage.getItem(scopedKey(key)) || JSON.stringify(fallback)); }
        catch (e) { return fallback; }

    function setLocalJSON(key, value) { localStorage.setItem(scopedKey(key), JSON.stringify(value)); }

    function migrateLegacyUserData() {
        if (!currentUserKey) return;
        const keys = ['hero_pokedex_bits','hero_myPoke','hero_priority','hero_error_log','hero_custom_units','hero_custom_questions','hero_question_edits','hero_deleted_question_refs','hero_question_bank'];
        keys.forEach(key => {
            const target = scopedKey(key);
            if (localStorage.getItem(target) !== null) return;
            const legacy = localStorage.getItem(key);
            if (legacy !== null) localStorage.setItem(target, legacy);
        });
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('exp_id_')) {
                const target = scopedKey(key);
                if (localStorage.getItem(target) === null) localStorage.setItem(target, localStorage.getItem(key));
            }
        }
    }

    function safeFileName(name) {
        return String(name || 'WordHero')
            .trim()
            .replace(/[\\/:*?"<>|]/g, '_')
            .replace(/\s+/g, '_') || 'WordHero';

    function ensureChildName() {
        let name = getChildName();
        if (!name) {

                name = prompt('第一次使用 Word Hero，請輸入小朋友的名字：');
                if (name === null) name = '';

        isAnsonUser = name.trim().toLowerCase() === ANSON_USER;

        migrateLegacyUserData();
        return name;

            .sort((a, b) => b[1] - a[1])

${common}

【錯題紀錄】
日期 時間 | 單元 | 正確單字 | 輸入錯誤
${detail}
`;

    function handleTxtFile(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const parsed = parseAnsonTxt(String(reader.result || ''));
                if (!Object.keys(parsed).length || !Object.values(parsed).some(arr => arr.length)) {
                    alert('TXT 裡沒有讀到單字。\n\n格式請使用：\n[W1]\ndinosaur,恐龍\nmillion,百萬');
                    return;
                }
                setLocalJSON('hero_text_bank', parsed);
                state.banks = cloneBanks(parsed);
                bankSourceMode = 'text';
                setHeroData('hero_bank_source_mode', bankSourceMode);
                refreshUnitSelectors();
                updateBankSourceUI();
                renderBankManager();
                alert(`📄 已載入「${file.name}」文字題庫。\n\n這個 TXT 會保存在「${getChildName()}」的本機資料，不會影響其他使用者。`);
            } catch (e) {
                alert('TXT 讀取失敗，請確認檔案格式。');
            }
        };
        reader.readAsText(file, 'UTF-8');
    }

    function applyLocalQuestionChanges() {
        const units = getLocalJSON('hero_custom_units', []);
        const custom = getLocalJSON('hero_custom_questions', []);
        const edits = getLocalJSON('hero_question_edits', {});
        const deleted = new Set(getLocalJSON('hero_deleted_question_refs', []));
        const nextBanks = {};

        units.forEach(u => { nextBanks[u] = nextBanks[u] || []; });

        Object.keys(state.banks).forEach(sourceUnit => {
            (state.banks[sourceUnit] || []).forEach(w => {
                if (deleted.has(w.ref)) return;
                const merged = edits[w.ref] ? {...w, ...edits[w.ref]} : {...w};
                const targetUnit = String(merged.unit || sourceUnit).trim() || sourceUnit;
                delete merged.unit;
                if (!nextBanks[targetUnit]) nextBanks[targetUnit] = [];
                if (!nextBanks[targetUnit].some(x => x.ref === merged.ref)) nextBanks[targetUnit].push(merged);
            });
        });

        custom.forEach(w => {
            if (deleted.has(w.ref)) return;
            const targetUnit = String(w.unit || 'W1').trim();
            if (!nextBanks[targetUnit]) nextBanks[targetUnit] = [];
            if (!nextBanks[targetUnit].some(x => x.ref === w.ref)) {
                nextBanks[targetUnit].push({en:w.en, cn:w.cn || '', ref:w.ref});
            }
        });

        state.banks = nextBanks;
    }

    let bulkValidatedWords = [];

    function updateBulkSubmitState() {
        const btn = document.getElementById('bulk-submit');
        const cb = document.getElementById('bulk-confirm');
        const ok = bulkValidationPassed && cb && cb.checked && bulkValidatedWords.length > 0;

    async function validateBulkWords() {
        if (bankSourceMode !== 'custom') { alert('目前是文字題庫模式。請先切換「自行變更題庫」，才能修改題庫。'); return; }
        const box = document.getElementById('bulk-words');
        const result = document.getElementById('bulk-check-result');
        const wrap = document.getElementById('bulk-confirm-wrap');
        const cb = document.getElementById('bulk-confirm');

        bulkValidatedWords = [];
        bulkValidationPassed = false;
        if (cb) cb.checked = false;
        if (wrap) wrap.style.display = 'none';
        updateBulkSubmitState();

        const words = (box?.value || '').split(/\r?\n/).map(w => w.trim()).filter(Boolean);
        if (!words.length) {
            if (result) {
                result.style.display = 'block';
                result.innerHTML = '<span style="color:#f87171;">請先貼上單字，一行一個。</span>';
            }
            return;
        }

        const invalidFormat = words.filter(w => !/^[A-Za-z][A-Za-z' -]*$/.test(w));
        const normalized = words.map(w => w.toLowerCase());
        const duplicates = normalized.filter((w, i) => normalized.indexOf(w) !== i);
        if (invalidFormat.length) {
            result.style.display = 'block';
            result.innerHTML = '<span style="color:#f87171;font-weight:800;">格式有問題，請修正：</span><br>' + invalidFormat.map(escapeHtml).join('<br>');
            return;
        }

        result.style.display = 'block';
        result.innerHTML = '<span style="color:#fbbf24;">正在查字典確認拼字，請稍候……</span>';

        const unique = [...new Map(words.map(w => [w.toLowerCase(), w])).values()];
        const checks = await Promise.all(unique.map(async word => {
            const parts = word.split(/[\s-]+/).filter(Boolean);
            const results = await Promise.all(parts.map(async part => {
                try {
                    const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(part)}`, { cache: 'no-store' });
                    return r.ok;
                } catch (e) {
                    return false;
                }
            }));
            return { word, ok: results.every(Boolean) };
        }));

        const bad = checks.filter(x => !x.ok).map(x => x.word);
        if (bad.length) {
            result.innerHTML = '<span style="color:#f87171;font-weight:900;">❌ 發現可能的拼字問題，不能送出：</span><br>' + bad.map(w => `• ${escapeHtml(w)}`).join('<br>') + '<br><span style="color:#94a3b8;">請修正後再按「檢查單字」。</span>';
            return;
        }

        const unit = document.getElementById('bank-manage-unit')?.value?.trim();
        const existing = new Set((state.banks[unit] || []).map(w => w.en.trim().toLowerCase()));
        const newWords = unique.filter(w => !existing.has(w.toLowerCase()));
        const repeated = unique.filter(w => existing.has(w.toLowerCase()));
        bulkValidatedWords = newWords;
        bulkValidationPassed = true;

        result.innerHTML = '<span style="color:#4ade80;font-weight:900;">✅ 拼字檢查完成</span><br>' + `共 ${unique.length} 個單字；新單字 ${newWords.length} 個` + (repeated.length ? `；已存在 ${repeated.length} 個，送出時會跳過。` : '。');
        if (duplicates.length) result.innerHTML += `<br><span style="color:#94a3b8;">重複輸入 ${duplicates.length} 個，已自動合併。</span>`;
        if (wrap) wrap.style.display = 'flex';
        updateBulkSubmitState();
    }

    function addBulkWords() {
        const unit = document.getElementById('bank-manage-unit')?.value?.trim();
        if (!unit || !state.banks[unit]) return alert('請先選擇要加入的單元。');
        if (!bulkValidationPassed || !bulkValidatedWords.length) return alert('請先按「檢查單字」，確認拼字正確後才能送出。');

        const words = [...bulkValidatedWords];
        words.forEach(en => {
            state.banks[unit].push({
                en,
                cn: '',
                ref: `LOCAL_BULK_${Date.now()}_${Math.random().toString(36).slice(2,8)}`
            });
        });

        const custom = getLocalJSON('hero_custom_questions', []);
        words.forEach(en => {
            const ref = state.banks[unit][state.banks[unit].length - words.length + words.indexOf(en)].ref;
            custom.push({unit, en, cn:'', ref});
        });
        setLocalJSON('hero_custom_questions', custom);
        saveUserQuestionBank();
        clearBulkInput();
        renderBankManager();
        alert(`✅ 已加入 ${unit} 本機題庫 ${words.length} 個單字。\n\n這些單字只會存在「${getChildName()}」的題庫。`);
    }

    function openQuestionEditor(encodedRef='') {
        editingQuestionRef = encodedRef ? decodeURIComponent(encodedRef) : null;
        refreshUnitSelectors();
        const unitEl=document.getElementById('question-unit'), enEl=document.getElementById('question-en'), cnEl=document.getElementById('question-cn'), title=document.getElementById('question-editor-title');
        const units=Object.keys(state.banks).sort(); if (!units.length) return alert('請先建立單元。');
        unitEl.innerHTML=units.map(u=>`<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`).join('');
        if (editingQuestionRef) {
            let found=null, foundUnit=null;
            Object.keys(state.banks).some(u => { const w=state.banks[u].find(x=>x.ref===editingQuestionRef); if(w){found=w;foundUnit=u;return true;} return false; });
            if(!found) return alert('找不到這筆題目。');
            title.innerText='✏️ 編輯題目'; unitEl.value=foundUnit; enEl.value=found.en; cnEl.value=found.cn||'';
        } else {
            title.innerText='＋新增題目'; enEl.value=''; cnEl.value='';
            const current=document.getElementById('bank-manage-unit')?.value; if(current && state.banks[current]) unitEl.value=current;
        }
        switchView('view-question-editor'); setTimeout(()=>enEl.focus(),100);

    function parseAnsonTxt(text) {
        const banks = {};
        let currentUnit = '';
        let serial = 0;
        const lines = String(text || '').split(/\r?\n/);

        lines.forEach(raw => {
            const line = raw.trim();
            if (!line || line.startsWith('#') || line.startsWith('//')) return;

            const heading = line.match(/^\[?\s*(W\d+|Unit\s*\d+)\s*\]?$/i);
            if (heading) {
                currentUnit = heading[1].replace(/\s+/g,'').toUpperCase().replace(/^UNIT/,'W');
                if (!banks[currentUnit]) banks[currentUnit] = [];
                return;
            }

            if (!currentUnit) currentUnit = 'W1';
            const parts = line.includes('\t') ? line.split('\t') : line.split(/\s*,\s*/);
            const en = (parts.shift() || '').trim();
            const cn = parts.join(',').trim();
            if (!en) return;
            serial++;
            banks[currentUnit].push({
                en,
                cn,
                ref: `TXT_ANSON_${currentUnit}_${serial}`
            });
        });
        return banks;
    }

    function mergeFixedBanks(base) {
        // TXT 是 Anson 的真正題庫來源；只補上 TXT 沒有的 W1-W4，不覆蓋 TXT 已修改的內容。
        const result = cloneBanks(base || {});
        const fixed = banksFromPairs(getFixedBanks());
        Object.keys(fixed).forEach(unit => {
            if (!Array.isArray(result[unit]) || !result[unit].length) result[unit] = fixed[unit];
        });
        return result;
    }

    async function loadAnsonTxtQuestionBank() {
        // Anson 的「📄 文字題庫」以 Anson.txt 為唯一來源。
        // 成功讀取 TXT 後，直接使用 TXT 內容，不再混入舊 localStorage。
        try {
            const response = await fetch(`${ANSON_TXT_URL}?t=${Date.now()}`, {cache:'no-store'});
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const text = await response.text();
            const parsed = parseAnsonTxt(text);
            if (!Object.keys(parsed).length || !Object.values(parsed).some(arr => arr.length)) {
                throw new Error('Anson.txt 沒有讀到任何題目');
            }

            // TXT 讀到什麼就使用什麼；只補 TXT 完全沒有的 W1-W4。
            state.banks = normalizeLegacyEarthInBanks(mergeFixedBanks(parsed));

            // 更新快取，避免舊版的 eart 殘留。
            setLocalJSON('hero_anson_txt_cache', state.banks);
            return true;
        } catch (e) {
            // 不再優先使用可能含有舊「eart」的快取。
            // 離線／TXT 無法讀取時，至少使用目前程式內建的正確 W1-W4（Earth）。
            state.banks = banksFromPairs(getFixedBanks());
            console.warn('Anson.txt 無法讀取，改用目前內建 W1-W4：', e);
            return false;
        }
    }

    function removeLegacyEartFromAnsonTextCache() {
        const cached = getLocalJSON('hero_anson_txt_cache', null);

        Object.keys(cached).forEach(unit => {
            if (!Array.isArray(cached[unit])) return;
            const next = cached[unit].filter(item => String(item?.en || '').trim().toLowerCase() !== 'eart');
            if (next.length !== cached[unit].length) { cached[unit] = next; changed = true; }
        });
        if (changed) setLocalJSON('hero_anson_txt_cache', cached);
    }

    // 舊版本曾把 Earth 存成 eart；啟動時自動修正舊本機資料，避免畫面只產生 4 個字框。
    function normalizeLegacyEarthInBanks(banks) {
        const result = cloneBanks(banks || {});
        Object.keys(result).forEach(unit => {
            if (!Array.isArray(result[unit])) return;
            result[unit] = result[unit].map(w => {
                if (!w) return w;
                const en = String(w.en || '').trim();
                if (en.toLowerCase() === 'eart') return { ...w, en: 'Earth' };
                return w;
            });
        });
        return result;
    }

    function getEvoInfo(id) {
        const baseId = getEvolutionBaseId(id);
        const exp = parseInt(getHeroData(`exp_id_${baseId}`)) || 0;
        let lv = 1, progress = exp, target = 20;

        if (exp >= 50) {
            lv = 3;
            progress = 50;
            target = 50;
        } else if (exp >= 20) {
            lv = 2;
            progress = exp - 20;
            target = 30;
        }

        let curId = baseId;
        if (baseId === 384 && lv === 3) {
            curId = 10079;
        } else if (baseId === 150 && lv === 3) {
            curId = 10044;
        } else {
            const chain = CHAINS.find(c => c[0] === baseId);
            if (chain) curId = chain[lv - 1] || chain[chain.length - 1];
        }

        return { baseId, displayId: curId, lv, exp, progress, target };
    }

    function setPokeImageFallback(img, id) {
        if (!img) return;
        const candidates = getPokeImageCandidates(id);
        let next = 0;
        const tryNext = () => {
            if (next >= candidates.length) {
                img.onerror = null;
                img.style.visibility = 'hidden';
                return;
            }
            const url = candidates[next++];
            if (img.src === url) {
                tryNext();
                return;
            }
            img.onerror = tryNext;
            img.src = url;
        };
        img.onerror = tryNext;
    }

    async function runSentenceGrammarCheck(input, result) {
        const sentence = String(input.value || '').trim();
        result.style.display = 'block';
        result.className = 'sentence-status sentence-loading';
        result.innerHTML = '⏳ 正在檢查文法與拼字……';

        const localIssues = localSentenceChecks(sentence, sentenceTargetWord);
        if (!sentence) {
            result.className = 'sentence-status error';
            result.innerHTML = '❌ 請先寫一句英文句子。';
            return;
        }
        let matches = [];
        let apiOK = false;
        try {
            const body = new URLSearchParams();
            body.set('text', sentence);
            body.set('language', 'en-US');
            body.set('enabledOnly', 'false');
            const response = await fetch('https://api.languagetool.org/v2/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body.toString()
            });
            if (response.ok) {
                const data = await response.json();
                matches = Array.isArray(data.matches) ? data.matches : [];
                apiOK = true;
            }
        } catch (e) { apiOK = false; }

        const targetMissing = localIssues.some(x => x.includes('還沒有使用目標單字'));
        const simpleIssues = localIssues.filter(x => !x.includes('還沒有使用目標單字'));
        if (apiOK) {
            const usefulMatches = matches.filter(m => m && m.message && m.rule);
            if (!targetMissing && usefulMatches.length === 0 && simpleIssues.length === 0) {
                result.className = 'sentence-status good';
                result.innerHTML = '✅ <b>目前沒有找到明顯的文法或拼字問題！</b><div class="sentence-example">很好，繼續保持。</div>';
                showSentenceNextButton();
                return;
            }
            let html = '';
            if (targetMissing) html += `<div>⚠️ ${escapeSentenceHtml(`句子裡還沒有使用目標單字「${sentenceTargetWord}」。`)}</div>`;
            if (usefulMatches.length) html += '<div style="margin-top:5px;">' + usefulMatches.slice(0,5).map((m,i) => `${i+1}. ${formatLanguageToolMessage(m)}`).join('<div style="margin-top:7px;"></div>') + '</div>';
            if (simpleIssues.length) html += `<div style="margin-top:7px;">${simpleIssues.map(x => `• ${escapeSentenceHtml(x)}`).join('<br>')}</div>`;
            result.className = 'sentence-status warn';
            result.innerHTML = html || '⚠️ 有一些地方建議再檢查。';
            showSentenceNextButton();
            return;
        }
        result.className = 'sentence-status warn';
        result.innerHTML = (!targetMissing && simpleIssues.length === 0)
            ? '⚠️ 線上文法服務目前無法連線。<br>基本檢查沒有發現明顯問題，但這不代表文法已完整確認。'
            : (targetMissing ? `⚠️ 句子裡還沒有使用目標單字「${escapeSentenceHtml(sentenceTargetWord)}」。<br>` : '') + (simpleIssues.length ? simpleIssues.map(x => `• ${escapeSentenceHtml(x)}`).join('<br>') : '');
        showSentenceNextButton();
    }

        area.innerHTML = "";

        const answerChars = Array.from(String(word.en || ""));
        let inputIdx = 0;

        answerChars.forEach((char) => {
            if (char === " " || char === "/" || char === "-") {
                const sep = document.createElement('div');
                sep.className = 'word-separator';
                sep.innerText = char === " " ? " " : char;
                area.appendChild(sep);
                return;
            }

            const inp = document.createElement('input');
            inp.type = 'text';
            inp.inputMode = 'text';
            inp.autocomplete = 'off';
            inp.className = 'letter-box';
            inp.maxLength = 1;
            inp.dataset.idx = inputIdx;
            inp.spellcheck = false;

            inp.onkeydown = (e) => {
                const idx = parseInt(e.target.dataset.idx, 10);

                if (e.key === "Backspace") {
                    // 目前這格有字：先清掉目前這格，再停留。
                    if (e.target.value !== "") {
                        e.preventDefault();
                        e.target.value = "";
                        return;
                    }

                    // 目前這格已經是空的：回上一格，並清掉上一格。
                    e.preventDefault();
                    const prev = document.querySelector(
                        `.letter-box[data-idx="${idx - 1}"]`
                    );

                    if (prev) {
                        prev.focus();
                        prev.value = "";
                    }
                }
            };

            inp.oninput = (e) => {
                // 一格只允許一個字母；輸入後自動跳到下一格
                const chars = Array.from(String(e.target.value || ""));
                e.target.value = chars.length ? chars[chars.length - 1] : "";

                if (e.target.value.length === 1) {
                    const next = document.querySelector(
                        `.letter-box[data-idx="${parseInt(e.target.dataset.idx, 10) + 1}"]`
                    );

                    if (next) {
                        next.focus();
                        next.select();
                    } else {
                        // 最後一格輸入完成後自動送出答案
                        const boxes = [...document.querySelectorAll('.letter-box')];
                        if (boxes.length && boxes.every(b => b.value.length === 1)) {
                            setTimeout(checkFinalAnswer, 150);
                        }
                    }
                }
            };

            area.appendChild(inp);
            inputIdx++;
        });

        // 顯示目前題目的實際字母數，避免字框數與答案不一致。
        area.dataset.answerLength = String(inputIdx);
        renderPracticeGuide((state.mode === 'practice' || state.tempPractice) ? word.en : "");
        setTimeout(() => { const f = document.querySelector('.letter-box'); if(f) f.focus(); }, 450); playVoice();
    }

    function checkFinalAnswer() {
        const word = state.currentList[state.index];
        if (!word) return;

        const boxes = document.querySelectorAll('.letter-box');
        let ui = "";
        boxes.forEach(b => ui += b.value);

        const normalizedInput = ui.replace(/[\s\/-]/g, '').toLowerCase();
        const normalizedAnswer = word.en.replace(/[\s\/-]/g, '').toLowerCase();

        if (normalizedInput === normalizedAnswer) {
            confetti({ particleCount: 30, spread: 50 });

            if (state.mode === 'quiz' && !state.tempPractice) {
                state.oppHP--;
                showDamage('opp',1);

                const baseId = getEvolutionBaseId(state.activePokeId);
                const beforeEvo = getEvoInfo(state.activePokeId);
                const expK = `exp_id_${baseId}`;
                let cur = Math.min((parseInt(getHeroData(expK)) || 0) + 1, 50);
                setHeroData(expK, cur);
                const afterEvo = getEvoInfo(state.activePokeId);
                const evolutionDelay = showEvolution(beforeEvo.displayId, afterEvo.displayId);

                // 魔王挑戰：這個單字答對後就從本輪題目移除。
                // 因此必須把該 W 的全部單字答對，才會真正通關。
                state.currentList.splice(state.index, 1);
                state.quizCompleted++;

                // 下一題仍然使用 index=0。
                state.index = 0;

                // 擊敗一隻寶可夢後，繼續考剩下的單字，而不是直接結束整個 W。
                if (state.oppHP <= 0) {
                    let p = state.pokedex.split('');
                    p[state.currentOppId - 1] = "1";
                    state.pokedex = p.join('');
                    setHeroData('hero_pokedex_bits', state.pokedex);
                    confetti({ particleCount: 100, spread: 80 });

                    if (state.currentList.length === 0) {
                        setTimeout(handleVictory, Math.max(500, evolutionDelay));
                        return;
                    }

                    const un = [];
                    for (let i = 0; i < 151; i++) {
                        if (state.pokedex[i] === "0") un.push(i + 1);
                    }
                    state.currentOppId = un.length > 0
                        ? un[Math.floor(Math.random() * un.length)]
                        : Math.floor(Math.random() * 151) + 1;

                    state.oppHP = 5;
                }

                updateHPUI();

                if (state.currentList.length === 0) {
                    setTimeout(handleVictory, Math.max(500, evolutionDelay));
                } else {
                    setTimeout(loadWord, Math.max(600, evolutionDelay));
                }
                return;
            }

            // 練習模式／星號練習維持原本流程。
            if (state.mode === 'practice' || state.mode === 'priority') {
                state.index++;
                state.tempPractice = false;

                if (state.oppHP > 0 && state.mode !== 'priority') {
                    state.oppHP--;
                }

                if (state.index >= state.currentList.length) {
                    setTimeout(handleVictory, 500);
                    return;
                }

                updateHPUI();
                setTimeout(loadWord, 600);
            }
        } else {
            // 只記錄答錯；答對完全不寫 Log。
            addErrorLog(word, ui || '(空白)');

            boxes.forEach(b => {
                b.classList.add('wrong');
                setTimeout(() => b.classList.remove('wrong'), 800);
            });

            if (state.mode === 'quiz' && !state.tempPractice) {
                state.playerHP--;
                showDamage('player',1);
                document.getElementById('btn-force-practice').style.display = "flex";

                if (state.playerHP <= 0) {
                    handlePlayerDeath();
                    return;
                }
            }

            updateHPUI();
        }
    }

    function handlePass() {
        if (state.index >= state.currentList.length) return;

        if (state.mode === 'quiz' && !state.tempPractice) {
            // 魔王挑戰不能用 PASS 把單字永久跳掉；放到隊伍最後，之後仍會考到。
            const word = state.currentList.splice(state.index, 1)[0];
            state.currentList.push(word);
            state.index = 0;
        } else {
            state.index++;
        }

        state.tempPractice = false;
        updateHPUI();
        loadWord();
    }

     * - W1-W4 目前使用的單字採明確規則，避免自動演算法切錯。
     * - 這裡只改「視覺分組」，不修改孩子真正要拼寫的答案。
     */
    const COMMON_SYLLABLES = {
        dinosaur:['di','no','saur'],
        million:['mil','lion'],
        street:['street'],
        earth:['earth'],
        dance:['dance'],
        cloud:['cloud'],
        lake:['lake'],

    function fallbackSyllables(raw) {
        const text = String(raw || '');
        const words = text.split(/(\s+|[\/-])/);
        const out = [];
        words.forEach(part => {
            if (!part) return;
            if (/^\s+$/.test(part) || /^[\/-]$/.test(part)) { out.push(part); return; }
            const w = part.toLowerCase();
            if (COMMON_SYLLABLES[w]) { out.push(...COMMON_SYLLABLES[w]); return; }
            if (!/[a-z]/i.test(part)) { out.push(part); return; }
            const chars = Array.from(part);
            const vowels = /[aeiouy]/i;
            const chunks = []; let start = 0; let i = 0;
            while (i < chars.length) {
                if (vowels.test(chars[i])) {
                    let nucleusEnd = i + 1;
                    while (nucleusEnd < chars.length && vowels.test(chars[nucleusEnd])) nucleusEnd++;
                    let end = nucleusEnd;
                    if (end < chars.length) {
                        let j = end;
                        while (j < chars.length && !vowels.test(chars[j])) j++;
                        const consonants = j - end;
                        if (j < chars.length && consonants > 1) end = end + consonants - 1;
                        else end = j;
                    }
                    chunks.push(chars.slice(start, end).join(''));
                    start = end; i = end;
                } else i++;
            }
            if (start < chars.length) {
                if (chunks.length) chunks[chunks.length-1] += chars.slice(start).join('');
                else chunks.push(part);
            }
            out.push(...(chunks.length ? chunks : [part]));
        });
        return out;
    }

    function playPhonicsPart(button, item) {
        if (!item || item[2]) return;
        if (!('speechSynthesis' in window)) return;

        const key = `${item[0]}:${item[1]}`;
        const spoken = PHONICS_AUDIO_TEXT[key];
        if (!spoken) return;

        window.speechSynthesis.cancel();
        document.querySelectorAll('.practice-phonics-item.is-playing').forEach(x => x.classList.remove('is-playing'));
        button.classList.add('is-playing');

        const utter = new SpeechSynthesisUtterance(spoken);
        utter.lang = 'en-US';
        utter.rate = 0.62;
        utter.pitch = 1;
        utter.volume = 1;
        utter.onend = () => button.classList.remove('is-playing');
        utter.onerror = () => button.classList.remove('is-playing');
        window.speechSynthesis.speak(utter);
    }

    function renderPracticePhonics(el, text) {

        data.parts.forEach(item => {
            const box = document.createElement('button');
            box.type = 'button';
            box.className = 'practice-phonics-item';
            box.title = item[2] ? '不發音' : '點一下聽示範音';
            box.setAttribute('aria-label', item[2] ? `${item[0]}：不發音` : `${item[0]}：播放示範音`);
            box.addEventListener('click', () => playPhonicsPart(box, item));
            const letters = document.createElement('span');
            letters.className = 'practice-phonics-letter' + (item[2] ? ' practice-silent' : '');
            letters.textContent = item[0];
            const arrow = document.createElement('span');
            arrow.className = 'practice-phonics-arrow';
            arrow.textContent = '→';
            const sound = document.createElement('span');
            sound.className = 'practice-phonics-sound';
            sound.textContent = item[1];
            box.append(letters, arrow, sound);
            if (!item[2]) {
                const speaker = document.createElement('span');
                speaker.className = 'practice-phonics-speaker';
                speaker.textContent = '🔊';
                box.appendChild(speaker);
            }
            row.appendChild(box);
        });

    function renderPracticeGuide(text) {
        const el = document.getElementById('practice-guide');
        if (!el) return;
        el.innerHTML = '';
        if (!text) return;

        const note = document.createElement('div');
        note.className = 'practice-phonics-note';
        note.textContent = '自然發音：先看音節，再看字母／字母群怎麼發音；🔊 點一下聽對應示範音';
        el.appendChild(note);

        const parts = fallbackSyllables(text);
        let syllableIndex = 0;
        parts.forEach(part => {
            if (/^\s+$/.test(part)) {
                const s = document.createElement('span');
                s.className = 'practice-syllable-separator';
                s.textContent = ' ';
                el.appendChild(s);
            } else if (/^[\/-]$/.test(part)) {
                const s = document.createElement('span');
                s.className = 'practice-syllable-separator';
                s.textContent = part;
                el.appendChild(s);
            } else {
                const s = document.createElement('span');
                s.className = 'practice-syllable';
                const colorNo = (syllableIndex % 6) + 1;
                s.classList.add(`color-${colorNo}`);
                s.dataset.syllable = String(syllableIndex++);
                s.textContent = part;
                el.appendChild(s);
            }
        });

        renderPracticePhonics(el, text);
    }

    function playVoice() {
        const word = state.currentList[state.index];
        if (!word || !word.en) return;
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(word.en);
        m.lang = 'en-US';
        /* 比原本慢約 20%，方便孩子聽清楚每個音節。 */
        m.rate = 0.78;
        m.pitch = 1;
        m.volume = 1;
        window.speechSynthesis.speak(m);
    }
    

    let sentenceTargetWord = '';

    function openSentencePractice() {
        const word = state.currentList[state.index];
        const input = document.getElementById('sentence-inline-input');
        const result = document.getElementById('sentence-inline-result');
        const wordEl = document.getElementById('sentence-inline-word');
        if (!word || !input) return;
        sentenceTargetWord = String(word.en || '').trim();
        if (wordEl) wordEl.textContent = sentenceTargetWord;
        if (result) { result.style.display = 'none'; result.className = 'sentence-status'; result.innerHTML = ''; }
        input.focus();
    }

    function closeSentencePractice() {
        const input = document.getElementById('sentence-inline-input');
        const result = document.getElementById('sentence-inline-result');
        if (input) input.value = '';
        if (result) { result.style.display = 'none'; result.className = 'sentence-status'; result.innerHTML = ''; }
    }

    function closeSentenceByBackdrop(event) {
        if (event.target && event.target.id === 'sentence-overlay') {
            closeSentencePractice();
        }
    }

    function escapeSentenceHtml(text) {
        return String(text || '').replace(/[&<>"']/g, ch => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[ch]));
    }

    function normalizeSentenceWord(text) {
        return String(text || '').trim().toLowerCase().replace(/[.,!?;:'"()[\]{}]/g, '');
    }

    // V1448：造句判斷必須同時接受「原形」與「合理複數型」。
    // 例如：dinosaur → dinosaurs、lake → lakes、city → cities、box → boxes。
    // 造句目標字判斷：接受合理複數，但避免把所有單字一律加 s 造成誤判。
    // 目前課綱常用字先採明確字典；其他一般可數名詞再使用基本規則。
    function getSentenceTargetVariants(target) {
        const normalized = normalizeSentenceWord(target).replace(/\s+/g, ' ');
        if (!normalized) return [];

        const variants = new Set([normalized]);
        const parts = normalized.split(' ');
        const last = parts[parts.length - 1];

        // 本題庫／國小常用字的明確複數型。
        const explicitPlural = {
            dinosaur:'dinosaurs', million:'millions', street:'streets', dance:'dances',
            cloud:'clouds', lake:'lakes', valley:'valleys', yesterday:'yesterdays',
            camp:'camps', map:'maps', star:'stars', hundred:'hundreds', ninety:'nineties',
            east:'easts', north:'norths', south:'souths', west:'wests', far:'fars',
            lizard:'lizards', castle:'castles', gold:'golds', american:'americans',
            australian:'australians', country:'countries', flag:'flags',
            'picnic table':'picnic tables', 'parking lot':'parking lots',
            child:'children', person:'people', man:'men', woman:'women', mouse:'mice',
            goose:'geese', tooth:'teeth', foot:'feet', louse:'lice', ox:'oxen'
        };

        // 這些在彥勛目前題庫中視為專有名詞／不可數或非名詞，不自動產生複數。
        const noPlural = new Set([
            'earth','today','near','gold','australia','china','egypt',
            'eighty','fifty','forty','seventy','sixty','thirty','twenty',
            'million','hundred','ninety'
        ]);

        if (explicitPlural[normalized]) {
            variants.add(explicitPlural[normalized]);
            return [...variants];
        }
        if (noPlural.has(normalized)) return [...variants];

        // 多字單字只複數化最後一個字：picnic table → picnic tables。
        let plural = last;
        if (/(?:s|x|z|ch|sh)$/.test(last)) {
            plural = last + 'es';
        } else if (/[^aeiou]y$/.test(last)) {
            plural = last.slice(0, -1) + 'ies';
        } else if (/[^aeiou]o$/.test(last)) {
            // 國小常見規則中部分字尾 o 加 es；不確定的字則保留單數即可。
            plural = last + 'es';
        } else if (/(?:f|fe)$/.test(last)) {
            // f/fe 有許多例外，因此同時接受規則 +s 與常見 ves 型。
            const p1 = [...parts]; p1[p1.length - 1] = last + 's'; variants.add(p1.join(' '));
            plural = last.replace(/fe$/, 'ves').replace(/f$/, 'ves');
        } else {
            plural = last + 's';
        }
        const pluralParts = [...parts];
        pluralParts[pluralParts.length - 1] = plural;
        variants.add(pluralParts.join(' '));

        // 若題庫本身輸入的是複數字，也接受其對應的常見單數型。
        if (/ies$/.test(last)) {
            const p = [...parts]; p[p.length - 1] = last.slice(0, -3) + 'y'; variants.add(p.join(' '));
        } else if (/(?:ches|shes|xes|zes|ses)$/.test(last)) {
            const p = [...parts]; p[p.length - 1] = last.slice(0, -2); variants.add(p.join(' '));
        } else if (/s$/.test(last) && !/ss$/.test(last)) {
            const p = [...parts]; p[p.length - 1] = last.slice(0, -1); variants.add(p.join(' '));
        }

        return [...variants];
    }

    function sentenceContainsTarget(sentence, target) {
        const text = String(sentence || '').toLowerCase();
        const variants = getSentenceTargetVariants(target);
        if (!variants.length) return false;

        // 以「完整英文單字」比對，不會把 lake 誤判成 lakeship。
        return variants.some(variant => {
            const pattern = variant
                .split(' ')
                .map(part => part.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
                .join('\\s+');
            return new RegExp(`(?:^|[^a-z])${pattern}(?:$|[^a-z])`, 'i').test(text);
        });
    }

    function localSentenceChecks(sentence, target) {
        const text = String(sentence || '').trim();
        const issues = [];

        if (!text) {
            issues.push('請先寫一句英文句子。');
            return issues;
        }
        if (!sentenceContainsTarget(text, target)) {
            issues.push(`句子裡還沒有使用目標單字「${target}」（也可使用合理的複數型）。`);
        }
        if (!/[.!?]$/.test(text)) {
            issues.push('建議在句尾加上句號、問號或驚嘆號。');
        }
        if (/^(i|you|he|she|it|we|they|this|that|there)\s+(am|is|are|was|were)\s+\w+\s+\w+/i.test(text)) {
            // 僅作為提示，不直接判錯。
        }
        if (/\s{2,}/.test(text)) {
            issues.push('單字之間不要有連續兩個以上空格。');
        }
        if (/[,.!?]{2,}$/.test(text)) {
            issues.push('句尾標點可以只留一個。');
        }
        return issues;
    }

    function formatLanguageToolMessage(match) {
        const msg = escapeSentenceHtml(match.message || '可能有文法或拼字問題。');
        const replacements = Array.isArray(match.replacements) ? match.replacements.slice(0, 3).map(x => x.value).filter(Boolean) : [];
        if (!replacements.length) return msg;
        return `${msg}<div class="sentence-correction">建議：<b>${replacements.map(escapeSentenceHtml).join('、')}</b></div>`;
    }

    async function checkSentenceGrammar() {
        const input = document.getElementById('sentence-inline-input');
        const result = document.getElementById('sentence-inline-result');
        if (!input || !result) return;

        const sentence = String(input.value || '').trim();
        result.style.display = 'block';
        result.className = 'sentence-status sentence-loading';
        result.innerHTML = '⏳ 正在檢查文法與拼字……';

        const localIssues = localSentenceChecks(sentence, sentenceTargetWord);
        if (!sentence) {
            result.className = 'sentence-status error';
            result.innerHTML = '❌ 請先寫一句英文句子。';
            return;
        }

        let matches = [];
        let apiOK = false;

        try {
            const body = new URLSearchParams();
            body.set('text', sentence);
            body.set('language', 'en-US');
            body.set('enabledOnly', 'false');

            const response = await fetch('https://api.languagetool.org/v2/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body.toString()
            });

            if (response.ok) {
                const data = await response.json();
                matches = Array.isArray(data.matches) ? data.matches : [];
                apiOK = true;
            }
        } catch (e) {
            apiOK = false;
        }

        const targetMissing = localIssues.some(x => x.includes('還沒有使用目標單字'));
        const simpleIssues = localIssues.filter(x => !x.includes('還沒有使用目標單字'));

        if (apiOK) {
            const usefulMatches = matches.filter(m => m && m.message && m.rule);
            if (!targetMissing && usefulMatches.length === 0 && simpleIssues.length === 0) {
                result.className = 'sentence-status good';
                result.innerHTML = '✅ <b>目前沒有找到明顯的文法或拼字問題！</b><div class="sentence-example">很好，繼續用這個單字造句。</div>';
                return;
            }

            let html = '';
            if (targetMissing) {
                html += `<div>⚠️ ${escapeSentenceHtml(`句子裡還沒有使用目標單字「${sentenceTargetWord}」。`)}</div>`;
            }
            if (usefulMatches.length) {
                html += '<div style="margin-top:5px;">' +
                    usefulMatches.slice(0, 5).map((m, i) => `${i + 1}. ${formatLanguageToolMessage(m)}`).join('<div style="margin-top:7px;"></div>') +
                    '</div>';
            }
            if (simpleIssues.length) {
                html += `<div style="margin-top:7px;">${simpleIssues.map(x => `• ${escapeSentenceHtml(x)}`).join('<br>')}</div>`;
            }

            result.className = 'sentence-status warn';
            result.innerHTML = html || '⚠️ 有一些地方建議再檢查。';
            showSentenceNextButton();
            return;
        }

        // 網路文法服務無法使用時，仍提供本機基本檢查，不假裝是完整文法判定。
        if (!targetMissing && simpleIssues.length === 0) {
            result.className = 'sentence-status warn';
            result.innerHTML = '⚠️ 線上文法服務目前無法連線。<br>基本檢查沒有發現明顯問題，但這不代表文法已完整確認。';
        } else {
            result.className = 'sentence-status warn';
            result.innerHTML =
                (targetMissing ? `⚠️ 句子裡還沒有使用目標單字「${escapeSentenceHtml(sentenceTargetWord)}」。<br>` : '') +
                (simpleIssues.length ? simpleIssues.map(x => `• ${escapeSentenceHtml(x)}`).join('<br>') : '') +
                '<div style="margin-top:7px;">目前無法連線完整文法檢查服務。</div>';
        }
    }

    function renderTeam() {
        const nameEl = document.getElementById('team-child-name');
        if (nameEl) nameEl.textContent = getChildName();
        const grid=document.getElementById('team-grid');
        grid.innerHTML='';
        const current=document.getElementById('current-team-name');
        const active=getEvoInfo(state.activePokeId);
        current.innerText=state.awaitingPartner
            ? '⚠️ 夥伴已倒下：請選擇另一隻夥伴繼續戰鬥'
            : `目前出戰：${PK_NAMES[active.displayId] || 'No.'+active.displayId}（點擊其他寶可夢即可更換）`;

        let ids=[384,150,992];
        for(let i=1;i<=151;i++) if(state.pokedex[i-1]==='1' && !ids.includes(i)) ids.push(i);

        ids.forEach(id=>{
            const info=getEvoInfo(id);
            const it=document.createElement('div');
            const blocked = state.awaitingPartner && id === state.activePokeId;
            it.className=`grid-item collected ${state.activePokeId==id?'active':''} ${blocked?'defeated':''}`;
            const status = blocked
                ? '💥 已倒下・不可再次出戰'
                : (state.activePokeId==id ? '⚔️ 出戰中' : '點擊設為出戰');
            it.innerHTML=`<img src="${getPokeImageUrl(info.displayId,true)}"><div class="name-zh">${PK_NAMES[info.displayId]||'No.'+info.displayId}</div><div class="team-status">${status}</div>`;
            const img = it.querySelector('img');
            setPokeImageFallback(img, info.displayId);

            it.onclick=()=>{
                if (state.awaitingPartner && id === state.activePokeId) {
                    alert('這隻夥伴剛剛已經 HP 歸零，請選擇另一隻夥伴。');
                    return;
                }
                state.activePokeId=id;
                setHeroData('hero_myPoke',id);
                if(state.awaitingPartner){
                    state.awaitingPartner=false;
                    state.playerHP=5;
                    updateHPUI();
                    switchView('view-game');
                    loadWord();
                } else {
                    renderTeam();
                }
            };
            grid.appendChild(it);
        });
    }

    function renderDex() {
        const nameEl = document.getElementById('dex-child-name');
        if (nameEl) nameEl.textContent = getChildName();
        const grid=document.getElementById('dex-grid'); grid.innerHTML='';
        let caught=0;
        for(let i=1;i<=151;i++){
            const captured=state.pokedex[i-1]==='1'; if(captured) caught++;
            const it=document.createElement('div');
            it.className=`grid-item ${captured?'collected':'locked'}`;
            it.innerHTML=`<img src="${getPokeImageUrl(i,true)}"><div class="name-zh">${PK_NAMES[i]||'No.'+i}</div>${captured?'<div class="caught-badge">已捕捉・可加入夥伴</div>':'<div style="color:#64748b;font-size:.7rem;">未捕捉</div>'}`;
            const img=it.querySelector('img');
            setPokeImageFallback(img,i);
            if(captured){
                it.style.cursor='pointer';
                it.onclick=()=>{ state.activePokeId=i; setHeroData('hero_myPoke',i); switchView('view-team'); };
            }
            grid.appendChild(it);
        }
        document.getElementById('dex-count').innerText=`已捕捉 ${caught} / 151｜捕捉後可加入「我的夥伴」並在下一場出戰`;
    }
</script>
